<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW DARK</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #050505;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 30%, #242424 0%, #090909 55%, #000 100%);
}

#loading {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #020202;
}

.logo {
  font-size: 48px;
  font-weight: 900;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #fff;
  margin-bottom: 35px;
}

.loadingText {
  font-size: 20px;
  margin-bottom: 15px;
}

.bar {
  width: 75%;
  max-width: 400px;
  height: 15px;
  border: 2px solid white;
  border-radius: 20px;
  overflow: hidden;
}

#barFill {
  width: 0%;
  height: 100%;
  background: white;
  transition: width .05s linear;
}

#menu {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,.35);
}

#menu h1 {
  font-size: 55px;
  letter-spacing: 7px;
  text-shadow: 0 0 25px #ff4500;
}

#menu p {
  margin-top: 15px;
  font-size: 19px;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .3; }
}

#hud {
  position: absolute;
  top: 18px;
  left: 20px;
  right: 20px;
  z-index: 10;
  display: none;
  justify-content: space-between;
  font-size: 18px;
  font-weight: bold;
}

#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 90px;
  background: linear-gradient(#242424,#090909);
  border-top: 3px solid #555;
  box-shadow: 0 -5px 25px #111;
}

#player {
  position: absolute;
  width: 45px;
  height: 45px;
  left: 70px;
  bottom: 90px;
  background: linear-gradient(135deg,#fff,#ff6a00,#ff0000);
  border-radius: 7px;
  box-shadow:
    0 0 8px #fff,
    0 0 20px #ff4500,
    0 0 40px #ff0000;
  transform: rotate(0deg);
}

.flame {
  position: absolute;
  width: 18px;
  height: 30px;
  left: 13px;
  top: 38px;
  background: linear-gradient(#fff,#ff9900,#ff0000);
  clip-path: polygon(50% 100%,0 35%,35% 50%,45% 0,75% 48%,100% 30%);
  filter: blur(1px);
}

.spike {
  position: absolute;
  bottom: 90px;
  width: 0;
  height: 0;
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-bottom: 45px solid #ddd;
  filter: drop-shadow(0 0 8px #fff);
}

.block {
  position: absolute;
  bottom: 90px;
  width: 45px;
  height: 55px;
  background: linear-gradient(135deg,#444,#111);
  border: 2px solid #aaa;
  box-shadow: 0 0 12px #555;
}

#message {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(0,0,0,.8);
}

#message h2 {
  font-size: 42px;
  margin-bottom: 15px;
}

#message p {
  font-size: 18px;
}
</style>
</head>

<body>

<div id="game">

  <div id="loading">
    <div class="logo">NEW DARK</div>
    <div class="loadingText">CARREGANDO <span id="percent">0</span>%</div>
    <div class="bar">
      <div id="barFill"></div>
    </div>
  </div>

  <div id="menu">
    <h1>NEW DARK</h1>
    <p>👆 CLIQUE PARA COMEÇAR</p>
  </div>

  <div id="hud">
    <div>FASE <span id="level">1</span>/40</div>
    <div>⭐ <span id="score">0</span></div>
  </div>

  <div id="player">
    <div class="flame"></div>
  </div>

  <div id="ground"></div>

  <div id="message">
    <h2 id="messageTitle">GAME OVER</h2>
    <p id="messageText">Toque para tentar novamente</p>
  </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const loading = document.getElementById("loading");
const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const message = document.getElementById("message");

const percent = document.getElementById("percent");
const barFill = document.getElementById("barFill");
const levelText = document.getElementById("level");
const scoreText = document.getElementById("score");

let loadingPercent = 0;

const loadingTimer = setInterval(() => {
  loadingPercent++;

  percent.textContent = loadingPercent;
  barFill.style.width = loadingPercent + "%";

  if (loadingPercent >= 100) {
    clearInterval(loadingTimer);

    setTimeout(() => {
      loading.style.display = "none";
      menu.style.display = "flex";
    }, 500);
  }
}, 25);


// ===============================
// CONFIGURAÇÃO
// ===============================

let playing = false;
let gameOver = false;

let level = 1;
let score = 0;

let playerY = 0;
let velocity = 0;

const gravity = 0.75;
const jumpPower = 13;

let obstacles = [];
let spawnTimer = 0;
let speed = 5;


// ===============================
// COMEÇAR
// ===============================

function startGame() {
  menu.style.display = "none";
  message.style.display = "none";
  hud.style.display = "flex";

  playing = true;
  gameOver = false;

  level = 1;
  score = 0;

  levelText.textContent = level;
  scoreText.textContent = score;

  playerY = 0;
  velocity = 0;

  obstacles.forEach(o => o.remove());
  obstacles = [];

  speed = 5;
  spawnTimer = 0;

  requestAnimationFrame(loop);
}

menu.addEventListener("click", startGame);
menu.addEventListener("touchstart", startGame);


// ===============================
// PULO
// ===============================

function jump() {

  if (!playing || gameOver) return;

  // só pula quando está no chão
  if (playerY <= 0) {
    velocity = jumpPower;
  }
}

document.addEventListener("click", e => {
  if (e.target.closest("#menu")) return;
  jump();
});

document.addEventListener("touchstart", e => {
  if (e.target.closest("#menu")) return;
  jump();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    jump();
  }
});


// ===============================
// CRIAR OBSTÁCULOS
// ===============================

function createObstacle() {

  const obstacle = document.createElement("div");

  // Depois de certas fases aparecem blocos também
  if (Math.random() < 0.25 && level >= 10) {

    obstacle.className = "block";

  } else {

    obstacle.className = "spike";
  }

  obstacle.style.left = window.innerWidth + "px";

  game.appendChild(obstacle);

  obstacles.push(obstacle);
}


// ===============================
// COLISÃO
// ===============================

function collision(a,b) {

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.right < r2.left ||
    r1.left > r2.right ||
    r1.bottom < r2.top ||
    r1.top > r2.bottom
  );
}


// ===============================
// GAME OVER
// ===============================

function loseGame() {

  playing = false;
  gameOver = true;

  message.style.display = "flex";

  document.getElementById("messageTitle").textContent = "GAME OVER";
  document.getElementById("messageText").textContent =
    "Toque na tela para tentar novamente";
}

message.addEventListener("click", () => {

  if (gameOver) {
    startGame();
  }

});

message.addEventListener("touchstart", () => {

  if (gameOver) {
    startGame();
  }

});


// ===============================
// PRÓXIMA FASE
// ===============================

function checkLevel() {

  const newLevel = Math.min(40, Math.floor(score / 10) + 1);

  if (newLevel !== level) {

    level = newLevel;

    levelText.textContent = level;

    // fica mais rápido
    speed = 5 + (level * 0.25);
  }

}


// ===============================
// LOOP
// ===============================

function loop() {

  if (!playing) return;

  // gravidade
  velocity -= gravity;
  playerY += velocity;

  // chão
  if (playerY < 0) {
    playerY = 0;
    velocity = 0;
  }

  player.style.bottom = (90 + playerY) + "px";

  // rotação
  player.style.transform =
    "rotate(" + (-playerY * 1.2) + "deg)";


  // obstáculos
  spawnTimer--;

  const spawnDistance =
    Math.max(45, 100 - level * 1.5);

  if (spawnTimer <= 0) {

    createObstacle();

    spawnTimer =
      spawnDistance +
      Math.random() * 60;
  }


  // mover obstáculos
  obstacles.forEach((obstacle, index) => {

    let left =
      parseFloat(obstacle.style.left);

    left -= speed;

    obstacle.style.left = left + "px";


    // colisão
    if (collision(player, obstacle)) {
      loseGame();
    }


    // saiu da tela
    if (left < -100) {

      obstacle.remove();
      obstacles.splice(index,1);

      score++;

      scoreText.textContent = score;

      checkLevel();
    }

  });


  requestAnimationFrame(loop);
}
</script>

</body>
</html>
