<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>LILO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    font-family:Arial,sans-serif;
}

/* =========================
   CARREGAMENTO
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #252b34 0%,
    #090c11 55%,
    #020304 100%);

    color:white;
}

.logo{
    font-size:65px;
    font-weight:900;
    letter-spacing:10px;
    color:white;
    text-shadow:
    0 0 10px #ff0000,
    0 0 30px #b00000;

    margin-bottom:15px;
}

.loadingWolf{
    font-size:110px;
    margin-bottom:20px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
    margin-bottom:12px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin-bottom:14px;
}

.bar{
    width:280px;
    height:12px;
    border-radius:20px;
    background:#222;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #870000,
        #ff2020
    );

    box-shadow:0 0 15px red;
}

/* =========================
   MENU
========================= */

#menu{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #252b33,
    #080a0e 65%,
    #020304);

    color:white;
}

.menuTitle{
    font-size:65px;
    font-weight:900;
    letter-spacing:10px;

    text-shadow:
    0 0 15px red,
    0 0 35px #700000;

    margin-bottom:5px;
}

.subtitle{
    color:#aaa;
    letter-spacing:3px;
    margin-bottom:25px;
}

/* =========================
   LOBO DA CAPA
   PARADO COMO FOTO
========================= */

.wolfPhoto{
    width:270px;
    height:300px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    overflow:hidden;

    border-radius:25px;

    background:
    radial-gradient(
        circle at 50% 35%,
        #687078,
        #30363d 35%,
        #11151a 75%,
        #050608
    );

    box-shadow:
    0 20px 50px rgba(0,0,0,.8),
    0 0 35px rgba(255,0,0,.18);

    margin-bottom:25px;
}

/* lobo */

.coverWolf{
    position:relative;
    width:190px;
    height:260px;
}

/* corpo */

.coverBody{
    position:absolute;

    width:145px;
    height:130px;

    left:22px;
    bottom:0;

    border-radius:
    55% 55% 25% 25%;

    background:
    linear-gradient(
        150deg,
        #646c73,
        #30353a 55%,
        #101317
    );

    box-shadow:
    inset -20px -15px 25px #07090b;
}

/* cabeça */

.coverHead{
    position:absolute;

    width:130px;
    height:140px;

    left:30px;
    top:30px;

    border-radius:
    48% 48% 45% 45%;

    background:
    linear-gradient(
        145deg,
        #737a80,
        #383e44 50%,
        #121519
    );

    box-shadow:
    inset -18px -15px 25px #080a0d;
}

/* orelhas */

.coverEar{
    position:absolute;

    width:55px;
    height:85px;

    top:0;

    background:
    linear-gradient(
        145deg,
        #50575e,
        #171b20
    );

    clip-path:
    polygon(50% 0,100% 100%,0 100%);
}

.coverEar.left{
    left:20px;
    transform:rotate(-13deg);
}

.coverEar.right{
    right:10px;
    transform:rotate(13deg);
}

/* olhos */

.coverEye{
    position:absolute;

    width:18px;
    height:11px;

    top:75px;

    border-radius:50%;

    background:#ff1515;

    box-shadow:
    0 0 8px red,
    0 0 18px red;
}

.coverEye.left{
    left:32px;
}

.coverEye.right{
    right:32px;
}

/* focinho */

.coverMuzzle{
    position:absolute;

    width:60px;
    height:65px;

    left:35px;
    bottom:15px;

    border-radius:50%;

    background:
    linear-gradient(
        150deg,
        #c2c4c5,
        #73777a
    );
}

.coverNose{
    position:absolute;

    width:27px;
    height:19px;

    left:51px;
    bottom:42px;

    border-radius:50%;

    background:#050505;
}

/* =========================
   BOTÃO
========================= */

.startButton{
    width:245px;
    padding:17px;

    border:2px solid #777;
    border-radius:12px;

    background:
    linear-gradient(
        180deg,
        #292d32,
        #101216
    );

    color:white;

    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.6);
}

/* =========================
   JOGO
========================= */

#game{
    display:none;

    position:fixed;
    inset:0;

    background:#76c9ec;
}

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

/* HUD */

#hud{
    position:absolute;

    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;

    font-size:20px;
    font-weight:bold;

    text-shadow:
    2px 2px 5px #000;

    z-index:10;
}

#lives{
    letter-spacing:4px;
}

#coins{
    color:#ffe22b;
}

/* aviso */

#tapStart{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:25px;
    font-weight:bold;

    text-align:center;

    text-shadow:
    0 0 10px #000,
    2px 2px 5px #000;

    z-index:20;

    pointer-events:none;
}

#tapStart small{
    display:block;
    margin-top:10px;
    font-size:15px;
    color:#ddd;
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    display:none;

    position:absolute;
    inset:0;

    z-index:40;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.8);

    color:white;
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
    margin-bottom:15px;
}

.restart{
    margin-top:20px;

    padding:15px 40px;

    border:0;
    border-radius:10px;

    background:#870000;

    color:white;

    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="logo">LILO</div>

    <div class="loadingWolf">🐺</div>

    <div class="loadingText">
        CARREGANDO
    </div>

    <div id="percent">
        0%
    </div>

    <div class="bar">
        <div id="barFill"></div>
    </div>

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menuTitle">
        LILO
    </div>

    <div class="subtitle">
        CORRA • PULE • SOBREVIVA
    </div>

    <div class="wolfPhoto">

        <div class="coverWolf">

            <div class="coverEar left"></div>
            <div class="coverEar right"></div>

            <div class="coverHead">

                <div class="coverEye left"></div>
                <div class="coverEye right"></div>

                <div class="coverMuzzle"></div>
                <div class="coverNose"></div>

            </div>

            <div class="coverBody"></div>

        </div>

    </div>

    <button class="startButton" id="startButton">
        TOQUE PARA JOGAR
    </button>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            🪙 <span id="coins">0</span>
        </div>

        <div>
            FASE <span id="level">1</span>
        </div>

    </div>

    <div id="tapStart">

        TOQUE NA TELA PARA COMEÇAR

        <small>
            Toque para pular
        </small>

    </div>

    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            Você chegou à fase
            <span id="finalLevel">1</span>
        </div>

        <div>
            Moedas:
            <span id="finalCoins">0</span>
        </div>

        <button class="restart" id="restart">
            JOGAR NOVAMENTE
        </button>

    </div>

</div>


<script>

/* =========================
   CARREGAMENTO
========================= */

let load=0;

function loading(){

    load++;

    if(load>100)
        load=100;

    document.getElementById(
        "percent"
    ).textContent=load+"%";

    document.getElementById(
        "barFill"
    ).style.width=load+"%";

    if(load<100){

        setTimeout(loading,35);

    }else{

        setTimeout(()=>{

            document.getElementById(
                "loading"
            ).style.display="none";

            document.getElementById(
                "menu"
            ).style.display="flex";

        },500);

    }
}

loading();


/* =========================
   CANVAS
========================= */

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

let W,H;

function resize(){

    W=canvas.width=
    window.innerWidth;

    H=canvas.height=
    window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   VARIÁVEIS
========================= */

let player;

let obstacles=[];
let coins=[];

let running=false;
let started=false;

let coinCount=0;
let level=1;
let lives=3;

let speed=5;

let obstacleTimer=0;
let coinTimer=0;

let legAnimation=0;


/* =========================
   RESET
========================= */

function reset(){

    player={

        x:75,
        y:H-145,

        w:65,
        h:65,

        vy:0,

        grounded:true

    };

    obstacles=[];
    coins=[];

    coinCount=0;
    level=1;
    lives=3;

    speed=5;

    obstacleTimer=80;
    coinTimer=40;

    document.getElementById(
        "coins"
    ).textContent=0;

    document.getElementById(
        "level"
    ).textContent=1;

    updateLives();

}


/* =========================
   INICIAR
========================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "game"
    ).style.display="block";

    reset();

    running=false;
    started=false;

    document.getElementById(
        "tapStart"
    ).style.display="block";

    requestAnimationFrame(loop);

}


/* =========================
   COMEÇAR AO TOCAR
========================= */

function touchGame(){

    if(!started){

        started=true;
        running=true;

        document.getElementById(
            "tapStart"
        ).style.display="none";

        jump();

        return;

    }

    jump();

}


/* =========================
   PULO
========================= */

function jump(){

    if(!running)
        return;

    if(player.grounded){

        player.vy=-13;

        player.grounded=false;

    }

}


/* =========================
   VIDA
========================= */

function updateLives(){

    let hearts="";

    for(let i=0;i<3;i++){

        if(i<lives)
            hearts+="❤️";
        else
            hearts+="🖤";

    }

    document.getElementById(
        "lives"
    ).textContent=hearts;

}


/* =========================
   PERDE VIDA
========================= */

function hitObstacle(index){

    obstacles.splice(index,1);

    lives--;

    updateLives();

    /* pequeno recuo */

    player.vy=-7;

    if(lives<=0){

        gameOver();

    }

}


/* =========================
   CRIAR OBSTÁCULO
========================= */

function spawnObstacle(){

    const types=[
        "spike",
        "rock",
        "box",
        "doubleSpike"
    ];

    const type=
    types[
        Math.floor(
            Math.random()*types.length
        )
    ];

    let w=50;
    let h=50;

    if(type==="doubleSpike"){

        w=85;
        h=50;

    }

    obstacles.push({

        x:W+60,

        y:H-95,

        w:w,
        h:h,

        type:type

    });

}


/* =========================
   CRIAR MOEDA
========================= */

function spawnCoin(){

    coins.push({

        x:W+40,

        y:H-170-
        Math.random()*130,

        r:15

    });

}


/* =========================
   DESENHAR FUNDO
========================= */

function background(){

    let sky=
    ctx.createLinearGradient(
        0,0,0,H
    );

    sky.addColorStop(
        0,
        level%2===0
        ? "#ffb36b"
        : "#68bde8"
    );

    sky.addColorStop(
        1,
        level%2===0
        ? "#ffe1a8"
        : "#d6f2ff"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,W,H
    );


    /* sol */

    ctx.fillStyle=
    level%2===0
    ? "#ffdf7b"
    : "#fff0a0";

    ctx.beginPath();

    ctx.arc(
        W-90,
        85,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* árvores distantes */

    for(let i=0;i<7;i++){

        let x=
        (i*180-
        ((performance.now()/40*speed)%180));

        ctx.fillStyle="#47643e";

        ctx.beginPath();

        ctx.arc(
            x,
            H-110,
            55,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* chão */

    ctx.fillStyle="#4d673d";

    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );

    ctx.fillStyle="#30472a";

    ctx.fillRect(
        0,
        H-65,
        W,
        8
    );

}


/* =========================
   DESENHAR LOBO
========================= */

function drawPlayer(){

    const x=player.x;
    const y=player.y;

    legAnimation+=0.25;

    /*
       SOMENTE as pernas se movimentam.
       O corpo permanece estável.
    */

    let leg1=
    Math.sin(legAnimation)*7;

    let leg2=
    Math.sin(legAnimation+Math.PI)*7;


    /* sombra */

    ctx.fillStyle=
    "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x+30,
        H-67,
        38,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* pernas traseiras */

    ctx.strokeStyle="#171a1d";
    ctx.lineWidth=11;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        x+15,
        y+45
    );

    ctx.lineTo(
        x+12+leg1,
        y+68
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x+43,
        y+45
    );

    ctx.lineTo(
        x+43+leg2,
        y+68
    );

    ctx.stroke();


    /* corpo */

    let body=
    ctx.createLinearGradient(
        x,
        y,
        x+60,
        y+60
    );

    body.addColorStop(
        0,
        "#666d73"
    );

    body.addColorStop(
        .55,
        "#30353a"
    );

    body.addColorStop(
        1,
        "#111418"
    );

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.roundRect(
        x,
        y+18,
        52,
        38,
        16
    );

    ctx.fill();


    /* cauda */

    ctx.strokeStyle="#252a2f";
    ctx.lineWidth=13;

    ctx.beginPath();

    ctx.moveTo(
        x+8,
        y+27
    );

    ctx.quadraticCurveTo(
        x-20,
        y+5,
        x-13,
        y-10
    );

    ctx.stroke();


    /* pescoço */

    ctx.fillStyle="#3c4248";

    ctx.beginPath();

    ctx.arc(
        x+42,
        y+23,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* cabeça */

    ctx.fillStyle="#596168";

    ctx.beginPath();

    ctx.arc(
        x+43,
        y+18,
        23,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* orelhas */

    ctx.fillStyle="#252a2f";

    ctx.beginPath();

    ctx.moveTo(
        x+27,
        y+4
    );

    ctx.lineTo(
        x+32,
        y-19
    );

    ctx.lineTo(
        x+42,
        y+6
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x+45,
        y+6
    );

    ctx.lineTo(
        x+58,
        y-17
    );

    ctx.lineTo(
        x+61,
        y+12
    );

    ctx.fill();


    /* focinho */

    ctx.fillStyle="#b1b3b4";

    ctx.beginPath();

    ctx.ellipse(
        x+46,
        y+27,
        17,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* nariz */

    ctx.fillStyle="#050505";

    ctx.beginPath();

    ctx.ellipse(
        x+50,
        y+25,
        8,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* olho vermelho */

    ctx.fillStyle="#ff1616";

    ctx.shadowColor="red";
    ctx.shadowBlur=10;

    ctx.beginPath();

    ctx.arc(
        x+51,
        y+15,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

}


/* =========================
   OBSTÁCULOS
========================= */

function drawObstacle(o){

    if(o.type==="spike"){

        ctx.fillStyle="#1a1d20";

        ctx.beginPath();

        ctx.moveTo(
            o.x,
            o.y+o.h
        );

        ctx.lineTo(
            o.x+o.w/2,
            o.y
        );

        ctx.lineTo(
            o.x+o.w,
            o.y+o.h
        );

        ctx.closePath();

        ctx.fill();

    }

    else if(o.type==="doubleSpike"){

        ctx.fillStyle="#17191c";

        for(let i=0;i<2;i++){

            let sx=
            o.x+i*42;

            ctx.beginPath();

            ctx.moveTo(
                sx,
                o.y+o.h
            );

            ctx.lineTo(
                sx+22,
                o.y
            );

            ctx.lineTo(
                sx+44,
                o.y+o.h
            );

            ctx.closePath();

            ctx.fill();

        }

    }

    else if(o.type==="rock"){

        ctx.fillStyle="#555b60";

        ctx.beginPath();

        ctx.arc(
            o.x+25,
            o.y+28,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    else{

        ctx.fillStyle="#593522";

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

        ctx.strokeStyle="#2b160d";

        ctx.lineWidth=3;

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

    }

}


/* =========================
   MOEDA
========================= */

function drawCoin(c){

    ctx.fillStyle="#ffd21c";

    ctx.shadowColor="#ffb000";
    ctx.shadowBlur=8;

    ctx.beginPath();

    ctx.arc(
        c.x,
        c.y,
        c.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle="#a86d00";
    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="#fff3a0";

    ctx.font=
    "bold 16px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        "L",
        c.x,
        c.y
    );

}


/* =========================
   COLISÃO
========================= */

function collision(a,b){

    return (

        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y

    );

}


/* =========================
   PASSAR DE FASE
========================= */

function checkLevel(){

    if(
        coinCount>=10
    ){

        coinCount=0;

        level++;

        speed+=0.8;

        document.getElementById(
            "coins"
        ).textContent=0;

        document.getElementById(
            "level"
        ).textContent=level;

        /*
           Pequena pausa visual
        */

        running=false;

        setTimeout(()=>{

            running=true;

        },500);

    }

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    document.getElementById(
        "finalCoins"
    ).textContent=coinCount;

    document.getElementById(
        "finalLevel"
    ).textContent=level;

    document.getElementById(
        "gameOver"
    ).style.display="flex";

}


/* =========================
   LOOP
========================= */

function loop(){

    if(!document.getElementById(
        "game"
    ).style.display ||
       document.getElementById(
        "game"
    ).style.display==="none"){

        return;

    }


    ctx.clearRect(
        0,0,W,H
    );

    background();


    if(started){

        /* física */

        player.vy+=.65;

        player.y+=player.vy;


        if(
            player.y>=H-130
        ){

            player.y=H-130;

            player.vy=0;

            player.grounded=true;

        }


        /* obstáculos */

        obstacleTimer--;

        if(
            obstacleTimer<=0
        ){

            spawnObstacle();

            obstacleTimer=
            Math.max(
                50,
                105-level*3
            );

        }


        for(
            let i=obstacles.length-1;
            i>=0;
            i--
        ){

            let o=obstacles[i];

            o.x-=speed;

            drawObstacle(o);


            if(
                collision(
                    player,
                    o
                )
            ){

                hitObstacle(i);

                break;

            }

        }


        obstacles=
        obstacles.filter(
            o=>o.x>-120
        );


        /* moedas */

        coinTimer--;

        if(
            coinTimer<=0
        ){

            spawnCoin();

            coinTimer=
            65+
            Math.random()*60;

        }


        for(
            let i=coins.length-1;
            i>=0;
            i--
        ){

            let c=coins[i];

            c.x-=speed;

            drawCoin(c);


            let box={

                x:c.x-c.r,
                y:c.y-c.r,
                w:c.r*2,
                h:c.r*2

            };


            if(
                collision(
                    player,
                    box
                )
            ){

                coins.splice(i,1);

                coinCount++;

                document.getElementById(
                    "coins"
                ).textContent=
                coinCount;

                checkLevel();

            }

        }


        coins=
        coins.filter(
            c=>c.x>-50
        );

    }


    drawPlayer();

    requestAnimationFrame(loop);

}


/* =========================
   CONTROLES
========================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


/*
   QUALQUER TOQUE NA ÁREA
   DO JOGO faz o personagem pular.
*/

document.getElementById(
    "game"
).addEventListener(
    "pointerdown",
    touchGame
);


document.getElementById(
    "restart"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "gameOver"
        ).style.display="none";

        reset();

        started=false;
        running=false;

        document.getElementById(
            "tapStart"
        ).style.display="block";

        requestAnimationFrame(loop);

    }
);

</script>
