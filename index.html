<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>LILI CAGAO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#343a42 0%,#101319 45%,#020304 100%);
    color:white;
}

.logo{
    font-size:48px;
    font-weight:1000;
    letter-spacing:6px;
    text-shadow:0 0 12px #ff1616,0 0 35px #a00000;
}

.loadingWolf{
    font-size:100px;
    margin:15px 0;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.bar{
    width:280px;
    height:12px;
    border-radius:20px;
    background:#222;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#720000,#ff2929);
    box-shadow:0 0 15px red;
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
    overflow:auto;
    flex-direction:column;
    align-items:center;
    padding:22px 15px 35px;
    background:
        radial-gradient(circle at 50% 20%,#343b43,#0c0f14 60%,#020304);
    color:white;
}

.menuTitle{
    font-size:46px;
    font-weight:1000;
    letter-spacing:5px;
    text-shadow:0 0 15px red,0 0 35px #700000;
}

.subtitle{
    color:#aaa;
    margin:4px 0 18px;
    letter-spacing:2px;
    text-align:center;
}

.sectionTitle{
    width:100%;
    max-width:520px;
    font-weight:bold;
    margin:8px 0;
    font-size:17px;
}

.characterList,
.mapList{
    width:100%;
    max-width:520px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:5px 2px 12px;
}

.card{
    min-width:135px;
    height:125px;
    border:2px solid #454b52;
    border-radius:16px;
    background:linear-gradient(145deg,#252a30,#0e1115);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    position:relative;
}

.card.selected{
    border-color:#ff3030;
    box-shadow:0 0 18px #8d0000;
}

.card.locked{
    opacity:.42;
    filter:grayscale(1);
}

.cardEmoji{
    font-size:48px;
}

.cardName{
    font-size:13px;
    font-weight:bold;
    margin-top:5px;
}

.lock{
    position:absolute;
    top:7px;
    right:8px;
}

.mapCard{
    min-width:150px;
    height:95px;
}

.mapIcon{
    font-size:32px;
}

.playButton{
    width:270px;
    padding:16px;
    margin-top:10px;
    border:2px solid #ff3636;
    border-radius:13px;
    background:linear-gradient(180deg,#a60000,#420000);
    color:white;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:0 8px 25px rgba(0,0,0,.6);
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    background:#76c9ec;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
    z-index:10;
}

#poop{
    color:#dca56d;
}

#homeButton{
    position:absolute;
    top:55px;
    right:12px;
    z-index:15;
    border:1px solid #aaa;
    border-radius:9px;
    background:rgba(0,0,0,.55);
    color:white;
    padding:9px 12px;
    font-weight:bold;
}

#tapStart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 0 10px #000,2px 2px 5px #000;
    z-index:20;
    pointer-events:none;
}

#tapStart small{
    display:block;
    margin-top:9px;
    font-size:14px;
    color:#ddd;
}

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:40;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center;
}

#gameOver h2{
    color:#ff2525;
    font-size:43px;
    margin-bottom:15px;
}

.restart,
.menuButton{
    margin-top:15px;
    padding:13px 30px;
    border:0;
    border-radius:10px;
    background:#780000;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.menuButton{
    background:#30363c;
}
</style>
</head>

<body>

<!-- ================= LOADING ================= -->

<div id="loading">
    <div class="logo">LILI CAGAO</div>
    <div class="loadingWolf">🐺</div>
    <div class="loadingText">CARREGANDO</div>
    <div id="percent">0%</div>
    <div class="bar">
        <div id="barFill"></div>
    </div>
</div>

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menuTitle">LILI CAGAO</div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="sectionTitle">🐺 ESCOLHA SEU PERSONAGEM</div>

    <div class="characterList">

        <button class="card selected" data-character="wolf">
            <div class="cardEmoji">🐺</div>
            <div class="cardName">LOBO</div>
        </button>

        <button class="card locked" data-character="dog">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🐕</div>
            <div class="cardName">CACHORRO</div>
        </button>

        <button class="card locked" data-character="fox">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🦊</div>
            <div class="cardName">RAPOSA</div>
        </button>

    </div>

    <div class="sectionTitle">🗺️ ESCOLHA O MAPA</div>

    <div class="mapList">

        <button class="card mapCard selected" data-map="1">
            <div class="mapIcon">🌲</div>
            <div class="cardName">MAPA 1 • FLORESTA</div>
        </button>

        <button class="card mapCard locked" data-map="2">
            <span class="lock">🔒</span>
            <div class="mapIcon">🏜️</div>
            <div class="cardName">MAPA 2 • DESERTO</div>
        </button>

        <button class="card mapCard locked" data-map="3">
            <span class="lock">🔒</span>
            <div class="mapIcon">🌋</div>
            <div class="cardName">MAPA 3 • VULCÃO</div>
        </button>

    </div>

    <button class="playButton" id="startButton">
        ▶ TOCAR PARA JOGAR
    </button>

</div>

<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">
        <div id="lives">❤️❤️❤️</div>

        <div>
            💩 <span id="poop">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>
    </div>

    <button id="homeButton">🏠 INÍCIO</button>

    <div id="tapStart">
        TOQUE NA TELA PARA COMEÇAR
        <small>Toque para pular</small>
    </div>

    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            Você chegou ao mapa
            <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:8px">
            Bostinhas: <span id="finalPoop">0</span>/10
        </div>

        <button class="restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="menuButton" id="overMenu">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>

<script>

/* =========================================================
   PROGRESSO
========================================================= */

let unlockedMap =
    Number(localStorage.getItem("liliUnlockedMap") || 1);

let unlockedCharacters =
    Number(localStorage.getItem("liliUnlockedCharacters") || 1);

let selectedMap=1;
let selectedCharacter="wolf";


/* =========================================================
   CARREGAMENTO 0 → 100
========================================================= */

let load=0;

function loading(){

    load++;

    document.getElementById("percent").textContent=load+"%";
    document.getElementById("barFill").style.width=load+"%";

    if(load<100){

        setTimeout(loading,28);

    }else{

        setTimeout(()=>{

            document.getElementById("loading").style.display="none";
            document.getElementById("menu").style.display="flex";

            updateMenu();

        },450);

    }
}

loading();


/* =========================================================
   MENU
========================================================= */

function updateMenu(){

    document.querySelectorAll("[data-map]").forEach(card=>{

        const map=Number(card.dataset.map);

        if(map<=unlockedMap){

            card.classList.remove("locked");

            const lock=card.querySelector(".lock");

            if(lock) lock.remove();

        }else{

            card.classList.add("locked");

            if(!card.querySelector(".lock")){

                const l=document.createElement("span");

                l.className="lock";
                l.textContent="🔒";

                card.prepend(l);

            }

        }

    });

    document.querySelectorAll("[data-character]").forEach(card=>{

        const character=card.dataset.character;

        let available =
            character==="wolf" ||
            (character==="dog" && unlockedCharacters>=2) ||
            (character==="fox" && unlockedCharacters>=3);

        if(available){

            card.classList.remove("locked");

            const lock=card.querySelector(".lock");

            if(lock) lock.remove();

        }

    });

}


document.querySelectorAll("[data-map]").forEach(card=>{

    card.addEventListener("click",()=>{

        const map=Number(card.dataset.map);

        if(map>unlockedMap) return;

        selectedMap=map;

        document.querySelectorAll("[data-map]")
        .forEach(c=>c.classList.remove("selected"));

        card.classList.add("selected");

    });

});


document.querySelectorAll("[data-character]").forEach(card=>{

    card.addEventListener("click",()=>{

        if(card.classList.contains("locked")) return;

        selectedCharacter=card.dataset.character;

        document.querySelectorAll("[data-character]")
        .forEach(c=>c.classList.remove("selected"));

        card.classList.add("selected");

    });

});


/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){

    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;

}

resize();
window.addEventListener("resize",resize);


/* =========================================================
   VARIÁVEIS
========================================================= */

let player;

let obstacles=[];
let poops=[];

let running=false;
let started=false;

let poopCount=0;
let level=1;
let lives=3;

/*
   VELOCIDADE FIXA POR MAPA.

   IMPORTANTE:
   perder vida NÃO muda speed.
*/

let speed=5;

let obstacleTimer=0;
let poopTimer=0;

let legAnimation=0;


/* =========================================================
   RESET
========================================================= */

function reset(){

    player={

        x:75,
        y:H-135,

        w:72,
        h:72,

        vy:0,
        grounded:true

    };

    obstacles=[];
    poops=[];

    poopCount=0;
    lives=3;

    level=selectedMap;

    /*
       Cada mapa pode ser um pouco mais difícil,
       mas perder coração nunca altera isso.
    */

    speed=
        level===1 ? 5 :
        level===2 ? 5.6 :
        6.2;

    obstacleTimer=95;
    poopTimer=45;

    document.getElementById("poop").textContent=0;
    document.getElementById("level").textContent=level;

    updateLives();

}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    document.getElementById("menu").style.display="none";
    document.getElementById("game").style.display="block";

    document.getElementById("gameOver").style.display="none";

    reset();

    running=false;
    started=false;

    document.getElementById("tapStart").style.display="block";

    requestAnimationFrame(loop);

}


/* =========================================================
   VOLTAR AO MENU
========================================================= */

function backToMenu(){

    running=false;
    started=false;

    document.getElementById("game").style.display="none";
    document.getElementById("gameOver").style.display="none";

    updateMenu();

    document.getElementById("menu").style.display="flex";

}


/* =========================================================
   TOQUE / PULO
========================================================= */

function touchGame(e){

    /*
       Não deixa botão de menu/restart
       interferir no pulo.
    */

    if(e.target.closest("button")) return;

    if(!started){

        started=true;
        running=true;

        document.getElementById("tapStart").style.display="none";

        jump();

        return;

    }

    jump();

}


function jump(){

    if(!running) return;

    if(player.grounded){

        player.vy=-13;

        player.grounded=false;

    }

}


/* =========================================================
   VIDAS
========================================================= */

function updateLives(){

    let hearts="";

    for(let i=0;i<3;i++){

        hearts += i<lives ? "❤️" : "🖤";

    }

    document.getElementById("lives").textContent=hearts;

}


/* =========================================================
   PERDE VIDA
========================================================= */

function hitObstacle(index){

    obstacles.splice(index,1);

    lives--;

    updateLives();

    /*
       RECUO SEM ALTERAR SPEED.
    */

    player.vy=-7;

    if(lives<=0){

        gameOver();

    }

}


/* =========================================================
   OBSTÁCULOS
========================================================= */

function spawnObstacle(){

    const types=[
        "spike",
        "rock",
        "box",
        "doubleSpike",
        "log"
    ];

    const type=
        types[Math.floor(Math.random()*types.length)];

    let w=50;
    let h=50;

    if(type==="doubleSpike"){

        w=90;
        h=50;

    }

    if(type==="log"){

        w=90;
        h=38;

    }

    obstacles.push({

        x:W+60,
        y:H-103,
        w:w,
        h:h,
        type:type

    });

}


/* =========================================================
   BOSTINHA
========================================================= */

function spawnPoop(){

    poops.push({

        x:W+50,

        y:H-165-Math.random()*125,

        r:17

    });

}


/* =========================================================
   FUNDO
========================================================= */

function background(){

    let sky=ctx.createLinearGradient(0,0,0,H);

    if(level===1){

        sky.addColorStop(0,"#64b9df");
        sky.addColorStop(1,"#d7f1ff");

    }else if(level===2){

        sky.addColorStop(0,"#e99652");
        sky.addColorStop(1,"#ffe0a0");

    }else{

        sky.addColorStop(0,"#31151a");
        sky.addColorStop(1,"#d84b35");

    }

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);


    /* SOL / LUA */

    ctx.fillStyle=
        level===3 ? "#ff6347" :
        level===2 ? "#ffd36b" :
        "#fff0a0";

    ctx.beginPath();

    ctx.arc(
        W-85,
        85,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* MAPA 1 - FLORESTA */

    if(level===1){

        for(let i=0;i<8;i++){

            let x=
                (i*170-
                ((performance.now()/35*speed)%170));

            ctx.fillStyle="#3c5f38";

            ctx.fillRect(
                x-7,
                H-135,
                14,
                70
            );

            ctx.beginPath();

            ctx.arc(
                x,
                H-145,
                42,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* MAPA 2 - DESERTO */

    if(level===2){

        for(let i=0;i<7;i++){

            let x=
                (i*210-
                ((performance.now()/45*speed)%210));

            ctx.fillStyle="#8b5a32";

            ctx.fillRect(
                x-5,
                H-140,
                10,
                75
            );

            ctx.fillStyle="#47723e";

            ctx.beginPath();

            ctx.arc(x,H-145,25,0,Math.PI*2);

            ctx.fill();

        }

    }


    /* MAPA 3 - VULCÃO */

    if(level===3){

        for(let i=0;i<5;i++){

            let x=i*260;

            ctx.fillStyle="#431d20";

            ctx.beginPath();

            ctx.moveTo(x,H-65);
            ctx.lineTo(x+90,H-230);
            ctx.lineTo(x+180,H-65);
            ctx.closePath();

            ctx.fill();

        }

    }


    /* CHÃO */

    ctx.fillStyle=
        level===1 ? "#496c39" :
        level===2 ? "#c99751" :
        "#352527";

    ctx.fillRect(0,H-65,W,65);

    ctx.fillStyle=
        level===3 ? "#ff5b32" :
        level===2 ? "#e1ad62" :
        "#304b29";

    ctx.fillRect(0,H-65,W,7);

}


/* =========================================================
   LOBO MAIS DETALHADO
   SEM SOMBRA
========================================================= */

function drawPlayer(){

    const x=player.x;
    const y=player.y;

    legAnimation+=0.22;

    const leg1=Math.sin(legAnimation)*8;
    const leg2=Math.sin(legAnimation+Math.PI)*8;


    /* CAUDA */

    ctx.strokeStyle="#20252a";
    ctx.lineWidth=13;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(x+12,y+38);

    ctx.quadraticCurveTo(
        x-18,y+18,
        x-7,y-3
    );

    ctx.stroke();


    /* PERNAS */

    ctx.strokeStyle="#15191d";
    ctx.lineWidth=11;

    ctx.beginPath();

    ctx.moveTo(x+18,y+52);
    ctx.lineTo(x+14+leg1,y+76);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(x+48,y+52);
    ctx.lineTo(x+48+leg2,y+76);

    ctx.stroke();


    /* CORPO */

    let body=ctx.createLinearGradient(
        x,y,x+70,y+65
    );

    body.addColorStop(0,"#777f85");
    body.addColorStop(.45,"#42494f");
    body.addColorStop(1,"#171b1f");

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.ellipse(
        x+35,
        y+42,
        38,
        25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* PEITO */

    ctx.fillStyle="#858b8f";

    ctx.beginPath();

    ctx.ellipse(
        x+52,
        y+45,
        18,
        25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CABEÇA */

    ctx.fillStyle="#596168";

    ctx.beginPath();

    ctx.ellipse(
        x+52,
        y+20,
        29,
        30,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ORELHA ESQUERDA */

    ctx.fillStyle="#262c31";

    ctx.beginPath();

    ctx.moveTo(x+30,y+7);
    ctx.lineTo(x+32,y-22);
    ctx.lineTo(x+46,y+5);

    ctx.closePath();

    ctx.fill();


    /* ORELHA DIREITA */

    ctx.beginPath();

    ctx.moveTo(x+55,y+4);
    ctx.lineTo(x+72,y-21);
    ctx.lineTo(x+72,y+12);

    ctx.closePath();

    ctx.fill();


    /* FOCINHO */

    ctx.fillStyle="#b8bbbc";

    ctx.beginPath();

    ctx.ellipse(
        x+57,
        y+31,
        20,
        14,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* NARIZ */

    ctx.fillStyle="#050505";

    ctx.beginPath();

    ctx.ellipse(
        x+65,
        y+28,
        9,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       DOIS OLHOS VERMELHOS
    */

    ctx.fillStyle="#ff1515";

    ctx.shadowColor="red";
    ctx.shadowBlur=9;

    ctx.beginPath();

    ctx.arc(
        x+43,
        y+17,
        4.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x+61,
        y+17,
        4.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

}


/* =========================================================
   OBSTÁCULOS
========================================================= */

function drawObstacle(o){

    if(o.type==="spike"){

        let grad=ctx.createLinearGradient(
            o.x,o.y,o.x+o.w,o.y+o.h
        );

        grad.addColorStop(0,"#555b60");
        grad.addColorStop(1,"#101214");

        ctx.fillStyle=grad;

        ctx.beginPath();

        ctx.moveTo(o.x,o.y+o.h);
        ctx.lineTo(o.x+o.w/2,o.y);
        ctx.lineTo(o.x+o.w,o.y+o.h);

        ctx.closePath();
        ctx.fill();

    }

    else if(o.type==="doubleSpike"){

        for(let i=0;i<2;i++){

            let sx=o.x+i*44;

            ctx.fillStyle="#202428";

            ctx.beginPath();

            ctx.moveTo(sx,o.y+o.h);
            ctx.lineTo(sx+22,o.y);
            ctx.lineTo(sx+44,o.y+o.h);

            ctx.closePath();
            ctx.fill();

        }

    }

    else if(o.type==="rock"){

        let grad=ctx.createRadialGradient(
            o.x+18,o.y+15,2,
            o.x+25,o.y+28,30
        );

        grad.addColorStop(0,"#858b8e");
        grad.addColorStop(1,"#30353a");

        ctx.fillStyle=grad;

        ctx.beginPath();

        ctx.arc(
            o.x+25,
            o.y+28,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    else if(o.type==="log"){

        ctx.fillStyle="#633c24";

        ctx.beginPath();

        ctx.roundRect(
            o.x,
            o.y,
            o.w,
            o.h,
            18
        );

        ctx.fill();

        ctx.strokeStyle="#301b10";
        ctx.lineWidth=4;

        ctx.stroke();

    }

    else{

        ctx.fillStyle="#68432c";

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

        ctx.strokeStyle="#29170e";
        ctx.lineWidth=3;

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

    }

}


/* =========================================================
   DESENHAR BOSTINHA 💩
========================================================= */

function drawPoop(p){

    ctx.save();

    ctx.translate(p.x,p.y);

    ctx.fillStyle="#7b4725";

    /* base */

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        17,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* corpo */

    ctx.beginPath();

    ctx.arc(0,0,13,Math.PI,0);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(-5,-7,9,Math.PI,0);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(5,-14,7,Math.PI,0);

    ctx.fill();


    /* brilho */

    ctx.fillStyle="#b87945";

    ctx.beginPath();

    ctx.arc(-5,-7,3,0,Math.PI*2);

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   COLISÃO
========================================================= */

function collision(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );

}


/* =========================================================
   PASSAR MAPA
========================================================= */

function checkLevel(){

    if(poopCount<10) return;

    /*
       Se completar o mapa:
       libera o próximo.
    */

    if(level<3){

        const next=level+1;

        if(next>unlockedMap){

            unlockedMap=next;

            localStorage.setItem(
                "liliUnlockedMap",
                unlockedMap
            );

        }

        /*
           Desbloqueia personagens
           conforme progresso.
        */

        if(level===1 && unlockedCharacters<2){

            unlockedCharacters=2;

            localStorage.setItem(
                "liliUnlockedCharacters",
                unlockedCharacters
            );

        }

        if(level===2 && unlockedCharacters<3){

            unlockedCharacters=3;

            localStorage.setItem(
                "liliUnlockedCharacters",
                unlockedCharacters
            );

        }

        poopCount=0;
        level++;

        /*
           VELOCIDADE SÓ MUDA AQUI,
           AO PASSAR DE MAPA.
        */

        speed=
            level===2 ? 5.6 :
            6.2;

        document.getElementById("poop").textContent=0;
        document.getElementById("level").textContent=level;

        obstacles=[];
        poops=[];

        obstacleTimer=100;
        poopTimer=50;

    }

    else{

        /*
           Zerou os 3 mapas.
        */

        poopCount=0;

        document.getElementById("poop").textContent=0;

        alert("🏆 PARABÉNS! VOCÊ ZEROU O LILI CAGAO!");

        backToMenu();

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    running=false;

    document.getElementById("finalLevel").textContent=level;
    document.getElementById("finalPoop").textContent=poopCount;

    document.getElementById("gameOver").style.display="flex";

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    if(
        document.getElementById("game").style.display==="none"
    ){

        return;

    }

    ctx.clearRect(0,0,W,H);

    background();


    if(started && running){

        /* FÍSICA */

        player.vy+=.65;
        player.y+=player.vy;

        if(player.y>=H-137){

            player.y=H-137;
            player.vy=0;
            player.grounded=true;

        }


        /* OBSTÁCULOS */

        obstacleTimer--;

        if(obstacleTimer<=0){

            spawnObstacle();

            obstacleTimer=
                Math.max(
                    55,
                    108-level*5
                );

        }


        for(
            let i=obstacles.length-1;
            i>=0;
            i--
        ){

            let o=obstacles[i];

            o.x-=speed;

            drawObstacle(o);

            if(collision(player,o)){

                hitObstacle(i);

                break;

            }

        }


        obstacles=
            obstacles.filter(
                o=>o.x>-130
            );


        /* BOSTINHAS */

        poopTimer--;

        if(poopTimer<=0){

            spawnPoop();

            poopTimer=
                65+Math.random()*65;

        }


        for(
            let i=poops.length-1;
            i>=0;
            i--
        ){

            let p=poops[i];

            p.x-=speed;

            drawPoop(p);

            let box={

                x:p.x-p.r,
                y:p.y-p.r,
                w:p.r*2,
                h:p.r*2

            };


            if(collision(player,box)){

                poops.splice(i,1);

                poopCount++;

                document.getElementById(
                    "poop"
                ).textContent=poopCount;

                checkLevel();

            }

        }


        poops=
            poops.filter(
                p=>p.x>-60
            );

    }


    drawPlayer();

    requestAnimationFrame(loop);

}


/* =========================================================
   CONTROLES
========================================================= */

document.getElementById("startButton")
.addEventListener("click",startGame);


document.getElementById("game")
.addEventListener("pointerdown",touchGame);


document.getElementById("homeButton")
.addEventListener("click",backToMenu);


document.getElementById("restart")
.addEventListener("click",()=>{

    document.getElementById("gameOver").style.display="none";

    reset();

    started=false;
    running=false;

    document.getElementById("tapStart").style.display="block";

    requestAnimationFrame(loop);

});


document.getElementById("overMenu")
.addEventListener("click",backToMenu);


/* =========================================================
   TECLADO — PC
========================================================= */

document.addEventListener("keydown",e=>{

    if(
        e.code==="Space" ||
        e.code==="ArrowUp"
    ){

        e.preventDefault();

        if(
            document.getElementById("game").style.display!=="none"
        ){

            touchGame(e);

        }

    }

});

</script>
