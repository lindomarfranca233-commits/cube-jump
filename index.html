<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>LILO O CAGÃO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,sans-serif;
}

button{
    -webkit-tap-highlight-color:transparent;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;

    background:
    radial-gradient(
        circle at center,
        #343a42,
        #101319 55%,
        #020304
    );
}

.logo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:2px;

    text-shadow:
    0 0 12px red,
    0 0 30px #800;
}

.loadingWolf{
    font-size:90px;
    margin:15px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.bar{
    width:280px;
    height:12px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        #700000,
        #ff2525
    );
}

/* =========================
   MENU
========================= */

#menu{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    overflow-y:auto;

    flex-direction:column;
    align-items:center;

    padding:18px;

    color:white;

    background:
    radial-gradient(
        circle at center,
        #343a42,
        #0b0e13 65%,
        #020304
    );
}

.menuTitle{
    font-size:42px;
    font-weight:1000;

    text-shadow:
    0 0 12px red,
    0 0 30px #700;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin:5px 0;
}

.creator{
    color:#ff4444;
    font-weight:bold;
    margin:8px 0 15px;
}

.sectionTitle{
    width:100%;
    max-width:500px;

    font-weight:bold;
    margin:8px 0;
}

.list{
    width:100%;
    max-width:500px;

    display:flex;
    gap:10px;

    overflow-x:auto;
}

.card{
    min-width:130px;
    height:105px;

    border:2px solid #444;
    border-radius:15px;

    background:
    linear-gradient(
        145deg,
        #292e34,
        #0c0f13
    );

    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    position:relative;
}

.card.selected{
    border-color:#ff3333;

    box-shadow:
    0 0 15px #700;
}

.card.locked{
    opacity:.35;
    filter:grayscale(1);
}

.cardEmoji{
    font-size:40px;
}

.cardName{
    font-size:12px;
    font-weight:bold;
    margin-top:5px;
}

.lock{
    position:absolute;
    top:5px;
    right:7px;
}

.play{
    width:270px;

    padding:16px;

    margin-top:18px;

    border:2px solid #ff3333;
    border-radius:13px;

    background:
    linear-gradient(
        #a00000,
        #420000
    );

    color:white;

    font-size:18px;
    font-weight:bold;
}

/* =========================
   GAME
========================= */

#game{
    display:none;

    position:fixed;
    inset:0;
}

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

#hud{
    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;

    color:white;

    font-size:18px;
    font-weight:bold;

    text-shadow:2px 2px 5px #000;

    z-index:10;
}

#poop{
    color:#d79b63;
}

#home{
    position:absolute;

    right:10px;
    top:48px;

    z-index:15;

    padding:8px 11px;

    border:1px solid #aaa;
    border-radius:8px;

    background:rgba(0,0,0,.6);

    color:white;
    font-weight:bold;
}

#tapStart{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:22px;
    font-weight:bold;

    text-align:center;

    text-shadow:
    0 0 10px #000;

    z-index:20;
}

#tapStart small{
    display:block;
    margin-top:8px;
    font-size:14px;
}

#gameOver{
    display:none;

    position:absolute;
    inset:0;

    z-index:40;

    background:rgba(0,0,0,.86);

    color:white;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
}

.overButton{
    margin-top:15px;

    padding:13px 25px;

    border:0;
    border-radius:10px;

    color:white;

    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#780000;
}

.menuButton{
    background:#333940;
}

</style>
</head>

<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="logo">
        LILO O CAGÃO
    </div>

    <div class="loadingWolf">
        🐺
    </div>

    <div class="loadingText">
        CARREGANDO
    </div>

    <div id="percent">
        0%
    </div>

    <div class="bar">
        <div id="barFill"></div>
    </div>

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menuTitle">
        LILO O CAGÃO
    </div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>


    <div class="sectionTitle">
        🐺 PERSONAGENS
    </div>

    <div class="list">

        <button
            class="card selected"
            data-char="wolf">

            <div class="cardEmoji">
                🐺
            </div>

            <div class="cardName">
                LILO
            </div>

        </button>


        <button
            class="card locked"
            data-char="dog">

            <span class="lock">🔒</span>

            <div class="cardEmoji">
                🐕
            </div>

            <div class="cardName">
                CACHORRO
            </div>

        </button>


        <button
            class="card locked"
            data-char="fox">

            <span class="lock">🔒</span>

            <div class="cardEmoji">
                🦊
            </div>

            <div class="cardName">
                RAPOSA
            </div>

        </button>

    </div>


    <div class="sectionTitle">
        🗺️ MAPAS
    </div>

    <div class="list">

        <button
            class="card selected"
            data-map="1">

            <div class="cardEmoji">
                🌲
            </div>

            <div class="cardName">
                MAPA 1<br>
                FLORESTA
            </div>

        </button>


        <button
            class="card locked"
            data-map="2">

            <span class="lock">🔒</span>

            <div class="cardEmoji">
                🏜️
            </div>

            <div class="cardName">
                MAPA 2<br>
                DESERTO
            </div>

        </button>


        <button
            class="card locked"
            data-map="3">

            <span class="lock">🔒</span>

            <div class="cardEmoji">
                🌋
            </div>

            <div class="cardName">
                MAPA 3<br>
                VULCÃO
            </div>

        </button>

    </div>


    <button
        class="play"
        id="play">

        ▶ TOCAR PARA JOGAR

    </button>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <canvas id="canvas"></canvas>


    <div id="hud">

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            💩
            <span id="poop">0</span>/10
        </div>

        <div>
            MAPA
            <span id="level">1</span>
        </div>

    </div>


    <button id="home">
        🏠 INÍCIO
    </button>


    <div id="tapStart">

        TOQUE PARA COMEÇAR

        <small>
            Toque para pular 🐺🔊
        </small>

    </div>


    <div id="gameOver">

        <h2>
            GAME OVER
        </h2>

        <p>
            Mapa:
            <span id="finalLevel">1</span>
        </p>

        <p style="margin-top:7px">
            💩
            <span id="finalPoop">0</span>/10
        </p>


        <button
            class="overButton restart"
            id="restart">

            🔄 JOGAR NOVAMENTE

        </button>


        <button
            class="overButton menuButton"
            id="backMenu">

            🏠 VOLTAR AO INÍCIO

        </button>

    </div>

</div>


<script>

/* =====================================================
   PROGRESSO
===================================================== */

let unlockedMap =
Number(
    localStorage.getItem(
        "liloMap"
    ) || 1
);

let unlockedChar =
Number(
    localStorage.getItem(
        "liloChar"
    ) || 1
);

let selectedMap=1;


/* =====================================================
   LOADING
===================================================== */

let loadingValue=0;

function loadScreen(){

    loadingValue++;

    document.getElementById(
        "percent"
    ).textContent=
    loadingValue+"%";

    document.getElementById(
        "barFill"
    ).style.width=
    loadingValue+"%";


    if(
        loadingValue<100
    ){

        setTimeout(
            loadScreen,
            25
        );

    }else{

        setTimeout(()=>{

            document.getElementById(
                "loading"
            ).style.display="none";

            document.getElementById(
                "menu"
            ).style.display="flex";

            updateMenu();

        },400);

    }

}

loadScreen();


/* =====================================================
   MENU
===================================================== */

function updateMenu(){

    document.querySelectorAll(
        "[data-map]"
    ).forEach(card=>{

        const map=
        Number(card.dataset.map);


        if(
            map<=unlockedMap
        ){

            card.classList.remove(
                "locked"
            );

            const lock=
            card.querySelector(".lock");

            if(lock)
                lock.remove();

        }

    });


    document.querySelectorAll(
        "[data-char]"
    ).forEach(card=>{

        const char=
        card.dataset.char;


        let available=false;


        if(
            char==="wolf"
        )
            available=true;


        if(
            char==="dog" &&
            unlockedChar>=2
        )
            available=true;


        if(
            char==="fox" &&
            unlockedChar>=3
        )
            available=true;


        if(available){

            card.classList.remove(
                "locked"
            );

            const lock=
            card.querySelector(".lock");

            if(lock)
                lock.remove();

        }

    });

}


/* seleção mapa */

document.querySelectorAll(
    "[data-map]"
).forEach(card=>{

    card.addEventListener(
        "click",
        ()=>{

            const map=
            Number(card.dataset.map);


            if(
                map>unlockedMap
            )
                return;


            selectedMap=map;


            document.querySelectorAll(
                "[data-map]"
            ).forEach(c=>
                c.classList.remove(
                    "selected"
                )
            );


            card.classList.add(
                "selected"
            );

        }
    );

});


/* =====================================================
   CANVAS
===================================================== */

const canvas=
document.getElementById(
    "canvas"
);

const ctx=
canvas.getContext("2d");


let W=0;
let H=0;


function resize(){

    W=
    canvas.width=
    window.innerWidth;

    H=
    canvas.height=
    window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ÁUDIO
===================================================== */

let audio=null;


/*
   O AudioContext é criado dentro
   do toque do usuário.

   Isso é importante em navegadores
   que bloqueiam áudio automático.
*/

function prepareAudio(){

    if(audio)
        return;


    const AudioContext=
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContext)
        return;


    audio=
    new AudioContext();

}


/* LATIDO */

function bark(){

    if(!audio)
        return;


    if(
        audio.state==="suspended"
    ){

        audio.resume();

    }


    const now=
    audio.currentTime;


    function barkSound(
        start,
        frequency,
        duration
    ){

        const osc=
        audio.createOscillator();

        const gain=
        audio.createGain();


        osc.type="sawtooth";


        osc.frequency.setValueAtTime(
            frequency,
            start
        );


        osc.frequency.exponentialRampToValueAtTime(
            frequency*0.42,
            start+duration
        );


        gain.gain.setValueAtTime(
            0.0001,
            start
        );


        gain.gain.exponentialRampToValueAtTime(
            0.28,
            start+0.012
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            start+duration
        );


        osc.connect(gain);

        gain.connect(
            audio.destination
        );


        osc.start(start);

        osc.stop(
            start+duration+0.01
        );

    }


    barkSound(
        now,
        220,
        0.13
    );


    barkSound(
        now+0.10,
        170,
        0.14
    );

}


/* =====================================================
   VARIÁVEIS DO JOGO
===================================================== */

let player;

let obstacles=[];
let poops=[];

let running=false;
let started=false;

let lives=3;

let poopCount=0;

let level=1;


/*
   VELOCIDADE DA FASE.

   NÃO É ALTERADA QUANDO PERDE VIDA.

   Mapa 1 = 4.5
   Mapa 2 = 5
   Mapa 3 = 5.5
*/

let speed=4.5;


let obstacleTimer=0;
let poopTimer=0;

let legTime=0;

let invincible=false;


/*
   ID DO ÚNICO LOOP.
*/

let animationID=null;


/*
   Controle de tempo.

   Assim a velocidade fica consistente
   mesmo em telas com 60/90/120 Hz.
*/

let lastTime=0;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    level=selectedMap;

    lives=3;

    poopCount=0;


    /*
       Velocidade definida somente
       conforme o mapa.
    */

    if(level===1)
        speed=4.5;

    if(level===2)
        speed=5;

    if(level===3)
        speed=5.5;


    player={

        x:55,

        y:H-128,

        w:54,

        h:54,

        vy:0,

        grounded:true

    };


    obstacles=[];
    poops=[];


    obstacleTimer=90;

    poopTimer=50;


    invincible=false;


    document.getElementById(
        "poop"
    ).textContent="0";


    document.getElementById(
        "level"
    ).textContent=level;


    updateLives();

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives(){

    let text="";


    for(
        let i=0;
        i<3;
        i++
    ){

        text+=
        i<lives
        ? "❤️"
        : "🖤";

    }


    document.getElementById(
        "lives"
    ).textContent=text;

}


/* =====================================================
   COMEÇAR
===================================================== */

function startGame(){

    prepareAudio();


    document.getElementById(
        "menu"
    ).style.display="none";


    document.getElementById(
        "game"
    ).style.display="block";


    document.getElementById(
        "gameOver"
    ).style.display="none";


    resetGame();


    started=false;

    running=false;


    document.getElementById(
        "tapStart"
    ).style.display="block";


    /*
       Não inicia outro loop.
       O loop principal já existe.
    */

}


/* =====================================================
   VOLTAR AO MENU
===================================================== */

function backMenu(){

    running=false;

    started=false;


    document.getElementById(
        "game"
    ).style.display="none";


    document.getElementById(
        "gameOver"
    ).style.display="none";


    document.getElementById(
        "menu"
    ).style.display="flex";


    updateMenu();

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)
        return;


    if(
        player.grounded
    ){

        player.vy=-12.8;

        player.grounded=false;


        /*
           O LATIDO acontece
           exatamente junto com o pulo.
        */

        bark();

    }

}


/* =====================================================
   TOQUE NO JOGO
===================================================== */

function gameTouch(event){

    if(
        event.target.closest(
            "button"
        )
    )
        return;


    /*
       Primeiro toque prepara
       o áudio.
    */

    prepareAudio();


    if(!started){

        started=true;

        running=true;


        document.getElementById(
            "tapStart"
        ).style.display="none";


        jump();

        return;

    }


    jump();

}


/* =====================================================
   OBSTÁCULO
===================================================== */

function spawnObstacle(){

    let type;


    if(level===1){

        const types=[
            "spike",
            "spike",
            "rock",
            "box",
            "doubleSpike"
        ];


        type=
        types[
            Math.floor(
                Math.random()*
                types.length
            )
        ];

    }


    if(level===2){

        const types=[
            "cactus",
            "cactus",
            "doubleCactus",
            "rock"
        ];


        type=
        types[
            Math.floor(
                Math.random()*
                types.length
            )
        ];

    }


    if(level===3){

        const types=[
            "lava",
            "spike",
            "rock",
            "doubleSpike"
        ];


        type=
        types[
            Math.floor(
                Math.random()*
                types.length
            )
        ];

    }


    let w=48;
    let h=48;


    if(type==="doubleSpike")
        w=88;


    if(type==="cactus"){
        w=42;
        h=62;
    }


    if(type==="doubleCactus"){
        w=86;
        h=62;
    }


    if(type==="lava"){
        w=58;
        h=52;
    }


    obstacles.push({

        x:W+70,

        y:H-65-h,

        w:w,

        h:h,

        type:type

    });

}


/* =====================================================
   BOSTINHA
===================================================== */

function spawnPoop(){

    poops.push({

        x:W+40,

        y:
        H-150-
        Math.random()*125,

        r:15

    });

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(
        a.x+7 <
        b.x+b.w &&

        a.x+a.w-7 >
        b.x &&

        a.y+6 <
        b.y+b.h &&

        a.y+a.h-5 >
        b.y
    );

}


/* =====================================================
   BATEU
===================================================== */

function playerHit(){

    if(invincible)
        return;


    invincible=true;


    lives--;

    updateLives();


    /*
       IMPORTANTE:

       NÃO mexemos em speed.
       NÃO criamos outro loop.
    */


    if(
        lives<=0
    ){

        gameOver();

        return;

    }


    /*
       Reinicia somente a posição
       do personagem.

       Os obstáculos continuam.
    */

    player.x=55;

    player.y=H-128;

    player.vy=0;

    player.grounded=true;


    /*
       Pequeno período de proteção.
    */

    setTimeout(
        ()=>{
            invincible=false;
        },
        700
    );

}


/* =====================================================
   DESENHA FUNDO
===================================================== */

function drawBackground(){

    let gradient=
    ctx.createLinearGradient(
        0,0,0,H
    );


    if(level===1){

        gradient.addColorStop(
            0,
            "#4aa8d0"
        );

        gradient.addColorStop(
            1,
            "#d9f4ff"
        );

    }


    if(level===2){

        gradient.addColorStop(
            0,
            "#df8b45"
        );

        gradient.addColorStop(
            1,
            "#ffe2a8"
        );

    }


    if(level===3){

        gradient.addColorStop(
            0,
            "#30151a"
        );

        gradient.addColorStop(
            1,
            "#c94b34"
        );

    }


    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle=
        level===3
        ? "#ff5638"
        : "#ffe78a";


    ctx.beginPath();

    ctx.arc(
        W-85,
        80,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* árvores */

    if(level===1){

        for(
            let i=0;
            i<9;
            i++
        ){

            let x=
            i*170-
            (
                performance.now()*
                speed/
                55
            )%170;


            ctx.fillStyle="#31512e";

            ctx.fillRect(
                x,
                H-130,
                9,
                65
            );


            ctx.beginPath();

            ctx.arc(
                x+5,
                H-140,
                38,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* cactos de fundo */

    if(level===2){

        for(
            let i=0;
            i<7;
            i++
        ){

            let x=
            i*210-
            (
                performance.now()*
                speed/
                65
            )%210;


            ctx.fillStyle="#4b713d";

            ctx.fillRect(
                x,
                H-125,
                9,
                60
            );


            ctx.fillRect(
                x-12,
                H-110,
                12,
                8
            );

        }

    }


    /* vulcões */

    if(level===3){

        for(
            let i=0;
            i<5;
            i++
        ){

            let x=i*280;

            ctx.fillStyle="#431e20";

            ctx.beginPath();

            ctx.moveTo(
                x,
                H-65
            );

            ctx.lineTo(
                x+110,
                H-215
            );

            ctx.lineTo(
                x+220,
                H-65
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* chão */

    ctx.fillStyle=
        level===1
        ? "#466c37"
        : level===2
        ? "#c4934e"
        : "#332326";


    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );


    ctx.fillStyle=
        level===2
        ? "#e2b269"
        : level===3
        ? "#ff5735"
        : "#2d4928";


    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   LOBO
===================================================== */

function drawPlayer(){

    const x=player.x;
    const y=player.y;


    legTime+=0.18;


    let leg1=
    Math.sin(
        legTime
    )*5;


    let leg2=
    Math.sin(
        legTime+
        Math.PI
    )*5;


    ctx.save();


    if(invincible){

        /*
           Apenas efeito visual.
        */

        ctx.globalAlpha=
        0.55+
        Math.sin(
            performance.now()/60
        )*0.25;

    }


    /* CAUDA */

    ctx.strokeStyle="#22272b";

    ctx.lineWidth=9;

    ctx.lineCap="round";


    ctx.beginPath();

    ctx.moveTo(
        x+8,
        y+34
    );

    ctx.quadraticCurveTo(
        x-12,
        y+20,
        x-5,
        y+2
    );

    ctx.stroke();


    /* PERNA 1 */

    ctx.strokeStyle="#15191d";

    ctx.lineWidth=8;


    ctx.beginPath();

    ctx.moveTo(
        x+16,
        y+43
    );

    ctx.lineTo(
        x+13+leg1,
        y+62
    );

    ctx.stroke();


    /* PERNA 2 */

    ctx.beginPath();

    ctx.moveTo(
        x+39,
        y+43
    );

    ctx.lineTo(
        x+40+leg2,
        y+62
    );

    ctx.stroke();


    /* CORPO */

    let body=
    ctx.createLinearGradient(
        x,
        y,
        x+55,
        y+50
    );


    body.addColorStop(
        0,
        "#70787d"
    );

    body.addColorStop(
        .5,
        "#41484d"
    );

    body.addColorStop(
        1,
        "#171b1f"
    );


    ctx.fillStyle=body;


    ctx.beginPath();

    ctx.ellipse(
        x+28,
        y+34,
        28,
        18,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CABEÇA */

    ctx.fillStyle="#596167";


    ctx.beginPath();

    ctx.ellipse(
        x+43,
        y+18,
        23,
        24,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ORELHA 1 */

    ctx.fillStyle="#252a2f";


    ctx.beginPath();

    ctx.moveTo(
        x+27,
        y+5
    );

    ctx.lineTo(
        x+29,
        y-17
    );

    ctx.lineTo(
        x+41,
        y+6
    );

    ctx.closePath();

    ctx.fill();


    /* ORELHA 2 */

    ctx.beginPath();

    ctx.moveTo(
        x+47,
        y+5
    );

    ctx.lineTo(
        x+61,
        y-17
    );

    ctx.lineTo(
        x+64,
        y+10
    );

    ctx.closePath();

    ctx.fill();


    /*
       SEM PESCOÇO BRANCO.
       Apenas o rosto cinza.
    */


    /* FOCINHO */

    ctx.fillStyle="#697176";


    ctx.beginPath();

    ctx.ellipse(
        x+50,
        y+28,
        15,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* NARIZ */

    ctx.fillStyle="#050505";


    ctx.beginPath();

    ctx.ellipse(
        x+57,
        y+26,
        6,
        4,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* OLHO ESQUERDO */

    ctx.fillStyle="#ff1111";

    ctx.shadowColor="red";

    ctx.shadowBlur=8;


    ctx.beginPath();

    ctx.arc(
        x+35,
        y+15,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* OLHO DIREITO */

    ctx.beginPath();

    ctx.arc(
        x+50,
        y+15,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.restore();

}


/* =====================================================
   DESENHA OBSTÁCULO
===================================================== */

function drawObstacle(o){

    /* ESPINHO */

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        const amount=
        o.type==="doubleSpike"
        ? 2
        : 1;


        for(
            let i=0;
            i<amount;
            i++
        ){

            let x=
            o.x+i*44;


            ctx.fillStyle="#171a1d";


            ctx.beginPath();

            ctx.moveTo(
                x,
                o.y+o.h
            );

            ctx.lineTo(
                x+22,
                o.y
            );

            ctx.lineTo(
                x+44,
                o.y+o.h
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* CACTO */

    else if(
        o.type==="cactus" ||
        o.type==="doubleCactus"
    ){

        const amount=
        o.type==="doubleCactus"
        ? 2
        : 1;


        for(
            let i=0;
            i<amount;
            i++
        ){

            let x=
            o.x+i*43;


            ctx.fillStyle="#39713b";


            ctx.beginPath();

            ctx.roundRect(
                x+13,
                o.y,
                16,
                o.h,
                8
            );

            ctx.fill();


            ctx.fillRect(
                x+3,
                o.y+20,
                14,
                8
            );


            ctx.fillRect(
                x+3,
                o.y+11,
                8,
                17
            );


            ctx.fillRect(
                x+26,
                o.y+31,
                14,
                8
            );


            ctx.fillRect(
                x+31,
                o.y+20,
                8,
                19
            );

        }

    }


    /* PEDRA */

    else if(
        o.type==="rock"
    ){

        let g=
        ctx.createRadialGradient(
            o.x+15,
            o.y+12,
            2,
            o.x+25,
            o.y+28,
            30
        );


        g.addColorStop(
            0,
            "#8a9093"
        );

        g.addColorStop(
            1,
            "#30353a"
        );


        ctx.fillStyle=g;


        ctx.beginPath();

        ctx.arc(
            o.x+25,
            o.y+25,
            26,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* LAVA */

    else if(
        o.type==="lava"
    ){

        ctx.fillStyle="#421c1c";


        ctx.beginPath();

        ctx.arc(
            o.x+29,
            o.y+26,
            27,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#ff4c2f";

        ctx.lineWidth=4;

        ctx.stroke();

    }

}


/* =====================================================
   BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    ctx.fillStyle="#75421f";


    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        16,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        12,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        -4,
        -7,
        9,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        4,
        -14,
        7,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   PASSAR DE MAPA
===================================================== */

function checkLevel(){

    if(
        poopCount<10
    )
        return;


    if(
        level<3
    ){

        const next=
        level+1;


        if(
            next>unlockedMap
        ){

            unlockedMap=next;


            localStorage.setItem(
                "liloMap",
                unlockedMap
            );

        }


        if(
            level===1 &&
            unlockedChar<2
        ){

            unlockedChar=2;


            localStorage.setItem(
                "liloChar",
                unlockedChar
            );

        }


        if(
            level===2 &&
            unlockedChar<3
        ){

            unlockedChar=3;


            localStorage.setItem(
                "liloChar",
                unlockedChar
            );

        }


        level=next;

        poopCount=0;


        /*
           Só agora a velocidade muda.
        */

        if(level===2)
            speed=5;

        if(level===3)
            speed=5.5;


        obstacles=[];
        poops=[];


        obstacleTimer=100;
        poopTimer=50;


        document.getElementById(
            "poop"
        ).textContent="0";


        document.getElementById(
            "level"
        ).textContent=level;

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;

    started=false;


    document.getElementById(
        "finalLevel"
    ).textContent=level;


    document.getElementById(
        "finalPoop"
    ).textContent=poopCount;


    document.getElementById(
        "gameOver"
    ).style.display="flex";

}


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function gameLoop(timestamp){

    /*
       requestAnimationFrame é chamado
       SOMENTE aqui.

       Nunca é chamado dentro de
       startGame, resetGame, restart
       ou colisão.
    */


    if(
        !lastTime
    )
        lastTime=timestamp;


    let delta=
    timestamp-lastTime;


    lastTime=timestamp;


    /*
       Limita o delta.

       Se o celular travar por um instante,
       o personagem não dá um salto gigante.
    */

    delta=
    Math.min(
        delta,
        32
    );


    /*
       16.666ms = aproximadamente
       um frame de 60 FPS.
    */

    const dt=
    delta/16.6667;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    if(
        document.getElementById(
            "game"
        ).style.display!=="none"
    ){

        drawBackground();


        if(
            started &&
            running
        ){

            /* =================
               FÍSICA
            ================= */

            player.vy+=
            0.65*dt;


            player.y+=
            player.vy*dt;


            if(
                player.y>=H-128
            ){

                player.y=H-128;

                player.vy=0;

                player.grounded=true;

            }


            /* =================
               OBSTÁCULOS
            ================= */

            obstacleTimer-=dt;


            if(
                obstacleTimer<=0
            ){

                spawnObstacle();


                obstacleTimer=
                100+
                Math.random()*35;

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=
                obstacles[i];


                /*
                   A velocidade é FIXA.

                   Ela NÃO usa vidas.
                   Ela NÃO é multiplicada.
                */

                o.x-=
                speed*dt;


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    playerHit();

                    /*
                       Não remove o obstáculo.
                    */

                    break;

                }

            }


            obstacles=
            obstacles.filter(
                o=>o.x>-160
            );


            /* =================
               BOSTINHAS
            ================= */

            poopTimer-=dt;


            if(
                poopTimer<=0
            ){

                spawnPoop();


                poopTimer=
                70+
                Math.random()*60;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=
                poops[i];


                p.x-=
                speed*dt;


                drawPoop(p);


                const box={

                    x:p.x-p.r,

                    y:p.y-p.r,

                    w:p.r*2,

                    h:p.r*2

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );


                    poopCount++;


                    document.getElementById(
                        "poop"
                    ).textContent=
                    poopCount;


                    checkLevel();

                }

            }


            poops=
            poops.filter(
                p=>p.x>-70
            );

        }


        drawPlayer();

    }


    /*
       UM ÚNICO próximo frame.
    */

    animationID=
    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   BOTÕES
===================================================== */

document.getElementById(
    "play"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "game"
).addEventListener(
    "pointerdown",
    gameTouch
);


document.getElementById(
    "home"
).addEventListener(
    "click",
    backMenu
);


document.getElementById(
    "backMenu"
).addEventListener(
    "click",
    backMenu
);


document.getElementById(
    "restart"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "gameOver"
        ).style.display="none";


        resetGame();


        started=false;

        running=false;


        document.getElementById(
            "tapStart"
        ).style.display="block";

    }
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.code==="Space" ||
            event.code==="ArrowUp"
        ){

            event.preventDefault();

            prepareAudio();

            if(
                document.getElementById(
                    "game"
                ).style.display!=="none"
            ){

                if(!started){

                    started=true;

                    running=true;


                    document.getElementById(
                        "tapStart"
                    ).style.display="none";

                }


                jump();

            }

        }

    }
);


/* =====================================================
   COMEÇA O ÚNICO LOOP
===================================================== */

animationID=
requestAnimationFrame(
    gameLoop
);

</script>
