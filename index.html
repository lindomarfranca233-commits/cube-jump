<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050608;
}

button{
    -webkit-tap-highlight-color:transparent;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
        radial-gradient(circle at center,#3b424a,#101318 55%,#020304);
}

.loadingTitle{
    font-size:42px;
    font-weight:1000;
    text-align:center;
    color:#fff;
    text-shadow:0 0 12px red,0 0 35px #800;
}

.loadingWolf{
    font-size:90px;
    margin:20px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadingBar{
    width:280px;
    height:12px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#750000,#ff2525);
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    overflow-y:auto;
    padding:18px;
    align-items:center;
    flex-direction:column;
    color:white;
    background:
        radial-gradient(circle at center,#343a42,#0b0e13 65%,#020304);
}

.menuTitle{
    font-size:40px;
    font-weight:1000;
    text-align:center;
    text-shadow:0 0 12px red,0 0 30px #700;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin:5px 0;
    text-align:center;
}

.creator{
    margin:7px 0 15px;
    color:#ff3b3b;
    font-weight:bold;
}

.section{
    width:100%;
    max-width:520px;
    margin-top:8px;
    font-weight:bold;
}

.cards{
    width:100%;
    max-width:520px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:7px 0;
}

.card{
    min-width:125px;
    height:105px;
    border:2px solid #444;
    border-radius:15px;
    color:white;
    background:linear-gradient(145deg,#292e34,#0b0e12);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.card.selected{
    border-color:#ff2929;
    box-shadow:0 0 15px #700;
}

.card.locked{
    opacity:.35;
    filter:grayscale(1);
}

.cardEmoji{
    font-size:40px;
}

.cardName{
    font-size:12px;
    font-weight:bold;
    text-align:center;
    margin-top:5px;
}

.lock{
    position:absolute;
    right:7px;
    top:5px;
}

#play{
    width:275px;
    margin-top:18px;
    padding:16px;
    border:2px solid #ff3030;
    border-radius:13px;
    color:white;
    background:linear-gradient(#a00000,#430000);
    font-size:18px;
    font-weight:bold;
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= LOBO HTML ================= */

#wolf{
    position:absolute;
    left:52px;
    bottom:65px;
    width:64px;
    height:70px;
    z-index:12;
    pointer-events:none;
    transform-origin:center bottom;
}

.wolfBody{
    position:absolute;
    left:12px;
    top:28px;
    width:40px;
    height:27px;
    border-radius:55% 50% 35% 45%;
    background:linear-gradient(145deg,#7d858a,#42484d 55%,#15191d);
}

.wolfHead{
    position:absolute;
    left:34px;
    top:12px;
    width:31px;
    height:34px;
    border-radius:48% 48% 45% 48%;
    background:linear-gradient(145deg,#858c91,#484e53 60%,#181c20);
}

.wolfEar{
    position:absolute;
    width:15px;
    height:25px;
    background:#292e32;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.wolfEar.one{
    left:34px;
    top:0;
    transform:rotate(-8deg);
}

.wolfEar.two{
    left:50px;
    top:1px;
    transform:rotate(9deg);
}

.wolfEye{
    position:absolute;
    top:22px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ff1515;
    box-shadow:0 0 7px red;
}

.wolfEye.one{
    left:41px;
}

.wolfEye.two{
    left:53px;
}

.wolfMuzzle{
    position:absolute;
    left:53px;
    top:28px;
    width:17px;
    height:11px;
    border-radius:50%;
    background:#4d5357;
}

.wolfNose{
    position:absolute;
    left:65px;
    top:30px;
    width:6px;
    height:5px;
    border-radius:50%;
    background:#050505;
}

.wolfTail{
    position:absolute;
    left:7px;
    top:27px;
    width:20px;
    height:9px;
    border-radius:100%;
    border-top:6px solid #252a2e;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:48px;
    width:7px;
    height:20px;
    border-radius:8px;
    background:#181c20;
    transform-origin:top center;
}

.leg1{
    left:16px;
    transform:rotate(8deg);
}

.leg2{
    left:27px;
    transform:rotate(-8deg);
}

.leg3{
    left:40px;
    transform:rotate(8deg);
}

.leg4{
    left:50px;
    transform:rotate(-8deg);
}

#wolf.running .leg1{
    animation:runLeg .22s infinite alternate;
}

#wolf.running .leg2{
    animation:runLeg .22s infinite alternate-reverse;
}

#wolf.running .leg3{
    animation:runLeg .22s infinite alternate-reverse;
}

#wolf.running .leg4{
    animation:runLeg .22s infinite alternate;
}

@keyframes runLeg{
    from{
        transform:rotate(18deg);
    }
    to{
        transform:rotate(-18deg);
    }
}

#wolf.jumping{
    transform:translateY(-5px) rotate(-2deg);
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
}

#poop{
    color:#d49a64;
}

#home{
    position:absolute;
    top:48px;
    right:10px;
    z-index:30;
    padding:8px 10px;
    border:1px solid #aaa;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    color:white;
    font-weight:bold;
}

#tapStart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:25;
    color:white;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    text-shadow:0 0 10px black;
    pointer-events:none;
}

#tapStart small{
    display:block;
    font-size:14px;
    margin-top:8px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(0,0,0,.87);
    text-align:center;
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
    margin-bottom:12px;
}

.overButton{
    margin-top:14px;
    padding:13px 25px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#780000;
}

.menuButton{
    background:#333940;
}
</style>
</head>

<body>

<!-- ================= LOADING ================= -->

<div id="loading">

    <div class="loadingTitle">
        LILO O CAGÃO
    </div>

    <div class="loadingWolf">🐺</div>

    <div class="loadingText">
        CARREGANDO
    </div>

    <div id="percent">0%</div>

    <div class="loadingBar">
        <div id="barFill"></div>
    </div>

</div>


<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menuTitle">
        LILO O CAGÃO
    </div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>


    <div class="section">
        🐺 PERSONAGENS
    </div>

    <div class="cards">

        <button class="card selected">
            <div class="cardEmoji">🐺</div>
            <div class="cardName">LILO</div>
        </button>

        <button class="card locked">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🐕</div>
            <div class="cardName">CACHORRO</div>
        </button>

        <button class="card locked">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🦊</div>
            <div class="cardName">RAPOSA</div>
        </button>

    </div>


    <div class="section">
        🗺️ MAPAS
    </div>

    <div class="cards">

        <button class="card selected" data-map="1">
            <div class="cardEmoji">🌲</div>
            <div class="cardName">
                MAPA 1<br>FLORESTA
            </div>
        </button>

        <button class="card locked" data-map="2">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🏜️</div>
            <div class="cardName">
                MAPA 2<br>DESERTO
            </div>
        </button>

        <button class="card locked" data-map="3">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🌋</div>
            <div class="cardName">
                MAPA 3<br>VULCÃO
            </div>
        </button>

    </div>


    <button id="play">
        ▶ TOCAR PARA JOGAR
    </button>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- LOBO -->

    <div id="wolf">

        <div class="wolfTail"></div>

        <div class="wolfBody"></div>

        <div class="wolfHead"></div>

        <div class="wolfEar one"></div>
        <div class="wolfEar two"></div>

        <div class="wolfEye one"></div>
        <div class="wolfEye two"></div>

        <div class="wolfMuzzle"></div>
        <div class="wolfNose"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>
        <div class="leg leg3"></div>
        <div class="leg leg4"></div>

    </div>


    <div id="hud">

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            💩 <span id="poop">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>

    </div>


    <button id="home">
        🏠 INÍCIO
    </button>


    <div id="tapStart">

        TOQUE PARA COMEÇAR

        <small>
            Toque para pular 🐺
        </small>

    </div>


    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            Você chegou ao mapa
            <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:7px">
            💩 <span id="finalPoop">0</span>/10
        </div>

        <button class="overButton restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="overButton menuButton" id="backMenu">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>


<script>

/* =====================================================
   PROGRESSO
===================================================== */

let unlockedMap =
    Number(localStorage.getItem("liloMap") || 1);

let selectedMap = 1;


/* =====================================================
   LOADING
===================================================== */

let load = 0;

function loading(){

    load++;

    document.getElementById("percent")
        .textContent = load + "%";

    document.getElementById("barFill")
        .style.width = load + "%";

    if(load < 100){

        setTimeout(loading,25);

    }else{

        setTimeout(()=>{

            document.getElementById("loading")
                .style.display = "none";

            document.getElementById("menu")
                .style.display = "flex";

            updateMenu();

        },400);

    }
}

loading();


/* =====================================================
   MENU
===================================================== */

function updateMenu(){

    document.querySelectorAll("[data-map]")
    .forEach(card=>{

        const map =
            Number(card.dataset.map);

        if(map <= unlockedMap){

            card.classList.remove("locked");

            const lock =
                card.querySelector(".lock");

            if(lock)
                lock.remove();

        }

    });

}

document.querySelectorAll("[data-map]")
.forEach(card=>{

    card.addEventListener("click",()=>{

        const map =
            Number(card.dataset.map);

        if(map > unlockedMap)
            return;

        selectedMap = map;

        document.querySelectorAll("[data-map]")
        .forEach(c =>
            c.classList.remove("selected")
        );

        card.classList.add("selected");

    });

});


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W,H;

function resize(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ÁUDIO
===================================================== */

let audio;

function prepareAudio(){

    if(audio)
        return;

    const AC =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AC)
        return;

    audio = new AC();

}

function bark(){

    if(!audio)
        return;

    if(audio.state === "suspended")
        audio.resume();

    const now =
        audio.currentTime;

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        260,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        100,
        now + .14
    );

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .2,
        now + .015
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .14
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(now);
    osc.stop(now+.15);

}


/* =====================================================
   VARIÁVEIS
===================================================== */

let player;

let obstacles = [];
let poops = [];

let running = false;
let started = false;

let lives = 3;
let poopCount = 0;
let level = 1;


/*
   IMPORTANTE:
   speed NÃO é alterada quando perde vida.
*/

let speed = 4.5;

let obstacleTimer = 90;
let poopTimer = 50;

let invincible = false;

let lastTime = 0;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    level = selectedMap;

    lives = 3;

    poopCount = 0;


    /*
       Velocidade definida somente
       pelo mapa.
    */

    if(level === 1)
        speed = 4.5;

    if(level === 2)
        speed = 5;

    if(level === 3)
        speed = 5.5;


    player = {

        x:52,

        y:H-130,

        w:55,

        h:60,

        vy:0,

        grounded:true

    };


    obstacles = [];
    poops = [];

    obstacleTimer = 95;
    poopTimer = 55;

    invincible = false;


    document.getElementById("poop")
        .textContent = 0;

    document.getElementById("level")
        .textContent = level;

    updateLives();

    updateWolf();

}


/* =====================================================
   LOBO
===================================================== */

function updateWolf(){

    const wolf =
        document.getElementById("wolf");

    /*
       O lobo fica sempre no mesmo
       tamanho e posição.
    */

    wolf.style.left =
        "52px";

    wolf.style.bottom =
        "65px";

    if(started && running){

        wolf.classList.add("running");

    }else{

        wolf.classList.remove("running");

    }

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives(){

    let text="";

    for(let i=0;i<3;i++){

        text +=
            i<lives
            ? "❤️"
            : "🖤";

    }

    document.getElementById("lives")
        .textContent=text;

}


/* =====================================================
   COMEÇAR
===================================================== */

function startGame(){

    prepareAudio();

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    document.getElementById("gameOver")
        .style.display="none";

    resetGame();

    started=false;
    running=false;

    document.getElementById("tapStart")
        .style.display="block";

    updateWolf();

}


/* =====================================================
   VOLTAR
===================================================== */

function backMenu(){

    running=false;
    started=false;

    document.getElementById("game")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="none";

    document.getElementById("menu")
        .style.display="flex";

    updateMenu();

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)
        return;

    if(player.grounded){

        player.vy=-12.5;

        player.grounded=false;

        document.getElementById("wolf")
            .classList.add("jumping");

        bark();

        setTimeout(()=>{

            document.getElementById("wolf")
                .classList.remove("jumping");

        },220);

    }

}


/* =====================================================
   TOQUE
===================================================== */

function gameTouch(e){

    if(e.target.closest("button"))
        return;

    prepareAudio();

    if(!started){

        started=true;
        running=true;

        document.getElementById("tapStart")
            .style.display="none";

        updateWolf();

        jump();

        return;

    }

    jump();

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function spawnObstacle(){

    let type;

    if(level===1){

        const types=[
            "spike",
            "rock",
            "box",
            "doubleSpike"
        ];

        type =
            types[
                Math.floor(
                    Math.random()*types.length
                )
            ];

    }

    else if(level===2){

        const types=[
            "cactus",
            "doubleCactus",
            "rock"
        ];

        type =
            types[
                Math.floor(
                    Math.random()*types.length
                )
            ];

    }

    else{

        const types=[
            "lava",
            "spike",
            "rock"
        ];

        type =
            types[
                Math.floor(
                    Math.random()*types.length
                )
            ];

    }


    let w=48;
    let h=48;

    if(type==="doubleSpike")
        w=88;

    if(type==="cactus"){
        w=42;
        h=62;
    }

    if(type==="doubleCactus"){
        w=86;
        h=62;
    }

    if(type==="lava"){
        w=58;
        h=52;
    }


    obstacles.push({

        x:W+60,

        y:H-65-h,

        w:w,

        h:h,

        type:type

    });

}


/* =====================================================
   BOSTINHA
===================================================== */

function spawnPoop(){

    poops.push({

        x:W+40,

        y:H-150-
            Math.random()*120,

        r:15

    });

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(

        a.x+10 < b.x+b.w &&
        a.x+a.w-10 > b.x &&
        a.y+7 < b.y+b.h &&
        a.y+a.h-5 > b.y

    );

}


/* =====================================================
   BATEU
===================================================== */

function playerHit(){

    if(invincible)
        return;


    invincible=true;

    lives--;

    updateLives();


    /*
       NÃO muda speed.
       NÃO remove obstáculo.
    */

    player.y=H-130;

    player.vy=0;

    player.grounded=true;


    if(lives<=0){

        gameOver();

        return;

    }


    setTimeout(()=>{

        invincible=false;

    },700);

}


/* =====================================================
   FUNDO
===================================================== */

function background(){

    let gradient =
        ctx.createLinearGradient(
            0,0,0,H
        );


    if(level===1){

        gradient.addColorStop(
            0,
            "#49a9d3"
        );

        gradient.addColorStop(
            1,
            "#d8f4ff"
        );

    }


    if(level===2){

        gradient.addColorStop(
            0,
            "#df914b"
        );

        gradient.addColorStop(
            1,
            "#ffe1a4"
        );

    }


    if(level===3){

        gradient.addColorStop(
            0,
            "#34151a"
        );

        gradient.addColorStop(
            1,
            "#c94c35"
        );

    }


    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );


    /* SOL */

    ctx.fillStyle =
        level===3
        ? "#ff5138"
        : "#ffe88a";

    ctx.beginPath();

    ctx.arc(
        W-80,
        75,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* FLORESTA */

    if(level===1){

        for(let i=0;i<9;i++){

            let x =
                i*170-
                (
                    performance.now()
                    *speed/60
                )%170;

            ctx.fillStyle="#31522f";

            ctx.fillRect(
                x,
                H-130,
                9,
                65
            );

            ctx.beginPath();

            ctx.arc(
                x+4,
                H-140,
                38,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* DESERTO */

    if(level===2){

        for(let i=0;i<7;i++){

            let x =
                i*210-
                (
                    performance.now()
                    *speed/70
                )%210;

            ctx.fillStyle="#3d713e";

            ctx.fillRect(
                x,
                H-125,
                9,
                60
            );

            ctx.fillRect(
                x-12,
                H-110,
                12,
                8
            );

            ctx.fillRect(
                x-12,
                H-125,
                8,
                23
            );

        }

    }


    /* VULCÃO */

    if(level===3){

        for(let i=0;i<5;i++){

            let x=i*280;

            ctx.fillStyle="#411e21";

            ctx.beginPath();

            ctx.moveTo(
                x,
                H-65
            );

            ctx.lineTo(
                x+110,
                H-215
            );

            ctx.lineTo(
                x+220,
                H-65
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* CHÃO */

    ctx.fillStyle =
        level===1
        ? "#486e37"
        : level===2
        ? "#c49751"
        : "#342326";

    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );


    ctx.fillStyle =
        level===2
        ? "#e3b66b"
        : level===3
        ? "#ff5735"
        : "#2d4929";

    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   DESENHAR OBSTÁCULO
===================================================== */

function drawObstacle(o){

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        const amount =
            o.type==="doubleSpike"
            ? 2
            : 1;

        for(let i=0;i<amount;i++){

            let x=o.x+i*44;

            ctx.fillStyle="#171a1d";

            ctx.beginPath();

            ctx.moveTo(
                x,
                o.y+o.h
            );

            ctx.lineTo(
                x+22,
                o.y
            );

            ctx.lineTo(
                x+44,
                o.y+o.h
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    else if(
        o.type==="cactus" ||
        o.type==="doubleCactus"
    ){

        const amount =
            o.type==="doubleCactus"
            ? 2
            : 1;

        for(let i=0;i<amount;i++){

            let x=o.x+i*43;

            ctx.fillStyle="#39743b";

            ctx.beginPath();

            ctx.roundRect(
                x+13,
                o.y,
                16,
                o.h,
                8
            );

            ctx.fill();

            ctx.fillRect(
                x+3,
                o.y+20,
                14,
                8
            );

            ctx.fillRect(
                x+3,
                o.y+11,
                8,
                17
            );

            ctx.fillRect(
                x+26,
                o.y+31,
                14,
                8
            );

            ctx.fillRect(
                x+31,
                o.y+20,
                8,
                19
            );

        }

    }


    else if(o.type==="rock"){

        const g =
            ctx.createRadialGradient(
                o.x+12,
                o.y+10,
                2,
                o.x+25,
                o.y+27,
                30
            );

        g.addColorStop(
            0,
            "#90979b"
        );

        g.addColorStop(
            1,
            "#30353a"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            o.x+25,
            o.y+25,
            26,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    else if(o.type==="box"){

        ctx.fillStyle="#654027";

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

        ctx.strokeStyle="#29160c";

        ctx.lineWidth=3;

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

    }


    else if(o.type==="lava"){

        ctx.fillStyle="#541b19";

        ctx.beginPath();

        ctx.arc(
            o.x+29,
            o.y+26,
            27,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#ff4b2e";

        ctx.lineWidth=4;

        ctx.stroke();

    }

}


/* =====================================================
   BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.fillStyle="#75421f";

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        16,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        12,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        -4,
        -7,
        9,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        4,
        -14,
        7,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   PASSAR MAPA
===================================================== */

function checkLevel(){

    if(poopCount<10)
        return;


    if(level<3){

        const next =
            level+1;


        if(next>unlockedMap){

            unlockedMap=next;

            localStorage.setItem(
                "liloMap",
                unlockedMap
            );

        }


        level=next;

        poopCount=0;

        obstacles=[];
        poops=[];

        /*
           Só aqui a velocidade muda.
        */

        if(level===2)
            speed=5;

        if(level===3)
            speed=5.5;


        document.getElementById("level")
            .textContent=level;

        document.getElementById("poop")
            .textContent=0;

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;

    updateWolf();

    document.getElementById("finalLevel")
        .textContent=level;

    document.getElementById("finalPoop")
        .textContent=poopCount;

    document.getElementById("gameOver")
        .style.display="flex";

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

    if(!lastTime)
        lastTime=time;


    let delta =
        time-lastTime;

    lastTime=time;


    delta =
        Math.min(delta,32);


    let dt =
        delta/16.6667;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    if(
        document.getElementById("game")
        .style.display!=="none"
    ){

        background();


        if(started && running){

            /* FÍSICA */

            player.vy +=
                .65*dt;

            player.y +=
                player.vy*dt;


            if(
                player.y>=H-130
            ){

                player.y=H-130;

                player.vy=0;

                player.grounded=true;

            }


            /* OBSTÁCULOS */

            obstacleTimer-=dt;


            if(
                obstacleTimer<=0
            ){

                spawnObstacle();

                obstacleTimer =
                    100+
                    Math.random()*40;

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                let o=obstacles[i];


                /*
                   VELOCIDADE ABSOLUTAMENTE
                   INDEPENDENTE DAS VIDAS.
                */

                o.x -=
                    speed*dt;


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    playerHit();

                    /*
                       IMPORTANTE:
                       o obstáculo NÃO é removido.
                    */

                    break;

                }

            }


            obstacles =
                obstacles.filter(
                    o=>o.x>-150
                );


            /* BOSTINHAS */

            poopTimer-=dt;


            if(
                poopTimer<=0
            ){

                spawnPoop();

                poopTimer =
                    75+
                    Math.random()*60;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                let p=poops[i];

                p.x -=
                    speed*dt;


                drawPoop(p);


                let box={

                    x:p.x-p.r,

                    y:p.y-p.r,

                    w:p.r*2,

                    h:p.r*2

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );

                    poopCount++;


                    document.getElementById(
                        "poop"
                    ).textContent =
                        poopCount;


                    checkLevel();

                }

            }


            poops =
                poops.filter(
                    p=>p.x>-60
                );

        }


        updateWolf();

    }


    requestAnimationFrame(loop);

}


/* =====================================================
   BOTÕES
===================================================== */

document.getElementById("play")
.addEventListener(
    "click",
    startGame
);


document.getElementById("game")
.addEventListener(
    "pointerdown",
    gameTouch
);


document.getElementById("home")
.addEventListener(
    "click",
    backMenu
);


document.getElementById("backMenu")
.addEventListener(
    "click",
    backMenu
);


document.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tapStart")
            .style.display="block";

        updateWolf();

    }
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();

            prepareAudio();

            if(
                document.getElementById("game")
                .style.display!=="none"
            ){

                if(!started){

                    started=true;
                    running=true;

                    document.getElementById(
                        "tapStart"
                    ).style.display="none";

                }

                jump();

            }

        }

    }
);


/* =====================================================
   INICIA O JOGO
===================================================== */

requestAnimationFrame(loop);

</script>
