<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050608;
}

button{
    font-family:Arial,sans-serif;
    cursor:pointer;
    touch-action:manipulation;
}

/* =========================
   CARREGAMENTO
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    background:
        radial-gradient(circle,#343b43,#090b0f 65%,#020304);
}

.loadingTitle{
    font-size:40px;
    font-weight:900;
    text-align:center;
    letter-spacing:3px;
    text-shadow:0 0 12px red,0 0 30px #700;
}

.loadingWolf{
    font-size:90px;
    margin:20px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadingBar{
    width:280px;
    height:13px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;
    background:#e00000;
    box-shadow:0 0 15px red;
}

/* =========================
   MENU
========================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    overflow-y:auto;
    color:white;
    text-align:center;
    padding:18px 12px 35px;

    background:
        radial-gradient(circle at 50% 20%,#394149,#080a0e 70%);
}

.menuTitle{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:0 0 15px red,0 0 30px #700;
}

.subtitle{
    margin-top:5px;
    color:#aaa;
    font-size:14px;
}

.creator{
    margin:9px 0 15px;
    color:#ff3434;
    font-weight:bold;
}

.sectionTitle{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

/* =========================
   30 MAPAS
========================= */

#maps{
    width:100%;
    max-width:650px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;

    padding-bottom:18px;
}

.map{
    min-height:82px;
    border-radius:13px;
    border:2px solid #444b52;

    color:white;

    background:
        linear-gradient(145deg,#292e33,#0e1013);

    position:relative;

    font-weight:bold;
    font-size:12px;

    transition:.15s;
}

.map:active{
    transform:scale(.95);
}

.map.unlocked{
    border-color:#777;
}

.map.selected{
    border-color:#ff2020;
    box-shadow:
        0 0 12px rgba(255,0,0,.65),
        inset 0 0 10px rgba(255,0,0,.15);
}

.map.locked{
    opacity:.35;
}

.mapNumber{
    font-size:16px;
    display:block;
}

.mapIcon{
    font-size:26px;
    display:block;
    margin:2px;
}

.lock{
    position:absolute;
    top:5px;
    right:6px;
    font-size:15px;
}

#play{
    width:280px;
    padding:16px;

    border:2px solid #ff3333;
    border-radius:12px;

    background:#750000;
    color:white;

    font-size:18px;
    font-weight:bold;

    margin-bottom:20px;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================
   LOBO
========================= */

#wolf{
    position:absolute;

    width:66px;
    height:78px;

    z-index:30;

    pointer-events:none;

    transform-origin:center bottom;
}

/* corpo */

.wBody{
    position:absolute;

    left:5px;
    top:34px;

    width:48px;
    height:27px;

    border-radius:55%;

    background:
        linear-gradient(
            145deg,
            #8b9297,
            #3b4146 65%,
            #171a1d
        );
}

/* cabeça */

.wHead{
    position:absolute;

    left:32px;
    top:8px;

    width:36px;
    height:39px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #91979a,
            #454b50
        );
}

/* orelhas */

.wEar{
    position:absolute;

    width:18px;
    height:28px;

    background:#282d31;

    clip-path:
        polygon(50% 0,100% 100%,0 100%);
}

.wEar.a{
    left:32px;
    top:0;
}

.wEar.b{
    left:51px;
    top:1px;
}

/* DOIS OLHOS */

.wEye{
    position:absolute;

    top:20px;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff1111;

    box-shadow:
        0 0 7px red,
        0 0 13px red;
}

.wEye.a{
    left:41px;
}

.wEye.b{
    left:55px;
}

/* focinho */

.wMuzzle{
    position:absolute;

    left:53px;
    top:29px;

    width:19px;
    height:12px;

    border-radius:50%;

    background:#555b60;
}

.wNose{
    position:absolute;

    left:68px;
    top:32px;

    width:6px;
    height:5px;

    border-radius:50%;

    background:#000;
}

/* cauda */

.wTail{
    position:absolute;

    left:0;
    top:27px;

    width:26px;
    height:18px;

    border-top:7px solid #292e32;

    border-radius:50%;

    transform:rotate(-30deg);
}

/* pernas */

.leg{
    position:absolute;

    top:53px;

    width:7px;
    height:23px;

    border-radius:8px;

    background:#171a1d;
}

.l1{left:8px}
.l2{left:20px}
.l3{left:36px}
.l4{left:48px}

#wolf.running .l1,
#wolf.running .l3{
    animation:legA .16s infinite alternate;
}

#wolf.running .l2,
#wolf.running .l4{
    animation:legB .16s infinite alternate;
}

@keyframes legA{
    from{transform:rotate(22deg)}
    to{transform:rotate(-22deg)}
}

@keyframes legB{
    from{transform:rotate(-22deg)}
    to{transform:rotate(22deg)}
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;

    z-index:50;

    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;

    color:white;

    font-size:18px;
    font-weight:bold;

    text-shadow:2px 2px 5px #000;
}

#poop{
    color:#d59a61;
}

#home{
    position:absolute;

    z-index:60;

    top:45px;
    right:10px;

    padding:8px 11px;

    border:1px solid white;
    border-radius:8px;

    color:white;
    background:rgba(0,0,0,.6);
}

#tapStart{
    position:absolute;

    z-index:55;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:23px;
    font-weight:bold;

    text-align:center;

    text-shadow:2px 2px 8px black;

    pointer-events:none;
}

#tapStart small{
    display:block;
    margin-top:9px;
    font-size:14px;
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    display:none;

    position:absolute;
    inset:0;

    z-index:100;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;

    background:rgba(0,0,0,.88);
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
    margin-bottom:12px;
}

.overButton{
    margin-top:15px;
    padding:14px 28px;

    border:0;
    border-radius:10px;

    color:white;

    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#780000;
}

.menuButton{
    background:#333;
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="loadingTitle">
        LILO O CAGÃO
    </div>

    <div class="loadingWolf">🐺</div>

    <div class="loadingText">
        CARREGANDO
    </div>

    <div id="percent">0%</div>

    <div class="loadingBar">
        <div id="barFill"></div>
    </div>

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menuTitle">
        LILO O CAGÃO
    </div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="sectionTitle">
        🗺️ SELECIONE O MAPA
    </div>

    <!-- OS 30 MAPAS APARECEM AQUI -->
    <div id="maps"></div>

    <button id="play">
        ▶ JOGAR MAPA SELECIONADO
    </button>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <!-- LOBO -->
    <div id="wolf">

        <div class="wTail"></div>
        <div class="wBody"></div>
        <div class="wHead"></div>

        <div class="wEar a"></div>
        <div class="wEar b"></div>

        <div class="wEye a"></div>
        <div class="wEye b"></div>

        <div class="wMuzzle"></div>
        <div class="wNose"></div>

        <div class="leg l1"></div>
        <div class="leg l2"></div>
        <div class="leg l3"></div>
        <div class="leg l4"></div>

    </div>


    <div id="hud">

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            💩 <span id="poop">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>

    </div>


    <button id="home">
        🏠 INÍCIO
    </button>


    <div id="tapStart">

        TOQUE PARA COMEÇAR

        <small>
            Toque novamente para pular
        </small>

    </div>


    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            Você chegou ao mapa
            <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:8px">
            💩 <span id="finalPoop">0</span>/10
        </div>

        <button class="overButton restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="overButton menuButton" id="backMenu">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>


<script>

/* =====================================================
   LOADING 0 → 100
===================================================== */

let load=0;

function loading(){

    load++;

    document.getElementById("percent")
        .textContent=load+"%";

    document.getElementById("barFill")
        .style.width=load+"%";

    if(load<100){

        setTimeout(loading,20);

    }else{

        setTimeout(()=>{

            document.getElementById("loading")
                .style.display="none";

            document.getElementById("menu")
                .style.display="block";

            createMaps();

        },350);

    }
}

loading();


/* =====================================================
   MAPAS
===================================================== */

const mapsData=[
    ["🏙️","CIDADE"],
    ["🏜️","DESERTO"],
    ["🌲","FLORESTA"],
    ["⛰️","MONTANHA"],
    ["🏖️","PRAIA"],
    ["❄️","NEVE"],
    ["🌋","VULCÃO"],
    ["🐊","PÂNTANO"],
    ["🪨","CAVERNA"],
    ["🌙","NOITE"],
    ["🌾","FAZENDA"],
    ["🌉","PONTE"],
    ["🏚️","RUÍNAS"],
    ["🌲","FLORESTA ESCURA"],
    ["🏙️","CIDADE 2"],
    ["🏜️","DESERTO 2"],
    ["🧊","GELO"],
    ["🏝️","ILHA"],
    ["⛈️","TEMPESTADE"],
    ["⛰️","MONTANHA 2"],
    ["🌃","CIDADE NOTURNA"],
    ["🌋","VULCÃO 2"],
    ["🕳️","CAVERNA 2"],
    ["🌲","FLORESTA 2"],
    ["🏜️","DESERTO 3"],
    ["🏖️","PRAIA 2"],
    ["❄️","NEVE 2"],
    ["🏚️","RUÍNAS 2"],
    ["🏢","TORRES"],
    ["👑","MAPA FINAL"]
];


/*
   Salva quantos mapas já foram
   desbloqueados.
*/

let unlockedMap=
    parseInt(
        localStorage.getItem(
            "LILO_UNLOCKED_MAP"
        )
    ) || 1;


if(unlockedMap<1)
    unlockedMap=1;

if(unlockedMap>30)
    unlockedMap=30;


let selectedMap=1;


function createMaps(){

    const container=
        document.getElementById("maps");

    container.innerHTML="";


    /*
       IMPORTANTE:
       FORÇA A CRIAÇÃO DOS 30 MAPAS.
    */

    for(
        let i=0;
        i<30;
        i++
    ){

        const mapNumber=i+1;

        const button=
            document.createElement("button");


        button.className="map";


        if(
            mapNumber<=unlockedMap
        ){

            button.classList.add(
                "unlocked"
            );

        }else{

            button.classList.add(
                "locked"
            );

        }


        if(
            mapNumber===selectedMap
        ){

            button.classList.add(
                "selected"
            );

        }


        button.innerHTML=`

            ${
                mapNumber>unlockedMap
                ? '<span class="lock">🔒</span>'
                : ''
            }

            <span class="mapIcon">
                ${mapsData[i][0]}
            </span>

            <span class="mapNumber">
                MAPA ${mapNumber}
            </span>

            ${mapsData[i][1]}

        `;


        button.addEventListener(
            "click",
            ()=>{

                /*
                   Mapa bloqueado não seleciona.
                */

                if(
                    mapNumber>unlockedMap
                ){

                    return;

                }


                selectedMap=
                    mapNumber;


                document
                    .querySelectorAll(".map")
                    .forEach(
                        m=>
                            m.classList.remove(
                                "selected"
                            )
                    );


                button.classList.add(
                    "selected"
                );

            }
        );


        container.appendChild(
            button
        );

    }

}


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W,H;

function resize(){

    W=
        canvas.width=
        window.innerWidth;

    H=
        canvas.height=
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let player;

let obstacles=[];
let poops=[];

let started=false;
let running=false;

let lives=3;
let poopCount=0;

let level=1;


/*
   VELOCIDADE NÃO MUDA
   QUANDO PERDE VIDA.
*/

let speed=4.2;

let obstacleTimer=80;
let poopTimer=70;

let hitCooldown=false;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    level=selectedMap;

    lives=3;
    poopCount=0;

    /*
       Velocidade fixa.
    */

    speed=4.2;


    player={

        x:42,

        y:H-130,

        width:58,

        height:62,

        velocityY:0,

        grounded:true

    };


    obstacles=[];
    poops=[];

    obstacleTimer=70;
    poopTimer=65;

    hitCooldown=false;


    updateLives();

    document.getElementById("poop")
        .textContent="0";

    document.getElementById("level")
        .textContent=level;


    updateWolf();

}


/* =====================================================
   POSIÇÃO DO LOBO
===================================================== */

function updateWolf(){

    const wolf=
        document.getElementById("wolf");


    wolf.style.left=
        player.x+"px";

    wolf.style.top=
        player.y+"px";


    if(
        started &&
        running
    ){

        wolf.classList.add(
            "running"
        );

    }else{

        wolf.classList.remove(
            "running"
        );

    }

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives(){

    let result="";

    for(
        let i=0;
        i<3;
        i++
    ){

        result+=
            i<lives
            ? "❤️"
            : "🖤";

    }

    document.getElementById("lives")
        .textContent=result;

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)
        return;


    if(
        !player.grounded
    )
        return;


    /*
       PULO ALTO.

       O lobo sobe porque
       player.y também sobe.
    */

    player.velocityY=-17;


    player.grounded=false;


    bark();

}


/* =====================================================
   LATIDO
===================================================== */

let audio=null;

function bark(){

    try{

        if(!audio){

            audio=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audio.state==="suspended"
        ){

            audio.resume();

        }


        const now=
            audio.currentTime;


        const osc=
            audio.createOscillator();

        const gain=
            audio.createGain();


        osc.type="square";


        osc.frequency.setValueAtTime(
            420,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            130,
            now+.16
        );


        gain.gain.setValueAtTime(
            .001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .18,
            now+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+.18
        );


        osc.connect(gain);

        gain.connect(
            audio.destination
        );


        osc.start(now);

        osc.stop(
            now+.19
        );

    }catch(e){}

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function obstacleTypes(){

    if(level===1){

        return[
            "building",
            "spike",
            "barrier"
        ];

    }


    if(level===2){

        return[
            "cactus",
            "cactus",
            "rock",
            "spike"
        ];

    }


    if(level===3){

        return[
            "rock",
            "spike",
            "doubleSpike"
        ];

    }


    if(level===4){

        return[
            "rock",
            "spike",
            "doubleSpike"
        ];

    }


    return[
        "spike",
        "rock",
        "doubleSpike",
        "barrier"
    ];

}


function spawnObstacle(){

    const list=
        obstacleTypes();


    const type=
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];


    let width=48;
    let height=48;


    if(type==="doubleSpike")
        width=90;


    if(type==="cactus"){

        width=42;
        height=60;

    }


    if(type==="building"){

        width=55;
        height=60;

    }


    obstacles.push({

        x:W+50,

        y:H-65-height,

        width:width,

        height:height,

        type:type

    });

}


/* =====================================================
   BOSTINHAS
===================================================== */

function spawnPoop(){

    /*
       Nunca coloca uma bostinha
       exatamente em cima de um obstáculo.
    */

    let y;

    let attempts=0;


    do{

        y=
            H-
            (
                105+
                Math.random()*185
            );

        attempts++;


    }while(

        attempts<20 &&
        obstacles.some(
            o=>
                Math.abs(
                    o.x-(W+80)
                )<90 &&
                Math.abs(
                    o.y-y
                )<75
        )

    );


    poops.push({

        x:W+80,

        y:y,

        width:30,

        height:30

    });

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(

        a.x+8<
            b.x+b.width &&

        a.x+a.width-8>
            b.x &&

        a.y+8<
            b.y+b.height &&

        a.y+a.height-5>
            b.y

    );

}


/* =====================================================
   ACERTOU OBSTÁCULO
===================================================== */

function hitObstacle(){

    if(hitCooldown)
        return;


    hitCooldown=true;


    lives--;


    updateLives();


    /*
       MUITO IMPORTANTE:
       speed NÃO é alterada.
    */

    player.velocityY=-6;


    /*
       O obstáculo continua na tela.
    */


    if(lives<=0){

        gameOver();

        return;

    }


    setTimeout(
        ()=>{
            hitCooldown=false;
        },
        850
    );

}


/* =====================================================
   FUNDO
===================================================== */

function drawBackground(){

    let gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );


    /* =================
       MAPA 1 - CIDADE
    ================= */

    if(level===1){

        gradient.addColorStop(
            0,
            "#4d91c7"
        );

        gradient.addColorStop(
            1,
            "#d9edf7"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,0,W,H
        );


        /*
           prédios passando
        */

        for(
            let i=0;
            i<12;
            i++
        ){

            let x=
                i*90-
                (
                    performance.now()
                    *speed/55
                )%90;


            let bh=
                120+
                (i%4)*45;


            ctx.fillStyle=
                i%2
                ? "#4d5963"
                : "#303a43";


            ctx.fillRect(
                x,
                H-65-bh,
                72,
                bh
            );


            ctx.fillStyle="#ffd86b";


            for(
                let yy=
                    H-45-bh;
                yy<
                    H-85;
                yy+=27
            ){

                ctx.fillRect(
                    x+12,
                    yy,
                    8,
                    11
                );

                ctx.fillRect(
                    x+31,
                    yy,
                    8,
                    11
                );

                ctx.fillRect(
                    x+50,
                    yy,
                    8,
                    11
                );

            }

        }

    }


    /* =================
       MAPA 2 - DESERTO
    ================= */

    else if(level===2){

        gradient.addColorStop(
            0,
            "#e78c45"
        );

        gradient.addColorStop(
            1,
            "#ffe0a1"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,0,W,H
        );


        /*
           dunas
        */

        ctx.fillStyle="#d9a15d";


        for(
            let i=0;
            i<7;
            i++
        ){

            let x=
                i*180-
                (
                    performance.now()
                    *speed/55
                )%180;


            ctx.beginPath();

            ctx.arc(
                x,
                H-70,
                80,
                Math.PI,
                0
            );

            ctx.fill();

        }

    }


    /* =================
       MAPA 3 - FLORESTA
    ================= */

    else if(level===3){

        gradient.addColorStop(
            0,
            "#65acd1"
        );

        gradient.addColorStop(
            1,
            "#bce1b6"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,0,W,H
        );


        for(
            let i=0;
            i<9;
            i++
        ){

            let x=
                i*150-
                (
                    performance.now()
                    *speed/50
                )%150;


            ctx.fillStyle="#345c34";

            ctx.fillRect(
                x,
                H-155,
                13,
                90
            );


            ctx.beginPath();

            ctx.arc(
                x+6,
                H-165,
                48,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* =================
       MAPAS 4+
    ================= */

    else{

        gradient.addColorStop(
            0,
            level%2
            ? "#536f8a"
            : "#273743"
        );

        gradient.addColorStop(
            1,
            level%2
            ? "#b8d0d9"
            : "#111820"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,0,W,H
        );


        /*
           elementos diferentes
           conforme o mapa
        */

        for(
            let i=0;
            i<8;
            i++
        ){

            let x=
                i*170-
                (
                    performance.now()
                    *speed/45
                )%170;


            ctx.fillStyle=
                level%3===0
                ? "#293e2b"
                : "#3d4c57";


            ctx.fillRect(
                x,
                H-140,
                80,
                75
            );

        }

    }


    /* chão */

    ctx.fillStyle=
        level===2
        ? "#bd914f"
        : "#3e4938";


    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );


    ctx.fillStyle=
        level===2
        ? "#d9aa61"
        : "#283528";


    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   DESENHAR OBSTÁCULO
===================================================== */

function drawObstacle(o){

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        const count=
            o.type==="doubleSpike"
            ? 2
            : 1;


        for(
            let i=0;
            i<count;
            i++
        ){

            const x=
                o.x+i*45;


            ctx.fillStyle="#17191c";

            ctx.beginPath();

            ctx.moveTo(
                x,
                o.y+o.height
            );

            ctx.lineTo(
                x+22,
                o.y
            );

            ctx.lineTo(
                x+44,
                o.y+o.height
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    else if(o.type==="cactus"){

        ctx.fillStyle="#347e3b";

        ctx.fillRect(
            o.x+12,
            o.y,
            17,
            o.height
        );

        ctx.fillRect(
            o.x,
            o.y+25,
            14,
            9
        );

        ctx.fillRect(
            o.x,
            o.y+12,
            8,
            25
        );

        ctx.fillRect(
            o.x+28,
            o.y+35,
            14,
            9
        );

        ctx.fillRect(
            o.x+34,
            o.y+23,
            8,
            22
        );

    }


    else if(o.type==="rock"){

        ctx.fillStyle="#656b70";

        ctx.beginPath();

        ctx.arc(
            o.x+24,
            o.y+25,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    else if(o.type==="building"){

        ctx.fillStyle="#252d34";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        ctx.fillStyle="#ffd34f";

        ctx.fillRect(
            o.x+9,
            o.y+12,
            10,
            12
        );

        ctx.fillRect(
            o.x+34,
            o.y+12,
            10,
            12
        );

        ctx.fillRect(
            o.x+9,
            o.y+35,
            10,
            12
        );

        ctx.fillRect(
            o.x+34,
            o.y+35,
            10,
            12
        );

    }


    else if(o.type==="barrier"){

        ctx.fillStyle="#d65b2d";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            o.x+4,
            o.y+12,
            o.width-8,
            8
        );

    }

}


/* =====================================================
   DESENHAR BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#70401f";


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y+7,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-2,
        10,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-10,
        7,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.fillStyle="#3e2413";

    ctx.beginPath();

    ctx.arc(
        p.x-4,
        p.y-3,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   PRÓXIMO MAPA
===================================================== */

function nextMap(){

    if(
        level>=30
    ){

        alert(
            "🏆 PARABÉNS! VOCÊ COMPLETOU OS 30 MAPAS!"
        );

        return;

    }


    level++;

    poopCount=0;


    /*
       DESBLOQUEIA O PRÓXIMO.
    */

    if(
        level>unlockedMap
    ){

        unlockedMap=level;


        localStorage.setItem(
            "LILO_UNLOCKED_MAP",
            unlockedMap
        );

    }


    selectedMap=level;


    obstacles=[];
    poops=[];


    document.getElementById("level")
        .textContent=level;

    document.getElementById("poop")
        .textContent="0";


    createMaps();

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;


    document.getElementById("wolf")
        .classList.remove("running");


    document.getElementById("finalLevel")
        .textContent=level;


    document.getElementById("finalPoop")
        .textContent=poopCount;


    document.getElementById("gameOver")
        .style.display="flex";

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;


    const delta=
        Math.min(
            time-lastTime,
            32
        );


    lastTime=time;


    const dt=
        delta/16.6667;


    if(
        document.getElementById("game")
        .style.display==="block"
    ){

        drawBackground();


        if(
            started &&
            running
        ){

            /* =================
               FÍSICA
            ================= */

            player.velocityY+=
                .58*dt;


            player.y+=
                player.velocityY*dt;


            if(
                player.y>=H-130
            ){

                player.y=H-130;

                player.velocityY=0;

                player.grounded=true;

            }


            updateWolf();


            /* =================
               OBSTÁCULOS
            ================= */

            obstacleTimer-=dt;


            if(
                obstacleTimer<=0
            ){

                spawnObstacle();


                obstacleTimer=
                    85+
                    Math.random()*45;

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=
                    obstacles[i];


                /*
                   VELOCIDADE FIXA.
                */

                o.x-=
                    speed*dt;


                drawObstacle(o);


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    hitObstacle();

                }

            }


            obstacles=
                obstacles.filter(
                    o=>o.x>-150
                );


            /* =================
               BOSTINHAS
            ================= */

            poopTimer-=dt;


            if(
                poopTimer<=0
            ){

                spawnPoop();


                poopTimer=
                    75+
                    Math.random()*55;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=
                    poops[i];


                p.x-=
                    speed*dt;


                drawPoop(p);


                const box={

                    x:p.x-15,

                    y:p.y-15,

                    width:30,

                    height:30

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );


                    poopCount++;


                    document.getElementById(
                        "poop"
                    ).textContent=
                        poopCount;


                    if(
                        poopCount>=10
                    ){

                        nextMap();

                    }

                }

            }


            poops=
                poops.filter(
                    p=>p.x>-50
                );

        }

    }


    requestAnimationFrame(loop);

}


/* =====================================================
   COMEÇAR JOGO
===================================================== */

document.getElementById("play")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("menu")
            .style.display="none";

        document.getElementById("game")
            .style.display="block";

        document.getElementById("gameOver")
            .style.display="none";


        resetGame();


        started=false;
        running=false;


        document.getElementById("tapStart")
            .style.display="block";


        updateWolf();

    }
);


/* =====================================================
   TOQUE NA TELA
===================================================== */

document.getElementById("game")
.addEventListener(
    "pointerdown",
    e=>{

        /*
           Botões não fazem o lobo pular.
        */

        if(
            e.target.closest &&
            e.target.closest("button")
        )
            return;


        if(!started){

            started=true;
            running=true;

            document.getElementById("tapStart")
                .style.display="none";

            updateWolf();

            return;

        }


        jump();

    }
);


/* =====================================================
   REINICIAR
===================================================== */

document.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("gameOver")
            .style.display="none";


        resetGame();


        started=false;
        running=false;


        document.getElementById("tapStart")
            .style.display="block";


        updateWolf();

    }
);


/* =====================================================
   VOLTAR AO MENU
===================================================== */

function backToMenu(){

    running=false;
    started=false;


    document.getElementById("game")
        .style.display="none";


    document.getElementById("gameOver")
        .style.display="none";


    document.getElementById("menu")
        .style.display="block";


    createMaps();

}


document.getElementById("home")
.addEventListener(
    "click",
    backToMenu
);


document.getElementById("backMenu")
.addEventListener(
    "click",
    backToMenu
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();


            if(
                document.getElementById("game")
                .style.display==="block"
            ){

                if(!started){

                    started=true;
                    running=true;

                    document.getElementById(
                        "tapStart"
                    ).style.display="none";

                }else{

                    jump();

                }

            }

        }

    }
);


/* =====================================================
   INICIA LOOP
===================================================== */

requestAnimationFrame(loop);

</script>
