<!-- SUBSTITUA SOMENTE O BLOCO #menu DO SEU CÓDIGO POR ESTE -->

<style>
/* ================= MENU NOVO — NÃO ALTERA O GAME ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    overflow-y:auto;

    color:white;
    text-align:center;

    padding:25px 12px 40px;

    background:
        radial-gradient(circle at 50% 18%,
        #59636d 0%,
        #20272e 35%,
        #090c10 72%,
        #020304 100%);
}

/* brilho decorativo */

#menu::before{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    left:50%;
    top:35%;
    transform:translate(-50%,-50%);

    background:radial-gradient(
        circle,
        rgba(255,0,0,.16),
        transparent 70%
    );

    pointer-events:none;
}

/* título */

.title{
    position:relative;
    z-index:2;

    font-size:45px;
    font-weight:900;
    letter-spacing:4px;

    margin-top:5px;

    text-shadow:
        0 0 8px #ff0000,
        0 0 22px #b00000,
        0 0 45px #650000;
}

/* subtítulo */

.sub{
    position:relative;
    z-index:2;

    color:#d0d0d0;
    font-size:12px;
    letter-spacing:3px;

    margin-top:7px;
}

/* CRIADOR */

.creator{
    position:relative;
    z-index:2;

    display:inline-block;

    margin:15px auto 17px;
    padding:8px 18px;

    border:1px solid rgba(255,60,60,.65);
    border-radius:20px;

    font-size:15px;
    font-weight:900;

    color:#fff;

    background:
        linear-gradient(
            180deg,
            rgba(150,0,0,.45),
            rgba(40,0,0,.45)
        );

    box-shadow:
        0 0 15px rgba(255,0,0,.2);

    text-shadow:
        0 0 7px red;
}

/* títulos das seções */

.sectionTitle{
    position:relative;
    z-index:2;

    margin:12px 0 9px;

    font-size:17px;
    font-weight:bold;

    text-shadow:
        0 2px 5px #000;
}

/* personagens */

#characters{
    position:relative;
    z-index:2;

    display:flex;
    gap:10px;

    overflow-x:auto;

    max-width:700px;

    margin:auto;

    padding:4px 3px 13px;

    scrollbar-width:none;
}

#characters::-webkit-scrollbar{
    display:none;
}

.char{
    flex:0 0 105px;
    height:125px;

    border:2px solid #454c53;
    border-radius:15px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #3b434a,
            #0b0e11
        );

    position:relative;

    box-shadow:
        0 8px 20px rgba(0,0,0,.45);

    transition:.15s;
}

.char.selected{
    border-color:#ff2222;

    box-shadow:
        0 0 10px rgba(255,0,0,.55),
        inset 0 0 15px rgba(255,0,0,.08);
}

/* mapas */

#maps{
    position:relative;
    z-index:2;

    width:100%;
    max-width:700px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.map{
    min-height:75px;

    border:2px solid #41474c;
    border-radius:12px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #30373d,
            #090c0f
        );

    position:relative;

    box-shadow:
        0 6px 15px rgba(0,0,0,.4);
}

.map.selected{
    border-color:#ff2222;

    box-shadow:
        0 0 12px rgba(255,0,0,.5);
}

/* botão */

#play{
    position:relative;
    z-index:2;

    margin-top:18px;

    width:285px;
    padding:16px;

    border-radius:13px;

    color:white;

    background:
        linear-gradient(
            180deg,
            #b40000,
            #650000
        );

    border:2px solid #ff4545;

    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;

    box-shadow:
        0 7px 25px rgba(0,0,0,.65),
        0 0 18px rgba(255,0,0,.22);
}

#play:active{
    transform:scale(.97);
}
</style>


<div id="menu">

    <div class="title">
        LILO O CAGÃO
    </div>

    <div class="sub">
        CORRA • PULE • PEGUE 💩
    </div>

    <!-- NOME DO CRIADOR -->
    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="sectionTitle">
        🐺 SELEÇÃO DE PERSONAGEM
    </div>

    <div id="characters"></div>

    <div class="sectionTitle">
        🗺️ SELEÇÃO DE MAPA
    </div>

    <div id="maps"></div>

    <button id="play">
        ▶ JOGAR
    </button>

</div>
