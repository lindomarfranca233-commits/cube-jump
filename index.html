<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050505;
}

button,input{
    border:0;
    font-family:Arial,sans-serif;
    touch-action:manipulation;
}

input{
    user-select:text;
    -webkit-user-select:text;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
    radial-gradient(circle at center,#424b54 0%,#11151a 45%,#020304 100%);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:0 0 10px red,0 0 30px #800000;
}

.loadWolf{
    font-size:90px;
    margin:18px 0;
}

.loadText{
    color:#aaa;
    letter-spacing:4px;
    font-size:13px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadBar{
    width:280px;
    height:13px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#fill{
    width:0%;
    height:100%;
    background:#e00000;
    box-shadow:0 0 15px red;
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    overflow-y:auto;
    color:white;
    text-align:center;
    padding:25px 12px 40px;

    background:
    radial-gradient(circle at 50% 18%,
    #59636d 0%,
    #20272e 35%,
    #090c10 72%,
    #020304 100%);
}

.title{
    font-size:45px;
    font-weight:900;
    letter-spacing:4px;
    margin-top:5px;
    text-shadow:
    0 0 8px #ff0000,
    0 0 22px #b00000,
    0 0 45px #650000;
}

.sub{
    color:#d0d0d0;
    font-size:12px;
    letter-spacing:3px;
    margin-top:7px;
}

/* ================= USUÁRIO ================= */

.userBox{
    width:100%;
    max-width:430px;
    margin:18px auto 12px;
    padding:15px;
    border:1px solid #555;
    border-radius:15px;
    background:rgba(0,0,0,.38);
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.userTitle{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
    color:#ddd;
}

#usernameInput{
    width:100%;
    height:45px;
    border-radius:10px;
    padding:0 13px;
    color:white;
    background:#171b1f;
    border:2px solid #444;
    outline:none;
    font-size:16px;
    text-align:center;
}

#usernameInput:focus{
    border-color:#ff2222;
}

.userButtons{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.userButtons button{
    flex:1;
    padding:11px 5px;
    border-radius:9px;
    color:white;
    font-weight:bold;
    background:#333;
    border:1px solid #666;
}

#saveUser{
    background:#780000;
    border-color:#e33;
}

#userStatus{
    margin-top:9px;
    color:#aaa;
    font-size:12px;
}

.creator{
    display:inline-block;
    margin:15px auto 17px;
    padding:8px 18px;
    border:1px solid rgba(255,60,60,.65);
    border-radius:20px;
    font-size:15px;
    font-weight:900;
    color:#fff;
    background:linear-gradient(
        180deg,
        rgba(150,0,0,.45),
        rgba(40,0,0,.45)
    );
    box-shadow:0 0 15px rgba(255,0,0,.2);
    text-shadow:0 0 7px red;
}

.sectionTitle{
    margin:12px 0 9px;
    font-size:17px;
    font-weight:bold;
}

#characters{
    display:flex;
    gap:10px;
    overflow-x:auto;
    max-width:700px;
    margin:auto;
    padding:4px 3px 13px;
    scrollbar-width:none;
}

#characters::-webkit-scrollbar{
    display:none;
}

.char{
    flex:0 0 105px;
    height:130px;
    border:2px solid #454c53;
    border-radius:15px;
    color:white;
    background:linear-gradient(145deg,#3b434a,#0b0e11);
    position:relative;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.char.selected{
    border-color:#ff2222;
    box-shadow:
    0 0 10px rgba(255,0,0,.55),
    inset 0 0 15px rgba(255,0,0,.08);
}

.char.locked{
    opacity:.35;
}

.charIcon{
    display:block;
    font-size:48px;
    margin:7px 0;
}

.charName{
    font-size:11px;
    font-weight:bold;
}

.charLock{
    position:absolute;
    right:5px;
    top:4px;
}

#maps{
    width:100%;
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.map{
    min-height:78px;
    border:2px solid #41474c;
    border-radius:12px;
    color:white;
    background:linear-gradient(145deg,#30373d,#090c0f);
    position:relative;
    box-shadow:0 6px 15px rgba(0,0,0,.4);
}

.map.selected{
    border-color:#ff2222;
    box-shadow:0 0 12px rgba(255,0,0,.5);
}

.map.locked{
    opacity:.28;
}

.mapIcon{
    display:block;
    font-size:25px;
    margin:4px;
}

.mapName{
    font-size:10px;
    font-weight:bold;
}

.mapLock{
    position:absolute;
    top:4px;
    right:5px;
}

#play{
    margin-top:18px;
    width:285px;
    padding:16px;
    border-radius:13px;
    color:white;
    background:linear-gradient(180deg,#b40000,#650000);
    border:2px solid #ff4545;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:
    0 7px 25px rgba(0,0,0,.65),
    0 0 18px rgba(255,0,0,.22);
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= ANIMAL ================= */

#wolf{
    position:absolute;
    width:78px;
    height:78px;
    z-index:20;
    pointer-events:none;
}

.animalBody{
    position:absolute;
    left:5px;
    top:34px;
    width:51px;
    height:29px;
    border-radius:60%;
}

.animalHead{
    position:absolute;
    left:35px;
    top:7px;
    width:38px;
    height:40px;
    border-radius:50%;
}

.animalEar{
    position:absolute;
    width:19px;
    height:28px;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.animalEar.one{
    left:38px;
    top:0;
}

.animalEar.two{
    left:55px;
    top:2px;
}

.animalEye{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ff1717;
    box-shadow:0 0 8px red;
}

.animalEye.one{
    left:48px;
    top:20px;
}

.animalEye.two{
    left:62px;
    top:20px;
}

.animalMuzzle{
    position:absolute;
    left:54px;
    top:30px;
    width:22px;
    height:13px;
    border-radius:50%;
}

.animalNose{
    position:absolute;
    left:70px;
    top:33px;
    width:7px;
    height:6px;
    border-radius:50%;
    background:#050505;
}

.animalTail{
    position:absolute;
    left:0;
    top:24px;
    width:29px;
    height:23px;
    border-top:8px solid;
    border-radius:50%;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:56px;
    width:8px;
    height:21px;
    border-radius:8px;
}

.leg1{left:8px}
.leg2{left:21px}
.leg3{left:37px}
.leg4{left:51px}

#wolf.running .leg1,
#wolf.running .leg3{
    animation:run1 .15s infinite alternate;
}

#wolf.running .leg2,
#wolf.running .leg4{
    animation:run2 .15s infinite alternate;
}

@keyframes run1{
    from{transform:rotate(22deg)}
    to{transform:rotate(-22deg)}
}

@keyframes run2{
    from{transform:rotate(-22deg)}
    to{transform:rotate(22deg)}
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
}

#poopCount{
    color:#d49a61;
}

#playerNameHUD{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:43px;
    z-index:55;
    color:white;
    font-weight:bold;
    font-size:14px;
    text-shadow:2px 2px 5px #000;
}

#home{
    position:absolute;
    top:43px;
    right:10px;
    z-index:60;
    padding:8px 11px;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    color:white;
    border:1px solid white;
}

#tap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:40;
    color:white;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    text-shadow:2px 2px 7px black;
    pointer-events:none;
}

#tap small{
    display:block;
    margin-top:8px;
    font-size:14px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(0,0,0,.9);
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
    margin-bottom:10px;

}

    padding:14px 28px;

    font-weight:bold;

<body>

<div id="loading">
    <div class="logo">LILO O CAGÃO</div>
    <div class="loadWolf">🐺</div>
    <div class="loadText">CARREGANDO</div>
    <div id="percent">0%</div>
    <div class="loadBar">
        <div id="fill"></div>
    </div>
</div>

<div id="menu">

    <div class="title">LILO O CAGÃO</div>

    <div class="sub">
        CORRA • PULE • PEGUE 💩
    </div>

    <!-- USUÁRIO -->
    <div class="userBox">

        <div class="userTitle">
            👤 SEU USUÁRIO
        </div>

        <input
            id="usernameInput"
            maxlength="16"
            placeholder="Digite seu nome"
            autocomplete="off"
        >

        <div class="userButtons">

            <button id="saveUser">
                💾 SALVAR
            </button>

            <button id="newUser">
                ➕ NOVO
            </button>

        </div>

        <div id="userStatus">
            Nenhum usuário selecionado
        </div>

    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="sectionTitle">
        🐾 PERSONAGENS
    </div>

    <div id="characters"></div>

    <div class="sectionTitle">
        🗺️ MAPAS
    </div>

    <div id="maps"></div>

    <button id="play">
        ▶ JOGAR
    </button>

</div>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="wolf" class="lobo">

        <div class="animalTail"></div>
        <div class="animalBody"></div>
        <div class="animalHead"></div>

        <div class="animalEar one"></div>
        <div class="animalEar two"></div>

        <div class="animalEye one"></div>
        <div class="animalEye two"></div>

        <div class="animalMuzzle"></div>
        <div class="animalNose"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>
        <div class="leg leg3"></div>
        <div class="leg leg4"></div>

    </div>

    <div id="hud">

        <div id="lives">❤️❤️❤️</div>

        <div>
            💩 <span id="poopCount">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>

    </div>

    <div id="playerNameHUD"></div>

    <button id="home">
        🏠 INÍCIO
    </button>

    <div id="tap">
        TOQUE PARA COMEÇAR
        <small>Toque para pular</small>
    </div>

    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            MAPA:
            <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:6px">
            💩:
            <span id="finalPoop">0</span>/10
        </div>

        <button class="overBtn restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="overBtn back" id="back">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>

<script>

/* =====================================================
   CARREGAMENTO
===================================================== */

let loadingValue=0;

function loading(){

    loadingValue++;

    document.getElementById("percent")
        .textContent=loadingValue+"%";

    document.getElementById("fill")
        .style.width=loadingValue+"%";

    if(loadingValue<100){

        setTimeout(loading,18);

    }else{

        setTimeout(()=>{

            document.getElementById("loading")
                .style.display="none";

            document.getElementById("menu")
                .style.display="block";

            loadActiveUser();
            buildCharacters();
            buildMaps();

        },350);

    }
}

loading();


/* =====================================================
   USUÁRIOS
===================================================== */

let activeUser="";

let userProfiles={};

try{

    userProfiles=
        JSON.parse(
            localStorage.getItem(
                "liloUserProfiles"
            ) || "{}"
        );

}catch(e){

    userProfiles={};

}


function normalizeUser(name){

    return name
        .trim()
        .replace(/\s+/g," ")
        .slice(0,16);

}


function saveProfiles(){

    localStorage.setItem(
        "liloUserProfiles",
        JSON.stringify(userProfiles)
    );

}


function getUserData(){

    if(!activeUser)
        return null;

    if(!userProfiles[activeUser]){

        userProfiles[activeUser]={

            unlockedMap:1,

            unlockedCharacters:1

        };

    }

    return userProfiles[activeUser];

}


function saveUserProgress(){

    if(!activeUser)
        return;

    const data=getUserData();

    data.unlockedMap=
        unlockedMap;

    data.unlockedCharacters=
        unlockedCharacters;

    saveProfiles();

}


function loadActiveUser(){

    const saved=
        localStorage.getItem(
            "liloActiveUser"
        );

    if(saved){

        activeUser=saved;

        const data=getUserData();

        unlockedMap=
            data.unlockedMap || 1;

        unlockedCharacters=
            data.unlockedCharacters || 1;

        document.getElementById(
            "usernameInput"
        ).value=activeUser;

        updateUserStatus();

    }

}


function updateUserStatus(){

    const status=
        document.getElementById(
            "userStatus"
        );

    if(!activeUser){

        status.textContent=
            "Nenhum usuário selecionado";

        return;

    }

    const data=getUserData();

    status.textContent=
        "👤 "+activeUser+
        " • 🗺️ Mapa "+(data.unlockedMap||1);

}


function activateUser(name){

    name=normalizeUser(name);

    if(!name){

        alert(
            "Digite um nome para o usuário."
        );

        return false;

    }

    activeUser=name;

    if(!userProfiles[activeUser]){

        userProfiles[activeUser]={

            unlockedMap:1,

            unlockedCharacters:1

        };

    }

    const data=
        userProfiles[activeUser];

    unlockedMap=
        Number(data.unlockedMap)||1;

    unlockedCharacters=
        Number(data.unlockedCharacters)||1;

    localStorage.setItem(
        "liloActiveUser",
        activeUser
    );

    saveProfiles();

    document.getElementById(
        "usernameInput"
    ).value=activeUser;

    selectedMap=
        Math.min(
            selectedMap,
            unlockedMap
        );

    selectedMap=
        Math.max(
            1,
            selectedMap
        );

    updateUserStatus();

    buildCharacters();
    buildMaps();

    return true;

}


document.getElementById("saveUser")
.addEventListener(
    "click",
    ()=>{

        const input=
            document.getElementById(
                "usernameInput"
            );

        activateUser(input.value);

    }
);


document.getElementById("newUser")
.addEventListener(
    "click",
    ()=>{

        activeUser="";

        document.getElementById(
            "usernameInput"
        ).value="";

        document.getElementById(
            "userStatus"
        ).textContent=
            "Digite um novo nome";

        selectedMap=1;

        selectedCharacter=0;

        buildCharacters();
        buildMaps();

    }
);


/* =====================================================
   PERSONAGENS
===================================================== */

const characters=[

    {
        icon:"🐺",
        name:"LOBO",
        unlock:1,
        css:"lobo"
    },

    {
        icon:"🐕",
        name:"CACHORRO",
        unlock:5,
        css:"cachorro"
    },

    {
        icon:"🐱",
        name:"GATO",
        unlock:10,
        css:"gato"
    },

    {
        icon:"🐯",
        name:"TIGRE",
        unlock:15,
        css:"tigre"
    },

    {
        icon:"🦁",
        name:"LEÃO",
        unlock:20,
        css:"leao"
    },

    {
        icon:"🐻",
        name:"URSO",
        unlock:25,
        css:"urso"
    },

    {
        icon:"🐲",
        name:"DRAGÃO",
        unlock:30,
        css:"dragao"
    }

];

let unlockedMap=1;
let selectedMap=1;
let selectedCharacter=0;
let unlockedCharacters=1;


function buildCharacters(){

    const box=
        document.getElementById("characters");

    box.innerHTML="";

    characters.forEach((c,index)=>{

        const unlocked=
            index===0 ||
            unlockedCharacters>=c.unlock;

        const btn=
            document.createElement("button");

        btn.className="char";

        if(
            index===selectedCharacter &&
            unlocked
        )
            btn.classList.add("selected");

        if(!unlocked)

let audioContext=null;

function bark(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state==="suspended")
            audioContext.resume();

        const now=
            audioContext.currentTime;

        const osc=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        osc.type="square";

        osc.frequency.setValueAtTime(
            430,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            170,
            now+.13
        );

        gain.gain.setValueAtTime(.001,now);

        gain.gain.exponentialRampToValueAtTime(
            .1,
            now+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+.17
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now+.18);

    }catch(e){}

}


/* =====================================================
   MÚSICA GAME OVER
===================================================== */

let sadMusicTimer=null;

function startSadMusic(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state==="suspended")
            audioContext.resume();

        stopSadMusic();

        const notes=[
            392,
            349,
            330,
            294,
            262,
            220,
            196
        ];

        let index=0;

        function playNote(){

            if(
                document.getElementById("gameOver")
                .style.display!=="flex"
            ){
                return;
            }

            const now=
                audioContext.currentTime;

            const osc=
                audioContext.createOscillator();

            const gain=
                audioContext.createGain();

            osc.type="sine";

            osc.frequency.setValueAtTime(
                notes[index],
                now
            );

            gain.gain.setValueAtTime(
                .001,
                now
            );

            gain.gain.linearRampToValueAtTime(
                .09,
                now+.15
            );

            gain.gain.linearRampToValueAtTime(
                .001,
                now+.75
            );

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start(now);
            osc.stop(now+.8);

            index=
                (index+1)%notes.length;

            sadMusicTimer=
                setTimeout(playNote,760);

        }

        playNote();

    }catch(e){}

}


function stopSadMusic(){

    if(sadMusicTimer){

        clearTimeout(sadMusicTimer);

        sadMusicTimer=null;

    }

}

function spawnObstacle(){

    const types=
        getObstacleTypes();

    const type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

    let width=45;
    let height=40;

    if(type==="snowman"){
        width=46;
        height=55;
    }

    if(type==="cactus"){
        width=38;
        height=52;
    }

    if(
        type==="tree" ||
        type==="darktree" ||
        type==="snowtree"
    ){

        width=45;
        height=60;

    }

    if(type==="water"){
        width=70;
        height=28;
    }

    if(type==="barrier"){
        width=52;
        height=40;
    }

    obstacles.push({

        x:W+70,

        y:H-65-height,

        width:width,
        height:height,

        type:type

    });

}


function spawnPoop(){

    let p=null;

    for(
        let attempt=0;
        attempt<50;
        attempt++
    ){

        const candidate={

            x:W+100+
                Math.random()*120,

            y:H-110-
                Math.random()*50,

            width:28,
            height:28

        };

        const blocked=
            obstacles.some(o=>

                candidate.x+14 >
                o.x-5 &&

                candidate.x-14 <
                o.x+o.width+5 &&

                candidate.y+14 >
                o.y-5 &&

                candidate.y-14 <
                o.y+o.height+5

            );

        if(!blocked){

            p=candidate;
            break;

        }

    }

    if(p)
        poops.push(p);

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    const playerBox={

        x:a.x+17,
        y:a.y+18,

        width:a.width-27,
        height:a.height-20

    };

    const obstacleBox={

        x:b.x+5,
        y:b.y+5,

        width:Math.max(
            1,
            b.width-10
        ),

        height:Math.max(
            1,
            b.height-5
        )

    };

    return(

        playerBox.x <
        obstacleBox.x+
        obstacleBox.width &&

        playerBox.x+
        playerBox.width >
        obstacleBox.x &&

        playerBox.y <
        obstacleBox.y+
        obstacleBox.height &&

        playerBox.y+
        playerBox.height >
        obstacleBox.y

    );

}

function gradientBackground(top,bottom){

    const sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(0,top);
    sky.addColorStop(1,bottom);

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,W,H
    );

}


function drawCity(){

    );

    ctx.fillStyle="#303b43";

    for(let i=0;i<12;i++){

        const x=
            i*100-
            (performance.now()*.035%100);

        const h=
            120+(i%4)*35;

        ctx.fillRect(
            x,
            H-65-h,
            75,
            h
        );

    }

    ctx.fillStyle="#ffe06a";

    for(let i=0;i<30;i++){

        const x=
            (i%10)*100+12;

        const y=
            H-120-
            Math.floor(i/10)*35;

        ctx.fillRect(

        W*.75,H-250,

        drawWinter();

        ctx.fillStyle="#a8d4e9";

        for(let i=0;i<9;i++){

            ctx.fillRect(
                i*130,
                H-250,
                90,
                85
            );

        }

    }

    else if(level===28){

        gradientBackground(
            "#39383f",
            "#aaa29a"
        );

        ctx.fillStyle="#55483b";

        for(let i=0;i<10;i++){

            ctx.fillRect(
                i*140,
                H-210-(i%2)*25,
                90,
                145
            );

        }

    }

    else if(level===29){

        gradientBackground(
            "#4b5968",
            "#b5c8d2"
        );

        ctx.fillStyle="#4d4d51";

        for(let i=0;i<11;i++){

            ctx.fillRect(
                i*115,
                H-210,
                75,
                145
            );

        }

    }

    else{

        gradientBackground(
            "#130f21",
            "#633c66"
        );

        ctx.fillStyle="#33243b";

        for(let i=0;i<12;i++){

            ctx.fillRect(
                i*110,
                H-230-(i%3)*30,
                75,
                165+(i%3)*30
            );

        }

        ctx.fillStyle="#e6c75c";

        ctx.beginPath();

        ctx.arc(
            W*.8,
            H*.2,
            45,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    const groundColors={

        2:"#b98a4e",
        5:"#e4c477",
        6:"#e9f7ff",
        7:"#33251f",
        8:"#365440",
        9:"#242b31",
        17:"#d3f2ff",
        18:"#e4ca7d",
        20:"#edfaff",
        24:"#eaf7fb",
        25:"#d4a04e",
        26:"#e5c879",
        27:"#eafaff"

    };

    ctx.fillStyle=
        groundColors[level] ||
        "#405239";

    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );

    ctx.fillStyle=
        level===8
        ? "#3c7168"
        : level===5 ||
          level===18 ||
          level===26
        ? "#3c9fb9"
        : "rgba(255,255,255,.18)";

    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacle(o){

    const x=o.x;
    const y=o.y;
    const w=o.width;
    const h=o.height;


    if(o.type==="car"){

        ctx.fillStyle="#bd2525";

        ctx.fillRect(
            x,
            y+15,
            w,
            h-15
        );

        ctx.fillStyle="#65a4c5";

        ctx.fillRect(
            x+10,
            y+5,
            w-20,
            18
        );

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            x+10,
            y+h,
            8,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+w-10,
            y+h,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;

    }


    if(o.type==="cone"){

        ctx.fillStyle="#f07824";

        ctx.beginPath();

        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x,y+h);

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x+8,
            y+h*.55,
            w-16,
            7
        );

        return;

    }


    if(
        o.type==="rock" ||
        o.type==="snowrock" ||
        o.type==="beachrock" ||
        o.type==="lavaRock" ||
        o.type==="redrock" ||
        o.type==="goldrock" ||
        o.type==="bridgeRock" ||
        o.type==="palmrock"
    ){

        if(
            o.type==="snowrock"
        )
            ctx.fillStyle="#dff6ff";

        else if(o.type==="lavaRock")
            ctx.fillStyle="#592a20";

        else if(o.type==="redrock")
            ctx.fillStyle="#873e30";

        else if(o.type==="goldrock")
            ctx.fillStyle="#bd8b2f";

        else if(o.type==="beachrock")
            ctx.fillStyle="#8c7965";

        else
            ctx.fillStyle="#666d72";

        ctx.beginPath();

        ctx.moveTo(
            x+5,
            y+h
        );

        ctx.lineTo(
            x+12,
            y+10
        );

        ctx.lineTo(
            x+w*.55,
            y
        );

        ctx.lineTo(
            x+w-4,
            y+15
        );

        ctx.lineTo(
            x+w-8,
            y+h
        );

        ctx.closePath();

        ctx.fill();

        return;

    }


    if(o.type==="cactus"){

        ctx.fillStyle="#348b42";

        ctx.fillRect(
            x+12,
            y,
            15,
            h
        );

        ctx.fillRect(
            x,
            y+18,
            13,
            10
        );

        ctx.fillRect(
            x,
            y+8,
            8,
            25
        );

        ctx.fillRect(
            x+27,
            y+30,
            12,
            10
        );

        ctx.fillRect(
            x+31,
            y+18,
            8,
            24
        );

        return;

    }


    if(o.type==="log"){

        ctx.fillStyle="#71452a";

        ctx.beginPath();

        ctx.roundRect(
            x,
            y+12,
            w,
            25,
            8
        );

        ctx.fill();

        ctx.fillStyle="#c08a55";

        ctx.beginPath();

        ctx.arc(
            x+w-5,
            y+25,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;

    }


    if(
        o.type==="bush" ||
        o.type==="darktree" ||
        o.type==="snowtree"
    ){

        ctx.fillStyle=
            o.type==="snowtree"
            ? "#d9eef5"
            : o.type==="darktree"
            ? "#193c28"
            : "#2f6d38";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+25,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#583b23";

        ctx.fillRect(
            x+w/2-5,
            y+30,
            10,
            h-30
        );

        return;

    }


    if(o.type==="snowman"){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h-12,
            18,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+w/2,
            y+h-34,
            14,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+w/2,
            y+h-51,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            x+17,
            y+14,
            2.5,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+29,
            y+14,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#ed7529";

        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y+20
        );

        ctx.lineTo(
            x+w/2+12,
            y+24
        );

        ctx.lineTo(
            x+w/2,
            y+27
        );

        ctx.fill();

        return;

    }


    if(
        o.type==="ice" ||
        o.type==="crystal"
    ){

        ctx.fillStyle=
            o.type==="ice"
            ? "#9be5ff"
            : "#8bc7e8";

        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y
        );

        ctx.lineTo(
            x+w,
            y+h
        );

        ctx.lineTo(
            x+w/2,
            y+h-10
        );

        ctx.lineTo(
            x,
            y+h
        );

        ctx.closePath();

        ctx.fill();

        return;

    }


    if(
        o.type==="fire" ||
        o.type==="lightning"
    ){

        ctx.fillStyle=
            o.type==="fire"
            ? "#ff641f"
            : "#f4e84d";

        ctx.beginPath();

        ctx.moveTo(
            x+w/2,
            y
        );

        ctx.lineTo(
            x+w,
            y+h
        );

        ctx.lineTo(
            x+w*.55,
            y+h-10
        );

        ctx.lineTo(
            x+w*.35,
            y+h
        );

        ctx.closePath();

        ctx.fill();

        return;

    }


    if(o.type==="water"){

        ctx.fillStyle="#2f8995";

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#7ed6d0";

        ctx.stroke();

        return;

    }


    if(o.type==="fence"){

        ctx.fillStyle="#8b633d";

        ctx.fillRect(
            x,y+10,w,8
        );

        ctx.fillRect(
            x,y+30,w,8
        );

        ctx.fillRect(
            x+5,y,7,h
        );

        ctx.fillRect(
            x+w-12,y,w>35?7:6,h
        );

        return;

    }


    if(o.type==="hay"){

        ctx.fillStyle="#c7a348";

        ctx.fillRect(
            x,y,w,h
        );

        ctx.strokeStyle="#806729";

        for(let i=0;i<4;i++){

            ctx.beginPath();

            ctx.moveTo(
                x+i*10,
                y
            );

            ctx.lineTo(
                x+i*10,
                y+h
            );

            ctx.stroke();

        }

        return;

    }


    if(o.type==="wall"){

        ctx.fillStyle="#625e58";

        ctx.fillRect(
            x,y,w,h
        );

        ctx.strokeStyle="#373531";

        ctx.strokeRect(
            x,y,w,h
        );

        return;

    }


    if(
        o.type==="box" ||
        o.type==="crate"
    ){

        ctx.fillStyle="#875b31";

        ctx.fillRect(
            x,y,w,h
        );

        ctx.strokeStyle="#d29a54";

        ctx.lineWidth=3;

        ctx.strokeRect(
            x+3,
            y+3,
            w-6,
            h-6
        );

        ctx.beginPath();

        ctx.moveTo(x,y);
        ctx.lineTo(x+w,y+h);

        ctx.moveTo(x+w,y);
        ctx.lineTo(x,y+h);

        ctx.stroke();

        return;

    }


    if(o.type==="barrier"){

        ctx.fillStyle="#edb52e";

        ctx.fillRect(
            x,
            y+12,
            w,
            10
        );

        ctx.fillRect(
            x,
            y+30,
            w,
            10
        );

        ctx.fillStyle="#555";

        ctx.fillRect(
            x+5,
            y+5,
            7,
            h
        );

        ctx.fillRect(
            x+w-12,
            y+5,
            7,
            h
        );

        return;

    }


    if(o.type==="lamp"){

        ctx.fillStyle="#30343a";

        ctx.fillRect(
            x+w/2-4,
            y+15,
            8,
            h
        );

        ctx.fillStyle="#f4df74";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+10,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;

    }


    if(o.type==="barrel"){

        ctx.fillStyle="#74452b";

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#3b2619";

        ctx.stroke();

        return;

    }


    if(o.type==="shell"){

        ctx.fillStyle="#e5a06d";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h,
            w/2,
            Math.PI,
            0
        );

        ctx.fill();

        return;

    }


    ctx.fillStyle="#666";

    ctx.beginPath();

    ctx.arc(
        x+w/2,
        y+h/2,
        Math.min(w,h)/2,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#75431f";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y+8,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        10,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-8,
        7,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.fillStyle="#3d2415";

    ctx.beginPath();

    ctx.arc(
        p.x-4,
        p.y-2,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   PASSAR MAPA
===================================================== */

function completeMap(){

    if(level>=30){

        running=false;

        alert(
            "🏆 PARABÉNS "+(
                activeUser || "JOGADOR"
            )+
            "!\n\nVOCÊ TERMINOU OS 30 MAPAS!"
        );

        backToMenu();

        return;

    }

    level++;

    poop=0;

    obstacles=[];
    poops=[];

    if(level>unlockedMap){

        unlockedMap=level;

    }

    unlockedCharacters=
        Math.max(
            unlockedCharacters,
            level
        );

    /*
       SALVA SOMENTE NO USUÁRIO ATUAL
    */

    saveUserProgress();

    selectedMap=level;

    document.getElementById("level")
        .textContent=level;

    document.getElementById("poopCount")
        .textContent=0;

    obstacleTimer=115;
    poopTimer=70;

    buildMaps();
    buildCharacters();

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;

    document.getElementById("finalLevel")
        .textContent=level;

    document.getElementById("finalPoop")
        .textContent=poop;

    document.getElementById("gameOver")
        .style.display="flex";

    updateWolf();

    setTimeout(
        startSadMusic,
        100
    );

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;

    const delta=
        Math.min(
            time-lastTime,
            32
        );

    lastTime=time;

    const dt=
        delta/16.6667;

    if(
        document.getElementById("game")
        .style.display==="block"
    ){

        drawBackground();

        if(started && running){

            player.vy+=
                .58*dt;

            player.y+=
                player.vy*dt;

            if(player.y>=H-130){

                player.y=H-130;

                player.vy=0;

                player.grounded=true;

            }

            updateWolf();


            obstacleTimer-=dt;

            if(obstacleTimer<=0){

                spawnObstacle();

                obstacleTimer=
                    115+
                    Math.random()*65;

            }

            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=
                    obstacles[i];

                o.x-=
                    GAME_SPEED*dt;

                drawObstacle(o);

                if(
                    collision(
                        player,
                        o
                    )
                ){

                    hitObstacle();

                }

            }

            obstacles=
                obstacles.filter(
                    o=>o.x>-180
                );


            poopTimer-=dt;

            if(poopTimer<=0){

                spawnPoop();

                poopTimer=
                    85+
                    Math.random()*55;

            }

            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=
                    poops[i];

                p.x-=
                    GAME_SPEED*dt;

                drawPoop(p);

                const box={

                    x:p.x-14,
                    y:p.y-14,
                    width:28,
                    height:28

                };

                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(i,1);

                    poop++;

                    document.getElementById(
                        "poopCount"
                    ).textContent=poop;

                    if(poop>=10){

                        completeMap();

                    }

                }

            }

            poops=
                poops.filter(
                    p=>p.x>-60
                );

        }

    }

    requestAnimationFrame(loop);

}


/* =====================================================
   JOGAR
===================================================== */

document.getElementById("play")
.addEventListener(
    "click",
    ()=>{

        if(!activeUser){

            const input=
                document.getElementById(
                    "usernameInput"
                );

            if(!activateUser(input.value))
                return;

        }

        stopSadMusic();

        document.getElementById("menu")
            .style.display="none";

        document.getElementById("game")
            .style.display="block";

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tap")
            .style.display="block";

        updateWolf();

    }
);


/* =====================================================
   TOQUE
===================================================== */

document.getElementById("game")
.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.target.closest &&
            e.target.closest("button")
        ){
            return;
        }

        if(!started){

            started=true;
            running=true;

            document.getElementById("tap")
                .style.display="none";

            updateWolf();

            return;

        }

        jump();

    }
);


/* =====================================================
   REINICIAR
===================================================== */

document.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        stopSadMusic();

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tap")
            .style.display="block";

        updateWolf();

    }
);


/* =====================================================
   MENU
===================================================== */

function backToMenu(){

    stopSadMusic();

    running=false;
    started=false;

    /*
       Salva o progresso atual antes de sair.
    */

    saveUserProgress();

    document.getElementById("game")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="none";

    document.getElementById("menu")
        .style.display="block";

    buildMaps();
    buildCharacters();

    updateUserStatus();

}


document.getElementById("home")
.addEventListener(
    "click",
    backToMenu
);

document.getElementById("back")
.addEventListener(
    "click",
    backToMenu
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();

            if(
                document.getElementById("game")
                .style.display==="block"
            ){

                if(!started){

                    started=true;
                    running=true;

                    document.getElementById("tap")
                        .style.display="none";

                    updateWolf();

                }else{

                    jump();

                }

            }

        }

    }
);


/* =====================================================
   LOOP
===================================================== */

requestAnimationFrame(loop);

</script>
