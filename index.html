<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050608;
}

button{
    font-family:Arial,sans-serif;
    touch-action:manipulation;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:radial-gradient(circle,#343b43,#090b0f 65%,#020304);
}

.loadingTitle{
    font-size:38px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 0 15px red;
    text-align:center;
}

.loadingWolf{
    font-size:90px;
    margin:20px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadingBar{
    width:280px;
    height:13px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;
    background:#e00000;
    box-shadow:0 0 15px red;
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    overflow-y:auto;
    z-index:100;
    color:white;
    text-align:center;
    padding:15px 10px 30px;
    background:
        radial-gradient(circle at 50% 10%,#3c4650,#090c10 70%);
}

.menuTitle{
    font-size:40px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 0 15px red,0 0 30px #700;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin-top:4px;
}

.creator{
    color:#ff3535;
    font-weight:bold;
    margin:8px 0 13px;
}

.section{
    font-size:19px;
    font-weight:bold;
    margin:10px 0;
}

/* ================= PERSONAGENS ================= */

#characters{
    display:flex;
    gap:10px;
    overflow-x:auto;
    max-width:650px;
    margin:auto;
    padding:5px 3px 12px;
}

.character{
    min-width:105px;
    height:125px;

    border:2px solid #454b51;
    border-radius:14px;

    background:linear-gradient(145deg,#2b3035,#0d0f12);
    color:white;

    font-weight:bold;
    font-size:12px;

    position:relative;
}

.character.selected{
    border-color:#ff2020;
    box-shadow:0 0 15px rgba(255,0,0,.5);
}

.character.locked{
    opacity:.35;
}

.charIcon{
    display:block;
    font-size:48px;
    margin:7px;
}

.charLock{
    position:absolute;
    top:5px;
    right:6px;
}

/* ================= MAPAS ================= */

#maps{
    width:100%;
    max-width:650px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.map{
    min-height:78px;
    border:2px solid #444;
    border-radius:12px;

    background:linear-gradient(145deg,#292f34,#0c0f12);
    color:white;

    font-size:11px;
    font-weight:bold;

    position:relative;
}

.map.selected{
    border-color:#ff2222;
    box-shadow:0 0 13px rgba(255,0,0,.55);
}

.map.locked{
    opacity:.3;
}

.mapIcon{
    display:block;
    font-size:25px;
    margin:3px;
}

.lock{
    position:absolute;
    right:5px;
    top:4px;
}

#play{
    width:280px;
    padding:15px;
    margin-top:18px;

    border:2px solid #ff3333;
    border-radius:12px;

    background:#760000;
    color:white;

    font-size:17px;
    font-weight:bold;
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= LOBO ================= */

#wolf{
    position:absolute;
    width:60px;
    height:72px;
    z-index:30;
    pointer-events:none;
}

.wBody{
    position:absolute;
    left:4px;
    top:32px;
    width:47px;
    height:27px;
    border-radius:55%;
    background:linear-gradient(145deg,#92989b,#3c4246 65%,#17191c);
}

.wHead{
    position:absolute;
    left:30px;
    top:7px;
    width:35px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(145deg,#969c9f,#464c51);
}

.wEar{
    position:absolute;
    width:18px;
    height:27px;
    background:#252a2e;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.wEar.a{
    left:30px;
    top:0;
}

.wEar.b{
    left:49px;
    top:1px;
}

.wEye{
    position:absolute;
    top:19px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ff1111;
    box-shadow:0 0 8px red;
}

.wEye.a{
    left:39px;
}

.wEye.b{
    left:53px;
}

.wMuzzle{
    position:absolute;
    left:50px;
    top:28px;
    width:20px;
    height:12px;
    border-radius:50%;
    background:#5d6367;
}

.wNose{
    position:absolute;
    left:66px;
    top:31px;
    width:6px;
    height:5px;
    border-radius:50%;
    background:#000;
}

.wTail{
    position:absolute;
    left:0;
    top:25px;
    width:25px;
    height:20px;
    border-top:7px solid #292e32;
    border-radius:50%;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:52px;
    width:7px;
    height:21px;
    border-radius:8px;
    background:#17191c;
}

.l1{left:7px}
.l2{left:19px}
.l3{left:35px}
.l4{left:47px}

#wolf.running .l1,
#wolf.running .l3{
    animation:legA .16s infinite alternate;
}

#wolf.running .l2,
#wolf.running .l4{
    animation:legB .16s infinite alternate;
}

@keyframes legA{
    from{transform:rotate(20deg)}
    to{transform:rotate(-20deg)}
}

@keyframes legB{
    from{transform:rotate(-20deg)}
    to{transform:rotate(20deg)}
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    z-index:50;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;

    color:white;
    font-size:18px;
    font-weight:bold;

    text-shadow:2px 2px 5px #000;
}

#poop{
    color:#d39a60;
}

#home{
    position:absolute;
    z-index:60;
    top:43px;
    right:10px;

    padding:8px 11px;
    border:1px solid white;
    border-radius:8px;

    color:white;
    background:rgba(0,0,0,.55);
}

#tapStart{
    position:absolute;
    z-index:55;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;
    font-size:23px;
    font-weight:bold;
    text-align:center;

    text-shadow:2px 2px 8px #000;
    pointer-events:none;
}

#tapStart small{
    display:block;
    margin-top:9px;
    font-size:14px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;
    text-align:center;

    background:rgba(0,0,0,.88);
}

#gameOver h2{
    color:#ff2222;
    font-size:44px;
    margin-bottom:12px;
}

.overButton{
    margin-top:14px;
    padding:14px 28px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#780000;
}

.menuButton{
    background:#333;
}
</style>
</head>

<body>

<!-- LOADING -->

<div id="loading">
    <div class="loadingTitle">LILO O CAGÃO</div>
    <div class="loadingWolf">🐺</div>
    <div class="loadingText">CARREGANDO</div>
    <div id="percent">0%</div>

    <div class="loadingBar">
        <div id="barFill"></div>
    </div>
</div>


<!-- MENU -->

<div id="menu">

    <div class="menuTitle">LILO O CAGÃO</div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="section">
        🐺 ESCOLHA SEU PERSONAGEM
    </div>

    <div id="characters"></div>

    <div class="section">
        🗺️ ESCOLHA O MAPA
    </div>

    <div id="maps"></div>

    <button id="play">
        ▶ JOGAR
    </button>

</div>


<!-- GAME -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="wolf">

        <div class="wTail"></div>
        <div class="wBody"></div>
        <div class="wHead"></div>

        <div class="wEar a"></div>
        <div class="wEar b"></div>

        <div class="wEye a"></div>
        <div class="wEye b"></div>

        <div class="wMuzzle"></div>
        <div class="wNose"></div>

        <div class="leg l1"></div>
        <div class="leg l2"></div>
        <div class="leg l3"></div>
        <div class="leg l4"></div>

    </div>

    <div id="hud">

        <div id="lives">❤️❤️❤️</div>

        <div>
            💩 <span id="poop">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>

    </div>

    <button id="home">
        🏠 INÍCIO
    </button>

    <div id="tapStart">
        TOQUE PARA COMEÇAR
        <small>Toque novamente para pular</small>
    </div>

    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            MAPA <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:7px">
            💩 <span id="finalPoop">0</span>/10
        </div>

        <button class="overButton restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="overButton menuButton" id="backMenu">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>


<script>

/* =====================================================
   LOADING
===================================================== */

let load=0;

function loading(){

    load++;

    document.getElementById("percent").textContent=
        load+"%";

    document.getElementById("barFill").style.width=
        load+"%";

    if(load<100){

        setTimeout(loading,20);

    }else{

        setTimeout(()=>{

            document.getElementById("loading").style.display=
                "none";

            document.getElementById("menu").style.display=
                "block";

            createCharacters();
            createMaps();

        },300);

    }
}

loading();


/* =====================================================
   PERSONAGENS
===================================================== */

const characters=[

    ["🐺","LOBO","1"],
    ["🐕","CACHORRO","5"],
    ["🦊","RAPOSA","10"],
    ["🐯","TIGRE","15"],
    ["🦁","LEÃO","20"],
    ["🐻","URSO","25"],
    ["🐲","LOBO DRAGÃO","30"]

];


let selectedCharacter=0;


let unlockedCharacters=
    parseInt(
        localStorage.getItem("LILO_CHARACTERS")
    ) || 1;


function createCharacters(){

    const box=
        document.getElementById("characters");

    box.innerHTML="";


    characters.forEach(
        (char,index)=>{

            const required=
                Number(char[2]);


            const unlocked=
                index===0 ||
                unlockedCharacters>=required;


            const button=
                document.createElement("button");


            button.className="character";


            if(
                index===selectedCharacter
                && unlocked
            ){

                button.classList.add("selected");

            }


            if(!unlocked){

                button.classList.add("locked");

            }


            button.innerHTML=`

                ${
                    !unlocked
                    ? '<span class="charLock">🔒</span>'
                    : ''
                }

                <span class="charIcon">
                    ${char[0]}
                </span>

                ${char[1]}

                <br>

                ${
                    unlocked
                    ? "DESBLOQUEADO"
                    : "MAPA "+required
                }

            `;


            button.addEventListener(
                "click",
                ()=>{

                    if(!unlocked)
                        return;


                    selectedCharacter=index;


                    document
                    .querySelectorAll(".character")
                    .forEach(
                        c=>
                            c.classList.remove(
                                "selected"
                            )
                    );


                    button.classList.add(
                        "selected"
                    );

                }
            );


            box.appendChild(button);

        }
    );

}


/* =====================================================
   MAPAS
===================================================== */

const mapsData=[

["🏙️","CIDADE"],
["🏜️","DESERTO"],
["🌲","FLORESTA"],
["⛰️","MONTANHA"],
["🏖️","PRAIA"],
["❄️","NEVE"],
["🌋","VULCÃO"],
["🐊","PÂNTANO"],
["🪨","CAVERNA"],
["🌙","NOITE"],
["🌾","FAZENDA"],
["🌉","PONTE"],
["🏚️","RUÍNAS"],
["🌲","FLORESTA ESCURA"],
["🏙️","CIDADE 2"],
["🏜️","DESERTO 2"],
["🧊","GELO"],
["🏝️","ILHA"],
["⛈️","TEMPESTADE"],
["⛰️","MONTANHA 2"],
["🌃","CIDADE NOTURNA"],
["🌋","VULCÃO 2"],
["🕳️","CAVERNA 2"],
["🌲","FLORESTA 2"],
["🏜️","DESERTO 3"],
["🏖️","PRAIA 2"],
["❄️","NEVE 2"],
["🏚️","RUÍNAS 2"],
["🏢","TORRES"],
["👑","MAPA FINAL"]

];


let unlockedMap=
    parseInt(
        localStorage.getItem("LILO_UNLOCKED_MAP")
    ) || 1;


if(unlockedMap<1)
    unlockedMap=1;

if(unlockedMap>30)
    unlockedMap=30;


let selectedMap=1;


function createMaps(){

    const box=
        document.getElementById("maps");

    box.innerHTML="";


    for(
        let i=0;
        i<30;
        i++
    ){

        const number=i+1;

        const button=
            document.createElement("button");


        const unlocked=
            number<=unlockedMap;


        button.className="map";


        if(
            number===selectedMap &&
            unlocked
        ){

            button.classList.add("selected");

        }


        if(!unlocked){

            button.classList.add("locked");

        }


        button.innerHTML=`

            ${
                !unlocked
                ? '<span class="lock">🔒</span>'
                : ''
            }

            <span class="mapIcon">
                ${mapsData[i][0]}
            </span>

            MAPA ${number}
            <br>
            ${mapsData[i][1]}

        `;


        button.addEventListener(
            "click",
            ()=>{

                if(!unlocked)
                    return;


                selectedMap=number;


                document
                .querySelectorAll(".map")
                .forEach(
                    m=>
                        m.classList.remove(
                            "selected"
                        )
                );


                button.classList.add(
                    "selected"
                );

            }
        );


        box.appendChild(button);

    }

}


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W,H;

function resize(){

    W=
        canvas.width=
        window.innerWidth;

    H=
        canvas.height=
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let player;

let obstacles=[];
let poops=[];

let running=false;
let started=false;

let lives=3;
let poopCount=0;

let level=1;


/*
   VELOCIDADE FIXA.
   NUNCA AUMENTA AO PERDER VIDA.
*/

const SPEED=4.2;

let obstacleTimer=80;
let poopTimer=60;

let hitCooldown=false;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    level=selectedMap;

    lives=3;

    poopCount=0;

    obstacles=[];
    poops=[];

    obstacleTimer=65;
    poopTimer=55;

    hitCooldown=false;


    /*
       ALTURA DO LOBO.
    */

    player={

        x:38,

        y:H-130,

        width:58,

        height:62,

        velocityY:0,

        grounded:true

    };


    updateLives();


    document.getElementById("poop")
        .textContent=0;

    document.getElementById("level")
        .textContent=level;


    updateWolf();

}


/* =====================================================
   LOBO
===================================================== */

function updateWolf(){

    const wolf=
        document.getElementById("wolf");


    wolf.style.left=
        player.x+"px";

    wolf.style.top=
        player.y+"px";


    if(
        running &&
        started
    ){

        wolf.classList.add("running");

    }else{

        wolf.classList.remove("running");

    }

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)
        return;


    if(!player.grounded)
        return;


    /*
       PULO CONTROLADO.

       Antes era -17.
       Agora -13.

       A bostinha nasce em uma altura
       que o lobo consegue alcançar
       sem subir exageradamente.
    */

    player.velocityY=-13;


    player.grounded=false;


    bark();

}


/* =====================================================
   LATIDO
===================================================== */

let audio=null;

function bark(){

    try{

        if(!audio){

            audio=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(audio.state==="suspended")
            audio.resume();


        const now=
            audio.currentTime;


        const osc=
            audio.createOscillator();

        const gain=
            audio.createGain();


        osc.type="square";


        osc.frequency.setValueAtTime(
            430,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            150,
            now+.15
        );


        gain.gain.setValueAtTime(
            .001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .16,
            now+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+.18
        );


        osc.connect(gain);
        gain.connect(audio.destination);


        osc.start(now);
        osc.stop(now+.19);

    }catch(e){}

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function obstacleTypes(){

    if(level===1){

        return[
            "building",
            "spike",
            "barrier"
        ];

    }


    if(level===2){

        return[
            "cactus",
            "rock",
            "spike"
        ];

    }


    return[
        "spike",
        "rock",
        "doubleSpike",
        "barrier"
    ];

}


function spawnObstacle(){

    const list=
        obstacleTypes();


    const type=
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];


    let width=48;
    let height=48;


    if(type==="doubleSpike")
        width=90;


    if(type==="cactus"){

        width=42;
        height=58;

    }


    if(type==="building"){

        width=52;
        height=58;

    }


    obstacles.push({

        x:W+60,

        y:H-65-height,

        width:width,

        height:height,

        type:type

    });

}


/* =====================================================
   BOSTINHA
===================================================== */

function spawnPoop(){

    /*
       ALTURA MAIS BAIXA.

       O objetivo agora é:
       pular normalmente e alcançar.
    */

    const y=
        H-125-
        Math.random()*65;


    const candidate={

        x:W+80,

        y:y,

        width:30,

        height:30

    };


    /*
       NÃO DEIXA BOSTA NASCER
       DENTRO DE OBSTÁCULO.

       Tenta até 30 vezes.
    */

    let valid=false;

    for(
        let attempt=0;
        attempt<30;
        attempt++
    ){

        candidate.x=
            W+70+
            Math.random()*80;

        candidate.y=
            H-120-
            Math.random()*70;


        const insideObstacle=
            obstacles.some(
                o=>
                    candidate.x+15>
                        o.x &&
                    candidate.x-15<
                        o.x+o.width &&
                    candidate.y+15>
                        o.y &&
                    candidate.y-15<
                        o.y+o.height
            );


        if(!insideObstacle){

            valid=true;
            break;

        }

    }


    if(valid){

        poops.push(candidate);

    }

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(

        a.x+8<
            b.x+b.width &&

        a.x+a.width-8>
            b.x &&

        a.y+8<
            b.y+b.height &&

        a.y+a.height-5>
            b.y

    );

}


/* =====================================================
   VIDA
===================================================== */

function updateLives(){

    let hearts="";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts+=
            i<lives
            ? "❤️"
            : "🖤";

    }

    document.getElementById("lives")
        .textContent=hearts;

}


/* =====================================================
   ACERTO
===================================================== */

function hitObstacle(){

    if(hitCooldown)
        return;


    hitCooldown=true;


    lives--;

    updateLives();


    /*
       VELOCIDADE CONTINUA
       EXATAMENTE IGUAL.
    */

    player.velocityY=-5;


    if(lives<=0){

        gameOver();

        return;

    }


    setTimeout(
        ()=>{
            hitCooldown=false;
        },
        850
    );

}


/* =====================================================
   FUNDO - MAPA 1 CIDADE
===================================================== */

function city(){

    let sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(
        0,
        "#438bc0"
    );

    sky.addColorStop(
        1,
        "#d5ecf5"
    );

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);


    /*
       prédios
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        let x=
            i*95-
            (
                performance.now()
                *SPEED/55
            )%95;


        let height=
            120+
            (i%5)*35;


        ctx.fillStyle=
            i%2
            ? "#4b5660"
            : "#303941";


        ctx.fillRect(
            x,
            H-65-height,
            75,
            height
        );


        /*
           janelas
        */

        ctx.fillStyle="#ffd76a";


        for(
            let yy=H-45-height;
            yy<H-85;
            yy+=27
        ){

            ctx.fillRect(
                x+10,
                yy,
                9,
                12
            );

            ctx.fillRect(
                x+31,
                yy,
                9,
                12
            );

            ctx.fillRect(
                x+52,
                yy,
                9,
                12
            );

        }

    }

}


/* =====================================================
   MAPA 2 DESERTO
===================================================== */

function desert(){

    let sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(
        0,
        "#e17b3c"
    );

    sky.addColorStop(
        1,
        "#ffe2a2"
    );

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);


    /*
       montanhas
    */

    ctx.fillStyle="#c57b48";

    ctx.beginPath();

    ctx.moveTo(0,H-100);
    ctx.lineTo(150,H-230);
    ctx.lineTo(300,H-100);
    ctx.lineTo(470,H-220);
    ctx.lineTo(W,H-90);
    ctx.lineTo(W,H);
    ctx.lineTo(0,H);

    ctx.fill();


    /*
       dunas
    */

    ctx.fillStyle="#e1ad62";

    for(
        let i=0;
        i<7;
        i++
    ){

        let x=
            i*190-
            (
                performance.now()
                *SPEED/55
            )%190;


        ctx.beginPath();

        ctx.arc(
            x,
            H-60,
            85,
            Math.PI,
            0
        );

        ctx.fill();

    }

}


/* =====================================================
   FLORESTA
===================================================== */

function forest(){

    let sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(
        0,
        "#67aaca"
    );

    sky.addColorStop(
        1,
        "#b9d99d"
    );

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);


    for(
        let i=0;
        i<10;
        i++
    ){

        let x=
            i*145-
            (
                performance.now()
                *SPEED/48
            )%145;


        ctx.fillStyle="#315b35";

        ctx.fillRect(
            x,
            H-155,
            14,
            90
        );


        ctx.beginPath();

        ctx.arc(
            x+7,
            H-165,
            50,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   OUTROS MAPAS
===================================================== */

function otherMap(){

    let sky=
        ctx.createLinearGradient(
            0,0,0,H
        );


    const colors=[
        ["#718ca0","#d5e0e5"],
        ["#152b3b","#4c6475"],
        ["#9fcae0","#f3e0bd"],
        ["#293d50","#9baab4"],
        ["#405d4a","#c5d4a8"]
    ];


    const c=
        colors[
            (level-4)%colors.length
        ];


    sky.addColorStop(0,c[0]);
    sky.addColorStop(1,c[1]);


    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);


    for(
        let i=0;
        i<9;
        i++
    ){

        let x=
            i*165-
            (
                performance.now()
                *SPEED/50
            )%165;


        ctx.fillStyle=
            "#36464e";


        ctx.fillRect(
            x,
            H-145,
            85,
            80
        );

    }

}


/* =====================================================
   FUNDO PRINCIPAL
===================================================== */

function drawBackground(){

    if(level===1){

        city();

    }else if(level===2){

        desert();

    }else if(level===3){

        forest();

    }else{

        otherMap();

    }


    /*
       chão
    */

    ctx.fillStyle=
        level===2
        ? "#bd8c4b"
        : "#3e4b38";


    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );


    ctx.fillStyle=
        level===2
        ? "#d5a45e"
        : "#29362b";


    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacle(o){

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        const count=
            o.type==="doubleSpike"
            ? 2
            : 1;


        for(
            let i=0;
            i<count;
            i++
        ){

            let x=
                o.x+i*45;


            ctx.fillStyle="#17191c";

            ctx.beginPath();

            ctx.moveTo(
                x,
                o.y+o.height
            );

            ctx.lineTo(
                x+22,
                o.y
            );

            ctx.lineTo(
                x+44,
                o.y+o.height
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    else if(o.type==="cactus"){

        ctx.fillStyle="#2f8139";

        ctx.fillRect(
            o.x+13,
            o.y,
            16,
            o.height
        );

        ctx.fillRect(
            o.x,
            o.y+22,
            14,
            9
        );

        ctx.fillRect(
            o.x,
            o.y+10,
            8,
            25
        );

        ctx.fillRect(
            o.x+28,
            o.y+34,
            14,
            9
        );

        ctx.fillRect(
            o.x+34,
            o.y+22,
            8,
            23
        );

    }


    else if(o.type==="building"){

        ctx.fillStyle="#283139";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );


        ctx.fillStyle="#ffd65e";


        for(
            let yy=o.y+10;
            yy<o.y+o.height-8;
            yy+=20
        ){

            ctx.fillRect(
                o.x+8,
                yy,
                9,
                11
            );

            ctx.fillRect(
                o.x+31,
                yy,
                9,
                11
            );

        }

    }


    else if(o.type==="rock"){

        ctx.fillStyle="#666d72";

        ctx.beginPath();

        ctx.arc(
            o.x+24,
            o.y+25,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    else{

        ctx.fillStyle="#cf5b2e";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            o.x+4,
            o.y+12,
            o.width-8,
            8
        );

    }

}


/* =====================================================
   BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#71401e";


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y+7,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-2,
        10,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-10,
        7,
        Math.PI,
        0
    );

    ctx.fill();


    /*
       pequenos detalhes
    */

    ctx.fillStyle="#3d2414";

    ctx.beginPath();

    ctx.arc(
        p.x-4,
        p.y-2,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   PRÓXIMO MAPA
===================================================== */

function nextMap(){

    if(level>=30){

        running=false;

        alert(
            "🏆 PARABÉNS LINDAO! VOCÊ COMPLETOU OS 30 MAPAS!"
        );

        return;

    }


    level++;

    poopCount=0;

    obstacles=[];
    poops=[];


    /*
       desbloqueia mapa
    */

    if(level>unlockedMap){

        unlockedMap=level;

        localStorage.setItem(
            "LILO_UNLOCKED_MAP",
            unlockedMap
        );

    }


    /*
       desbloqueia personagens
       conforme os mapas.
    */

    unlockedCharacters=
        Math.max(
            unlockedCharacters,
            level
        );


    localStorage.setItem(
        "LILO_CHARACTERS",
        unlockedCharacters
    );


    selectedMap=level;


    document.getElementById("level")
        .textContent=level;

    document.getElementById("poop")
        .textContent=0;


    createMaps();
    createCharacters();

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;


    document.getElementById("finalLevel")
        .textContent=level;


    document.getElementById("finalPoop")
        .textContent=poopCount;


    document.getElementById("gameOver")
        .style.display="flex";


    updateWolf();

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;


    const delta=
        Math.min(
            time-lastTime,
            32
        );


    lastTime=time;


    const dt=
        delta/16.6667;


    if(
        document.getElementById("game")
        .style.display==="block"
    ){

        drawBackground();


        if(
            started &&
            running
        ){

            /* FÍSICA */

            player.velocityY+=
                .58*dt;


            player.y+=
                player.velocityY*dt;


            if(
                player.y>=H-130
            ){

                player.y=H-130;

                player.velocityY=0;

                player.grounded=true;

            }


            updateWolf();


            /* OBSTÁCULOS */

            obstacleTimer-=dt;


            if(
                obstacleTimer<=0
            ){

                spawnObstacle();


                obstacleTimer=
                    85+
                    Math.random()*45;

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=
                    obstacles[i];


                /*
                   VELOCIDADE FIXA.
                */

                o.x-=
                    SPEED*dt;


                drawObstacle(o);


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    hitObstacle();

                }

            }


            obstacles=
                obstacles.filter(
                    o=>o.x>-150
                );


            /* BOSTINHAS */

            poopTimer-=dt;


            if(
                poopTimer<=0
            ){

                spawnPoop();


                poopTimer=
                    75+
                    Math.random()*55;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=
                    poops[i];


                p.x-=
                    SPEED*dt;


                drawPoop(p);


                const box={

                    x:p.x-15,

                    y:p.y-15,

                    width:30,

                    height:30

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );


                    poopCount++;


                    document.getElementById("poop")
                        .textContent=
                        poopCount;


                    if(
                        poopCount>=10
                    ){

                        nextMap();

                    }

                }

            }


            poops=
                poops.filter(
                    p=>p.x>-50
                );

        }

    }


    requestAnimationFrame(loop);

}


/* =====================================================
   BOTÃO JOGAR
===================================================== */

document.getElementById("play")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("menu")
            .style.display="none";

        document.getElementById("game")
            .style.display="block";

        document.getElementById("gameOver")
            .style.display="none";


        resetGame();


        started=false;
        running=false;


        document.getElementById("tapStart")
            .style.display="block";


        updateWolf();

    }
);


/* =====================================================
   TOQUE
===================================================== */

document.getElementById("game")
.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.target.closest &&
            e.target.closest("button")
        )
            return;


        if(!started){

            started=true;
            running=true;


            document.getElementById("tapStart")
                .style.display="none";


            updateWolf();

            return;

        }


        jump();

    }
);


/* =====================================================
   RESTART
===================================================== */

document.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("gameOver")
            .style.display="none";


        resetGame();


        started=false;
        running=false;


        document.getElementById("tapStart")
            .style.display="block";


        updateWolf();

    }
);


/* =====================================================
   VOLTAR AO MENU
===================================================== */

function backToMenu(){

    running=false;
    started=false;


    document.getElementById("game")
        .style.display="none";


    document.getElementById("gameOver")
        .style.display="none";


    document.getElementById("menu")
        .style.display="block";


    createMaps();
    createCharacters();

}


document.getElementById("home")
.addEventListener(
    "click",
    backToMenu
);


document.getElementById("backMenu")
.addEventListener(
    "click",
    backToMenu
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();


            if(
                document.getElementById("game")
                .style.display==="block"
            ){

                if(!started){

                    started=true;
                    running=true;


                    document.getElementById("tapStart")
                        .style.display="none";

                }else{

                    jump();

                }

            }

        }

    }
);


/* LOOP */

requestAnimationFrame(loop);

</script>
