<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,sans-serif;
}

button{
    touch-action:manipulation;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#394149,#080b0f 70%);
    color:white;
}

.loadingTitle{
    font-size:42px;
    font-weight:900;
    text-align:center;
    text-shadow:0 0 15px red;
}

.loadingWolf{
    font-size:90px;
    margin:20px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadingBar{
    width:280px;
    height:12px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;
    background:#e00000;
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    overflow:auto;
    flex-direction:column;
    align-items:center;
    color:white;
    padding:20px;
    background:radial-gradient(circle,#343b43,#080a0e 70%);
}

.menuTitle{
    font-size:40px;
    font-weight:900;
    text-shadow:0 0 15px red;
}

.subtitle{
    color:#bbb;
    margin-top:5px;
    text-align:center;
}

.creator{
    color:#ff3030;
    font-weight:bold;
    margin:10px;
}

.section{
    width:100%;
    max-width:500px;
    margin-top:10px;
    font-weight:bold;
}

.cards{
    width:100%;
    max-width:500px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:8px 0;
}

.card{
    min-width:120px;
    height:100px;
    border-radius:15px;
    border:2px solid #444;
    background:linear-gradient(145deg,#292f35,#0d1014);
    color:white;
    position:relative;
}

.card.selected{
    border-color:red;
    box-shadow:0 0 15px #700;
}

.card.locked{
    opacity:.35;
}

.cardEmoji{
    font-size:38px;
}

.lock{
    position:absolute;
    top:5px;
    right:7px;
}

#play{
    width:280px;
    padding:16px;
    margin-top:15px;
    border:2px solid #ff3030;
    border-radius:12px;
    background:#700000;
    color:white;
    font-size:18px;
    font-weight:bold;
}

/* ================= JOGO ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= LOBO ================= */

#wolf{
    position:absolute;
    left:45px;
    bottom:65px;
    width:62px;
    height:70px;
    z-index:15;
    pointer-events:none;
}

.wBody{
    position:absolute;
    left:8px;
    top:29px;
    width:43px;
    height:28px;
    border-radius:50%;
    background:linear-gradient(145deg,#858b8f,#363c41);
}

.wHead{
    position:absolute;
    left:32px;
    top:10px;
    width:32px;
    height:36px;
    border-radius:50%;
    background:linear-gradient(145deg,#92989c,#41474c);
}

.wEar{
    position:absolute;
    width:15px;
    height:25px;
    background:#292e32;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.wEar.a{
    left:32px;
    top:0;
}

.wEar.b{
    left:49px;
    top:1px;
}

.wEye{
    position:absolute;
    top:21px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:red;
    box-shadow:0 0 8px red;
}

.wEye.a{
    left:40px;
}

.wEye.b{
    left:53px;
}

.wMuzzle{
    position:absolute;
    left:52px;
    top:29px;
    width:18px;
    height:11px;
    border-radius:50%;
    background:#555b5f;
}

.wNose{
    position:absolute;
    left:65px;
    top:31px;
    width:6px;
    height:5px;
    border-radius:50%;
    background:#000;
}

.wTail{
    position:absolute;
    left:3px;
    top:25px;
    width:22px;
    height:13px;
    border-top:7px solid #252a2e;
    border-radius:50%;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:50px;
    width:7px;
    height:20px;
    border-radius:8px;
    background:#171a1d;
}

.l1{left:12px}
.l2{left:23px}
.l3{left:37px}
.l4{left:48px}

#wolf.running .l1,
#wolf.running .l3{
    animation:leg1 .2s infinite alternate;
}

#wolf.running .l2,
#wolf.running .l4{
    animation:leg2 .2s infinite alternate;
}

@keyframes leg1{
    from{transform:rotate(18deg)}
    to{transform:rotate(-18deg)}
}

@keyframes leg2{
    from{transform:rotate(-18deg)}
    to{transform:rotate(18deg)}
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    z-index:30;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#poop{
    color:#d99a62;
}

#home{
    position:absolute;
    z-index:35;
    right:10px;
    top:48px;
    padding:8px 10px;
    border:1px solid white;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    color:white;
}

#tapStart{
    position:absolute;
    z-index:40;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-align:center;
    text-shadow:2px 2px 8px black;
    pointer-events:none;
}

#tapStart small{
    display:block;
    font-size:14px;
    margin-top:8px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.88);
    color:white;
    text-align:center;
}

#gameOver h2{
    color:red;
    font-size:45px;
    margin-bottom:12px;
}

.overButton{
    margin-top:15px;
    padding:14px 25px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#790000;
}

.menuButton{
    background:#333;
}
</style>
</head>

<body>

<!-- ================= LOADING ================= -->

<div id="loading">
    <div class="loadingTitle">LILO O CAGÃO</div>
    <div class="loadingWolf">🐺</div>
    <div class="loadingText">CARREGANDO</div>
    <div id="percent">0%</div>

    <div class="loadingBar">
        <div id="barFill"></div>
    </div>
</div>


<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menuTitle">LILO O CAGÃO</div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="section">🐺 PERSONAGENS</div>

    <div class="cards">

        <button class="card selected">
            <div class="cardEmoji">🐺</div>
            <div>LILO</div>
        </button>

        <button class="card locked">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🐕</div>
            <div>CACHORRO</div>
        </button>

        <button class="card locked">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🦊</div>
            <div>RAPOSA</div>
        </button>

    </div>


    <div class="section">🗺️ MAPAS</div>

    <div class="cards">

        <button class="card selected mapCard" data-map="1">
            <div class="cardEmoji">🌲</div>
            <div>MAPA 1<br>FLORESTA</div>
        </button>

        <button class="card locked mapCard" data-map="2">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🏜️</div>
            <div>MAPA 2<br>DESERTO</div>
        </button>

        <button class="card locked mapCard" data-map="3">
            <span class="lock">🔒</span>
            <div class="cardEmoji">🌋</div>
            <div>MAPA 3<br>VULCÃO</div>
        </button>

    </div>

    <button id="play">
        ▶ TOCAR PARA JOGAR
    </button>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- LOBO -->

    <div id="wolf">

        <div class="wTail"></div>
        <div class="wBody"></div>
        <div class="wHead"></div>

        <div class="wEar a"></div>
        <div class="wEar b"></div>

        <div class="wEye a"></div>
        <div class="wEye b"></div>

        <div class="wMuzzle"></div>
        <div class="wNose"></div>

        <div class="leg l1"></div>
        <div class="leg l2"></div>
        <div class="leg l3"></div>
        <div class="leg l4"></div>

    </div>


    <div id="hud">

        <div id="lives">❤️❤️❤️</div>

        <div>
            💩 <span id="poop">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>

    </div>


    <button id="home">🏠 INÍCIO</button>


    <div id="tapStart">
        TOQUE PARA COMEÇAR
        <small>Toque novamente para pular</small>
    </div>


    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            Mapa:
            <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:8px">
            💩 <span id="finalPoop">0</span>/10
        </div>

        <button class="overButton restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="overButton menuButton" id="backMenu">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>


<script>

/* =====================================================
   LOADING
===================================================== */

let load=0;

function loading(){

    load++;

    document.getElementById("percent")
        .textContent=load+"%";

    document.getElementById("barFill")
        .style.width=load+"%";

    if(load<100){

        setTimeout(loading,25);

    }else{

        setTimeout(()=>{

            document.getElementById("loading")
                .style.display="none";

            document.getElementById("menu")
                .style.display="flex";

            updateMaps();

        },300);

    }
}

loading();


/* =====================================================
   MAPAS DESBLOQUEADOS
===================================================== */

let unlockedMap=
    Number(localStorage.getItem("liloUnlockedMap")||1);

let selectedMap=1;

function updateMaps(){

    document.querySelectorAll(".mapCard")
    .forEach(card=>{

        let map=
            Number(card.dataset.map);

        if(map<=unlockedMap){

            card.classList.remove("locked");

            let lock=
                card.querySelector(".lock");

            if(lock)
                lock.remove();

        }

    });

}

document.querySelectorAll(".mapCard")
.forEach(card=>{

    card.addEventListener("click",()=>{

        let map=
            Number(card.dataset.map);

        if(map>unlockedMap)
            return;

        selectedMap=map;

        document.querySelectorAll(".mapCard")
        .forEach(c=>{
            c.classList.remove("selected");
        });

        card.classList.add("selected");

    });

});


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=
        canvas.width=
        window.innerWidth;

    H=
        canvas.height=
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let player;

let obstacles=[];
let poops=[];

let started=false;
let running=false;

let lives=3;
let poopCount=0;
let level=1;

let speed=4.5;

let obstacleTimer=0;
let poopTimer=0;

let hitCooldown=false;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    level=selectedMap;

    lives=3;

    poopCount=0;

    /*
       VELOCIDADE FIXA POR MAPA.
       PERDER VIDA NÃO ALTERA.
    */

    if(level===1)
        speed=4.5;

    if(level===2)
        speed=5;

    if(level===3)
        speed=5.5;


    player={

        x:45,

        y:H-125,

        width:58,

        height:60,

        velocityY:0,

        grounded:true

    };


    obstacles=[];
    poops=[];

    obstacleTimer=80;
    poopTimer=55;

    hitCooldown=false;

    document.getElementById("poop")
        .textContent="0";

    document.getElementById("level")
        .textContent=level;

    updateLives();

    positionWolf();

}


/* =====================================================
   POSIÇÃO DO LOBO
===================================================== */

function positionWolf(){

    const wolf=
        document.getElementById("wolf");

    wolf.style.left="45px";
    wolf.style.bottom="65px";

    if(started && running)
        wolf.classList.add("running");
    else
        wolf.classList.remove("running");

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives(){

    let text="";

    for(let i=0;i<3;i++){

        text+=
            i<lives
            ? "❤️"
            : "🖤";

    }

    document.getElementById("lives")
        .textContent=text;

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)
        return;

    if(!player.grounded)
        return;

    player.velocityY=-13;

    player.grounded=false;

    bark();

}


/* =====================================================
   LATIDO
===================================================== */

let audioContext=null;

function bark(){

    try{

        if(!audioContext){

            audioContext=
                new (
                    window.AudioContext||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state==="suspended")
            audioContext.resume();

        let now=
            audioContext.currentTime;

        let osc=
            audioContext.createOscillator();

        let gain=
            audioContext.createGain();

        osc.type="square";

        osc.frequency.setValueAtTime(
            300,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            120,
            now+.13
        );

        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .18,
            now+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+.14
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now+.15);

    }catch(e){}

}


/* =====================================================
   TOQUE NO JOGO
===================================================== */

function gameTouch(event){

    if(
        event.target.closest &&
        event.target.closest("button")
    ){
        return;
    }


    if(!started){

        started=true;
        running=true;

        document.getElementById("tapStart")
            .style.display="none";

        positionWolf();

        /*
           Primeiro toque começa.
           O segundo toque pula.
        */

        return;

    }


    jump();

}


/* =====================================================
   CRIAR OBSTÁCULO
===================================================== */

function spawnObstacle(){

    let types;

    if(level===1){

        types=[
            "spike",
            "rock",
            "box",
            "doubleSpike"
        ];

    }else if(level===2){

        types=[
            "cactus",
            "rock",
            "cactus"
        ];

    }else{

        types=[
            "lava",
            "spike",
            "rock"
        ];

    }


    let type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];


    let width=48;
    let height=48;


    if(type==="doubleSpike"){
        width=90;
    }

    if(type==="cactus"){
        width=40;
        height=62;
    }

    if(type==="lava"){
        width=58;
        height=48;
    }


    obstacles.push({

        x:W+30,

        y:H-65-height,

        width:width,

        height:height,

        type:type

    });

}


/* =====================================================
   CRIAR BOSTINHA
===================================================== */

function spawnPoop(){

    poops.push({

        x:W+30,

        y:H-150-
            Math.random()*120,

        size:15

    });

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(

        a.x+10 < b.x+b.width &&
        a.x+a.width-10 > b.x &&
        a.y+8 < b.y+b.height &&
        a.y+a.height-5 > b.y

    );

}


/* =====================================================
   BATEU NO OBSTÁCULO
===================================================== */

function hitObstacle(){

    if(hitCooldown)
        return;

    hitCooldown=true;

    lives--;

    updateLives();


    /*
       NÃO aumenta speed.
       NÃO remove o obstáculo.
    */

    player.velocityY=-6;


    if(lives<=0){

        gameOver();

        return;

    }


    /*
       Pequeno tempo de proteção.
    */

    setTimeout(()=>{

        hitCooldown=false;

    },900);

}


/* =====================================================
   FUNDO
===================================================== */

function drawBackground(){

    let g=
        ctx.createLinearGradient(
            0,0,0,H
        );


    if(level===1){

        g.addColorStop(0,"#4db7e8");
        g.addColorStop(1,"#d9f5ff");

    }

    if(level===2){

        g.addColorStop(0,"#e08c45");
        g.addColorStop(1,"#ffe0a0");

    }

    if(level===3){

        g.addColorStop(0,"#35151a");
        g.addColorStop(1,"#d85b3c");

    }


    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle=
        level===3
        ? "#ff4c30"
        : "#ffe98a";

    ctx.beginPath();

    ctx.arc(
        W-80,
        75,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ÁRVORES */

    if(level===1){

        for(let i=0;i<8;i++){

            let x=
                i*180-
                (
                    performance.now()
                    *speed/60
                )%180;

            ctx.fillStyle="#31552f";

            ctx.fillRect(
                x,
                H-130,
                10,
                65
            );

            ctx.beginPath();

            ctx.arc(
                x+5,
                H-140,
                40,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* DESERTO */

    if(level===2){

        for(let i=0;i<8;i++){

            let x=
                i*180-
                (
                    performance.now()
                    *speed/60
                )%180;

            ctx.fillStyle="#36733a";

            ctx.fillRect(
                x,
                H-120,
                9,
                55
            );

            ctx.fillRect(
                x-12,
                H-105,
                12,
                8
            );

            ctx.fillRect(
                x-12,
                H-122,
                8,
                25
            );

            ctx.fillRect(
                x+9,
                H-95,
                13,
                8
            );

        }

    }


    /* VULCÃO */

    if(level===3){

        for(let i=0;i<5;i++){

            let x=i*250;

            ctx.fillStyle="#401e20";

            ctx.beginPath();

            ctx.moveTo(
                x,
                H-65
            );

            ctx.lineTo(
                x+110,
                H-200
            );

            ctx.lineTo(
                x+220,
                H-65
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* CHÃO */

    ctx.fillStyle=
        level===1
        ? "#486e38"
        : level===2
        ? "#c49750"
        : "#302225";

    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );

    ctx.fillStyle=
        level===3
        ? "#ff4c32"
        : level===2
        ? "#e4b86b"
        : "#304a2a";

    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   DESENHAR OBSTÁCULO
===================================================== */

function drawObstacle(o){

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        let amount=
            o.type==="doubleSpike"
            ? 2
            : 1;

        for(let i=0;i<amount;i++){

            let x=o.x+i*45;

            ctx.fillStyle="#17191c";

            ctx.beginPath();

            ctx.moveTo(
                x,
                o.y+o.height
            );

            ctx.lineTo(
                x+22,
                o.y
            );

            ctx.lineTo(
                x+44,
                o.y+o.height
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    else if(o.type==="cactus"){

        ctx.fillStyle="#34763a";

        ctx.fillRect(
            o.x+13,
            o.y,
            16,
            o.height
        );

        ctx.fillRect(
            o.x,
            o.y+22,
            16,
            8
        );

        ctx.fillRect(
            o.x,
            o.y+10,
            8,
            20
        );

        ctx.fillRect(
            o.x+26,
            o.y+34,
            15,
            8
        );

        ctx.fillRect(
            o.x+33,
            o.y+22,
            8,
            20
        );

    }


    else if(o.type==="rock"){

        ctx.fillStyle="#60676b";

        ctx.beginPath();

        ctx.arc(
            o.x+24,
            o.y+25,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    else if(o.type==="box"){

        ctx.fillStyle="#633d25";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        ctx.strokeStyle="#28150c";

        ctx.lineWidth=3;

        ctx.strokeRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

    }


    else if(o.type==="lava"){

        ctx.fillStyle="#ff3e20";

        ctx.beginPath();

        ctx.ellipse(
            o.x+29,
            o.y+28,
            29,
            23,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   DESENHAR BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#75421f";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y+7,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-2,
        10,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-10,
        7,
        Math.PI,
        0
    );

    ctx.fill();

}


/* =====================================================
   PASSAR DE MAPA
===================================================== */

function checkLevel(){

    if(poopCount<10)
        return;


    if(level<3){

        level++;

        poopCount=0;

        obstacles=[];
        poops=[];


        /*
           Velocidade só aumenta quando
           muda de mapa.
        */

        if(level===2)
            speed=5;

        if(level===3)
            speed=5.5;


        if(level>unlockedMap){

            unlockedMap=level;

            localStorage.setItem(
                "liloUnlockedMap",
                unlockedMap
            );

        }


        document.getElementById("level")
            .textContent=level;

        document.getElementById("poop")
            .textContent=0;

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;

    document.getElementById("wolf")
        .classList.remove("running");

    document.getElementById("finalLevel")
        .textContent=level;

    document.getElementById("finalPoop")
        .textContent=poopCount;

    document.getElementById("gameOver")
        .style.display="flex";

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;

    let delta=
        Math.min(
            time-lastTime,
            32
        );

    lastTime=time;

    let dt=
        delta/16.6667;


    if(
        document.getElementById("game")
        .style.display!=="none"
    ){

        drawBackground();


        if(started && running){

            /* FÍSICA DO LOBO */

            player.velocityY +=
                .65*dt;

            player.y +=
                player.velocityY*dt;


            if(
                player.y>=H-125
            ){

                player.y=H-125;

                player.velocityY=0;

                player.grounded=true;

            }


            /* OBSTÁCULOS */

            obstacleTimer-=dt;


            if(obstacleTimer<=0){

                spawnObstacle();

                /*
                   Espaçamento confortável.
                */

                obstacleTimer=
                    95+
                    Math.random()*45;

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                let o=obstacles[i];


                /*
                   A VELOCIDADE É SEMPRE A MESMA.
                */

                o.x -=
                    speed*dt;


                drawObstacle(o);


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    hitObstacle();

                    /*
                       NÃO remove o obstáculo.
                    */

                }

            }


            obstacles=
                obstacles.filter(
                    o=>o.x>-150
                );


            /* BOSTINHAS */

            poopTimer-=dt;


            if(poopTimer<=0){

                spawnPoop();

                poopTimer=
                    75+
                    Math.random()*60;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                let p=poops[i];

                p.x -=
                    speed*dt;


                drawPoop(p);


                let box={

                    x:p.x-15,

                    y:p.y-15,

                    width:30,

                    height:30

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );

                    poopCount++;


                    document.getElementById("poop")
                        .textContent=poopCount;


                    checkLevel();

                }

            }


            poops=
                poops.filter(
                    p=>p.x>-50
                );


            positionWolf();

        }

    }


    requestAnimationFrame(loop);

}


/* =====================================================
   INICIAR
===================================================== */

document.getElementById("play")
.addEventListener(
    "click",
    startGame
);


function startGame(){

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    document.getElementById("gameOver")
        .style.display="none";

    resetGame();

    started=false;
    running=false;

    document.getElementById("tapStart")
        .style.display="block";

    positionWolf();

}


/* =====================================================
   TOQUE
===================================================== */

document.getElementById("game")
.addEventListener(
    "pointerdown",
    gameTouch
);


/* =====================================================
   REINICIAR
===================================================== */

document.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tapStart")
            .style.display="block";

        positionWolf();

    }
);


/* =====================================================
   MENU
===================================================== */

function goMenu(){

    running=false;
    started=false;

    document.getElementById("game")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="none";

    document.getElementById("menu")
        .style.display="flex";

    updateMaps();

}

document.getElementById("home")
.addEventListener(
    "click",
    goMenu
);

document.getElementById("backMenu")
.addEventListener(
    "click",
    goMenu
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();

            if(
                document.getElementById("game")
                .style.display==="block"
            ){

                if(!started){

                    started=true;
                    running=true;

                    document.getElementById("tapStart")
                        .style.display="none";

                }else{

                    jump();

                }

            }

        }

    }
);


/* =====================================================
   LOOP
===================================================== */

requestAnimationFrame(loop);

</script>
