<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050505;
}

button{
    border:0;
    font-family:Arial,sans-serif;
    touch-action:manipulation;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
    radial-gradient(circle at center,#424b54 0%,#11151a 45%,#020304 100%);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:0 0 10px red,0 0 30px #800000;
}

.loadWolf{
    font-size:90px;
    margin:18px 0;
}

.loadText{
    color:#aaa;
    letter-spacing:4px;
    font-size:13px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadBar{
    width:280px;
    height:13px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#fill{
    width:0%;
    height:100%;
    background:#e00000;
    box-shadow:0 0 15px red;
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    overflow-y:auto;
    color:white;
    text-align:center;
    padding:25px 12px 40px;
    background:
    radial-gradient(circle at 50% 18%,
    #59636d 0%,
    #20272e 35%,
    #090c10 72%,
    #020304 100%);
}

.title{
    font-size:45px;
    font-weight:900;
    letter-spacing:4px;
    margin-top:5px;
    text-shadow:
    0 0 8px #ff0000,
    0 0 22px #b00000,
    0 0 45px #650000;
}

.sub{
    color:#d0d0d0;
    font-size:12px;
    letter-spacing:3px;
    margin-top:7px;
}

.userBox{
    margin:14px auto;
    max-width:330px;
}

#username{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:2px solid #555;
    outline:none;
    text-align:center;
    font-size:16px;
    background:#111;
    color:white;
}

#saveUser{
    width:100%;
    margin-top:7px;
    padding:12px;
    border-radius:10px;
    background:#333;
    color:white;
    font-weight:bold;
}

.creator{
    display:inline-block;
    margin:8px auto 17px;
    padding:8px 18px;
    border:1px solid rgba(255,60,60,.65);
    border-radius:20px;
    font-size:15px;
    font-weight:900;
    color:#fff;
    background:linear-gradient(
        180deg,
        rgba(150,0,0,.45),
        rgba(40,0,0,.45)
    );
    box-shadow:0 0 15px rgba(255,0,0,.2);
}

.sectionTitle{
    margin:12px 0 9px;
    font-size:17px;
    font-weight:bold;
}

#characters{
    display:flex;
    gap:10px;
    overflow-x:auto;
    max-width:700px;
    margin:auto;
    padding:4px 3px 13px;
    scrollbar-width:none;
}

#characters::-webkit-scrollbar{
    display:none;
}

.char{
    flex:0 0 105px;
    height:130px;
    border:2px solid #454c53;
    border-radius:15px;
    color:white;
    background:linear-gradient(145deg,#3b434a,#0b0e11);
    position:relative;
}

.char.selected{
    border-color:#ff2222;
    box-shadow:0 0 10px rgba(255,0,0,.55);
}

.char.locked{
    opacity:.35;
}

.charIcon{
    display:block;
    font-size:48px;
    margin:7px 0;
}

.charName{
    font-size:11px;
    font-weight:bold;
}

.charLock{
    position:absolute;
    right:5px;
    top:4px;
}

#maps{
    width:100%;
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.map{
    min-height:78px;
    border:2px solid #41474c;
    border-radius:12px;
    color:white;
    background:linear-gradient(145deg,#30373d,#090c0f);
    position:relative;
}

.map.selected{
    border-color:#ff2222;
    box-shadow:0 0 12px rgba(255,0,0,.5);
}

.map.locked{
    opacity:.28;
}

.mapIcon{
    display:block;
    font-size:25px;
    margin:4px;
}

.mapName{
    font-size:10px;
    font-weight:bold;
}

.mapLock{
    position:absolute;
    top:4px;
    right:5px;
}

#play{
    margin-top:18px;
    width:285px;
    padding:16px;
    border-radius:13px;
    color:white;
    background:linear-gradient(180deg,#b40000,#650000);
    border:2px solid #ff4545;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= ANIMAL ================= */

#wolf{
    position:absolute;
    width:82px;
    height:82px;
    z-index:20;
    pointer-events:none;
}

.animalBody{
    position:absolute;
    left:7px;
    top:36px;
    width:52px;
    height:30px;
    border-radius:60%;
}

.animalHead{
    position:absolute;
    left:38px;
    top:8px;
    width:39px;
    height:41px;
    border-radius:50%;
}

.animalEar{
    position:absolute;
    width:19px;
    height:28px;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.animalEar.one{
    left:39px;
    top:0;
}

.animalEar.two{
    left:59px;
    top:1px;
}

.animalEye{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ff1717;
    box-shadow:0 0 8px red;
}

.animalEye.one{
    left:51px;
    top:23px;
}

.animalEye.two{
    left:68px;
    top:23px;
}

.animalMuzzle{
    position:absolute;
    left:57px;
    top:32px;
    width:23px;
    height:14px;
    border-radius:50%;
}

.animalNose{
    position:absolute;
    left:73px;
    top:35px;
    width:7px;
    height:6px;
    border-radius:50%;
    background:#050505;
}

.animalTail{
    position:absolute;
    left:0;
    top:25px;
    width:30px;
    height:23px;
    border-top:8px solid;
    border-radius:50%;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:59px;
    width:8px;
    height:21px;
    border-radius:8px;
}

.leg1{left:9px}
.leg2{left:22px}
.leg3{left:38px}
.leg4{left:52px}

#wolf.running .leg1,
#wolf.running .leg3{
    animation:run1 .15s infinite alternate;
}

#wolf.running .leg2,
#wolf.running .leg4{
    animation:run2 .15s infinite alternate;
}

@keyframes run1{
    from{transform:rotate(22deg)}
    to{transform:rotate(-22deg)}
}

@keyframes run2{
    from{transform:rotate(-22deg)}
    to{transform:rotate(22deg)}
}

#wolf.dragao .animalHead{

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
}

#poopCount{
    color:#d49a61;
}

#home{
    position:absolute;
    top:43px;
    right:10px;
    z-index:60;
    padding:8px 11px;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    color:white;
    border:1px solid white;
}

#tap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:40;
    color:white;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    text-shadow:2px 2px 7px black;
    pointer-events:none;
}

#tap small{
    display:block;
    margin-top:8px;
    font-size:14px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(0,0,0,.9);
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
    margin-bottom:10px;
    text-shadow:0 0 15px red;
}

.overBtn{
    margin-top:13px;
    padding:14px 28px;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.restart{background:#7c0000}
.back{background:#333}
</style>
</head>

<body>

<div id="loading">
    <div class="logo">LILO O CAGÃO</div>
    <div class="loadWolf">🐺</div>
    <div class="loadText">CARREGANDO</div>
    <div id="percent">0%</div>
    <div class="loadBar">
        <div id="fill"></div>
    </div>
</div>

<div id="menu">

    <div class="title">LILO O CAGÃO</div>

    <div class="sub">
        CORRA • PULE • PEGUE 💩
    </div>

    <div class="userBox">
        <input
            id="username"
            maxlength="15"
            placeholder="Digite seu nome"

        >
        <button id="saveUser">

    <div class="sectionTitle">

    </div>

    <div id="maps"></div>

    </button>

<canvas id="canvas"></canvas>

    <div class="animalTail"></div>
    <div class="animalBody"></div>
    <div class="animalHead"></div>

    <div class="animalEar one"></div>
    <div class="animalEar two"></div>

    <div class="animalEye two"></div>

        <span id="finalPoop">0</span>/10
    </div>

        🔄 JOGAR NOVAMENTE
    </button>

        🏠 VOLTAR AO INÍCIO
    </button>

</div>

</div>

<script>

/* =====================================================
   USUÁRIO
===================================================== */

let currentUser =
    localStorage.getItem("liloCurrentUser") || "";

function userKey(){
    return "liloUser_" +
        (currentUser || "convidado")
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"_");
}

function loadUser(){

    if(!currentUser)
        return;

    const data=
        JSON.parse(
            localStorage.getItem(userKey()) || "{}"
        );

    unlockedMap=
        data.unlockedMap || 1;

    unlockedCharacters=
        data.unlockedCharacters || 1;

}

function saveUser(){

    const input=
        document.getElementById("username");

    let name=
        input.value.trim();

    if(!name)
        name="Jogador";

    currentUser=name;

    localStorage.setItem(
        "liloCurrentUser",
        currentUser
    );

    loadUser();

    buildCharacters();
    buildMaps();

    alert(
        "👤 Usuário salvo: "+currentUser
    );

}

document.getElementById("saveUser")
.addEventListener(
    "click",
    saveUser
);

document.getElementById("username").value=
    currentUser;


/* =====================================================
   CARREGAMENTO
===================================================== */

let loadingValue=0;

function loading(){

    loadingValue++;

    document.getElementById("percent")
        .textContent=loadingValue+"%";

    document.getElementById("fill")
        .style.width=loadingValue+"%";

    if(loadingValue<100){

        setTimeout(loading,12);

    }else{

        setTimeout(()=>{

            document.getElementById("loading")
                .style.display="none";

            document.getElementById("menu")
                .style.display="block";

            loadUser();

            buildCharacters();
            buildMaps();

        },250);

    }

}

loading();


/* =====================================================
   PERSONAGENS
===================================================== */

const characters=[

    {
        icon:"🐺",
        name:"LOBO",
        unlock:1,
        css:"lobo"
    },

    {
        icon:"🐕",
        name:"CACHORRO",
        unlock:5,
        css:"cachorro"
    },

    {
        icon:"🐱",
        name:"GATO",
        unlock:10,
        css:"gato"
    },

    {
        icon:"🐯",
        name:"TIGRE",
        unlock:15,
        css:"tigre"
    },

    {
        icon:"🦁",
        name:"LEÃO",
        unlock:20,
        css:"leao"
    },

    {
        icon:"🐻",
        name:"URSO",
        unlock:25,
        css:"urso"
    },

    {
        icon:"🐲",
        name:"DRAGÃO",
        unlock:30,
        css:"dragao"
    }

];

let unlockedMap=1;
let selectedMap=1;
let selectedCharacter=0;
let unlockedCharacters=1;


/* =====================================================
   SALVAR PROGRESSO
===================================================== */

function saveProgress(){

    if(!currentUser)
        return;

    const data={

        unlockedMap:
            unlockedMap,

        unlockedCharacters:
            unlockedCharacters

    };

    localStorage.setItem(
        userKey(),
        JSON.stringify(data)
    );

}


/* =====================================================
   PERSONAGENS MENU
===================================================== */

function buildCharacters(){

    const box=
        document.getElementById("characters");

    box.innerHTML="";

    characters.forEach((c,index)=>{

        const unlocked=
            index===0 ||
            unlockedCharacters>=c.unlock;

        const btn=
            document.createElement("button");

        btn.className="char";

        if(index===selectedCharacter && unlocked)
            btn.classList.add("selected");

        if(!unlocked)
            btn.classList.add("locked");

        btn.innerHTML=`

            ${
                !unlocked
                ? '<span class="charLock">🔒</span>'
                : ''
            }

            <span class="charIcon">
                ${c.icon}
            </span>

            <span class="charName">
                ${c.name}
            </span>

            <br>

            ${
                unlocked
                ? "DESBLOQUEADO"
                : "MAPA "+c.unlock
            }

        `;

        btn.onclick=()=>{

            if(!unlocked)
                return;

            selectedCharacter=index;

            document
                .querySelectorAll(".char")
                .forEach(x=>
                    x.classList.remove("selected")
                );

            btn.classList.add("selected");

        };

        box.appendChild(btn);

    });

}


/* =====================================================
   MAPAS
===================================================== */

const mapNames=[

    ["🏙️","CIDADE"],
    ["🏜️","DESERTO"],
    ["🌲","FLORESTA"],
    ["⛰️","MONTANHA"],
    ["🏖️","PRAIA"],
    ["❄️","INVERNO"],
    ["🌋","VULCÃO"],
    ["🐊","PÂNTANO"],
    ["🪨","CAVERNA"],
    ["🌙","NOITE"],
    ["🌾","FAZENDA"],
    ["🌉","PONTE"],
    ["🏚️","RUÍNAS"],
    ["🌳","FLORESTA ESCURA"],
    ["🌆","CIDADE NOTURNA"],
    ["🏜️","DESERTO VERMELHO"],
    ["🧊","GELEIRA"],
    ["🏝️","ILHA"],
    ["⛈️","TEMPESTADE"],
    ["🏔️","MONTANHA GELADA"],
    ["🌃","METRÓPOLE"],
    ["🌋","VULCÃO ESCURO"],
    ["🕳️","CAVERNA DE GELO"],
    ["🌲","FLORESTA NEVADA"],
    ["🏜️","DESERTO DOURADO"],
    ["🏖️","PRAIA TROPICAL"],
    ["❄️","CIDADE CONGELADA"],
    ["🏚️","CASTELO EM RUÍNAS"],
    ["🏢","TORRES"],
    ["👑","MAPA FINAL"]

];

function buildMaps(){

    const box=
        document.getElementById("maps");

    box.innerHTML="";

    mapNames.forEach((m,index)=>{

        const number=index+1;

        const unlocked=
            number<=unlockedMap;

        const btn=
            document.createElement("button");

        btn.className="map";

        if(number===selectedMap && unlocked)
            btn.classList.add("selected");

        if(!unlocked)
            btn.classList.add("locked");

        btn.innerHTML=`

            ${
                !unlocked
                ? '<span class="mapLock">🔒</span>'
                : ''
            }

            <span class="mapIcon">${m[0]}</span>

            <span class="mapName">
                MAPA ${number}<br>${m[1]}
            </span>

        `;

        btn.onclick=()=>{

            if(!unlocked)
                return;

            selectedMap=number;

            document
                .querySelectorAll(".map")
                .forEach(x=>
                    x.classList.remove("selected")
                );

            btn.classList.add("selected");

        };

        box.appendChild(btn);

    });

}


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=
        canvas.width=
        window.innerWidth;

    H=
        canvas.height=
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    ()=>{
        resize();

        if(player){
            player.y=Math.min(
                player.y,
                H-130
            );
        }
    }
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let player;

let obstacles=[];
let poops=[];

let started=false;
let running=false;

let lives=3;
let poop=0;
let level=1;

let obstacleTimer=100;
let poopTimer=70;

let invincible=false;

const GAME_SPEED=3.6;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    lives=3;
    poop=0;

    level=selectedMap;

    obstacles=[];
    poops=[];

    obstacleTimer=110;
    poopTimer=70;

    invincible=false;

    player={

        x:35,

/* =====================================================
   SOM
===================================================== */

let audioContext=null;

function bark(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state==="suspended")
            audioContext.resume();

        const now=
            audioContext.currentTime;

        const osc=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        osc.type="square";

        osc.frequency.setValueAtTime(430,now);

        osc.frequency.exponentialRampToValueAtTime(
            170,
            now+.13
        );

        gain.gain.setValueAtTime(.001,now);

        gain.gain.exponentialRampToValueAtTime(
            .1,
            now+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+.17
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now+.18);

    }catch(e){}

}


/* =====================================================
   MÚSICA GAME OVER
===================================================== */

let sadMusicTimer=null;

function startSadMusic(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state==="suspended")
            audioContext.resume();

        stopSadMusic();

        const notes=[
            392,349,330,294,262,220,196
        ];

        let index=0;

        function playNote(){

            if(
                document.getElementById("gameOver")
                .style.display!=="flex"
            )
                return;

            const now=
                audioContext.currentTime;

            const osc=
                audioContext.createOscillator();

            const gain=
                audioContext.createGain();

            osc.type="sine";

            osc.frequency.value=
                notes[index];

            gain.gain.setValueAtTime(.001,now);

            gain.gain.linearRampToValueAtTime(
                .08,
                now+.15
            );

            gain.gain.linearRampToValueAtTime(
                .001,
                now+.75
            );

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.start(now);
            osc.stop(now+.8);

            index=
                (index+1)%notes.length;

            sadMusicTimer=
                setTimeout(playNote,760);

        }

        playNote();

    }catch(e){}

}

function stopSadMusic(){

    if(sadMusicTimer){

        clearTimeout(sadMusicTimer);

        sadMusicTimer=null;

    }

}

/* =====================================================

===================================================== */

function spawnObstacle(){

    const types=
        getObstacleTypes();

    const type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

    let width=45;
    let height=40;

    if(type==="snowman"){
        width=46;
        height=55;
    }

    if(type==="cactus"){
        width=38;
        height=52;
    }

    if(
        type==="darktree" ||
        type==="snowtree"
    ){
        width=45;
        height=60;
    }

    if(type==="water"){
        width=70;
        height=28;
    }

    obstacles.push({

        x:W+70,

        y:H-65-height,

        width,
        height,

        type

    });

/* =====================================================
   POOP
===================================================== */

function spawnPoop(){

    let p=null;

    for(let attempt=0;attempt<50;attempt++){

        const candidate={

            x:W+100+
                Math.random()*120,

            y:H-110-
                Math.random()*50,

            width:28,
            height:28

        };

        const blocked=
            obstacles.some(o=>

                candidate.x+14>o.x-5 &&
                candidate.x-14<o.x+o.width+5 &&
                candidate.y+14>o.y-5 &&
                candidate.y-14<o.y+o.height+5

            );

        if(!blocked){

            p=candidate;
            break;

        }

    }

    if(p)
        poops.push(p);

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    const playerBox={

        x:a.x+17,
        y:a.y+18,

        width:a.width-27,
        height:a.height-20

    };

    const obstacleBox={

        x:b.x+5,
        y:b.y+5,

        width:Math.max(1,b.width-10),

        height:Math.max(1,b.height-5)

    };

    return(

        playerBox.x<
        obstacleBox.x+
        obstacleBox.width &&

        playerBox.x+
        playerBox.width>
        obstacleBox.x &&

        playerBox.y<
        obstacleBox.y+
        obstacleBox.height &&

        playerBox.y+
        playerBox.height>
        obstacleBox.y

    );

}

/* =====================================================
   DESENHAR OBSTÁCULOS
===================================================== */

function drawObstacle(o){

    const x=o.x;
    const y=o.y;
    const w=o.width;
    const h=o.height;

    if(o.type==="car"){

        ctx.fillStyle="#bd2525";

        ctx.fillRect(
            x,y+15,w,h-15
        );

        ctx.fillStyle="#65a4c5";

        ctx.fillRect(
            x+10,y+5,w-20,18
        );

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            x+10,y+h,8,0,Math.PI*2
        );

        ctx.arc(
            x+w-10,y+h,8,0,Math.PI*2
        );

        ctx.fill();

        return;
    }

    if(o.type==="cone"){

        ctx.fillStyle="#f07824";

        ctx.beginPath();

        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x,y+h);

        ctx.closePath();
        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x+8,y+h*.55,w-16,7
        );

        return;
    }

    if(
        [
            "rock",
            "snowrock",
            "beachrock",
            "lavaRock",
            "redrock",
            "goldrock",
            "bridgeRock",
            "palmrock"
        ].includes(o.type)
    ){

        if(o.type==="snowrock")
            ctx.fillStyle="#dff6ff";

        else if(o.type==="lavaRock")
            ctx.fillStyle="#592a20";

        else if(o.type==="redrock")
            ctx.fillStyle="#873e30";

        else if(o.type==="goldrock")
            ctx.fillStyle="#bd8b2f";

        else if(o.type==="beachrock")
            ctx.fillStyle="#8c7965";

        else
            ctx.fillStyle="#666d72";

        ctx.beginPath();

        ctx.moveTo(x+5,y+h);
        ctx.lineTo(x+12,y+10);
        ctx.lineTo(x+w*.55,y);
        ctx.lineTo(x+w-4,y+15);
        ctx.lineTo(x+w-8,y+h);

        ctx.closePath();
        ctx.fill();

        return;
    }

    if(o.type==="cactus"){

        ctx.fillStyle="#348b42";

        ctx.fillRect(
            x+12,y,15,h
        );

        ctx.fillRect(
            x,y+18,13,10
        );

        ctx.fillRect(
            x,y+8,8,25
        );

        ctx.fillRect(
            x+27,y+30,12,10
        );

        ctx.fillRect(
            x+31,y+18,8,24
        );

        return;
    }

    if(o.type==="log"){

        ctx.fillStyle="#71452a";

        ctx.beginPath();

        ctx.roundRect(
            x,y+12,w,25,8
        );

        ctx.fill();

        return;
    }

    if(
        o.type==="bush" ||
        o.type==="darktree" ||
        o.type==="snowtree"
    ){

        ctx.fillStyle=
            o.type==="snowtree"
            ? "#d9eef5"
            : o.type==="darktree"
            ? "#193c28"
            : "#2f6d38";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+25,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#583b23";

        ctx.fillRect(
            x+w/2-5,
            y+30,
            10,
            h-30
        );

        return;
    }

    if(o.type==="snowman"){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h-12,
            18,
            0,Math.PI*2
        );

        ctx.arc(
            x+w/2,
            y+h-34,
            14,
            0,Math.PI*2
        );

        ctx.arc(
            x+w/2,
            y+h-51,
            10,
            0,Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            x+17,y+14,2.5,
            0,Math.PI*2
        );

        ctx.arc(
            x+29,y+14,2.5,
            0,Math.PI*2
        );

        ctx.fill();

        return;
    }

    if(
        o.type==="ice" ||
        o.type==="crystal"
    ){

        ctx.fillStyle=
            o.type==="ice"
            ? "#9be5ff"
            : "#8bc7e8";

        ctx.beginPath();

        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x+w/2,y+h-10);
        ctx.lineTo(x,y+h);

        ctx.closePath();

        ctx.fill();

        return;
    }

    if(
        o.type==="fire" ||
        o.type==="lightning"
    ){

        ctx.fillStyle=
            o.type==="fire"
            ? "#ff641f"
            : "#f4e84d";

        ctx.beginPath();

        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x+w*.55,y+h-10);
        ctx.lineTo(x+w*.35,y+h);

        ctx.closePath();

        ctx.fill();

        return;
    }

    if(o.type==="water"){

        ctx.fillStyle="#2f8995";

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,0,Math.PI*2
        );

        ctx.fill();

        return;
    }

    if(o.type==="fence"){

        ctx.fillStyle="#8b633d";

        ctx.fillRect(x,y+10,w,8);
        ctx.fillRect(x,y+30,w,8);

        ctx.fillRect(x+5,y,7,h);
        ctx.fillRect(x+w-12,y,7,h);

        return;
    }

    if(o.type==="hay"){

        ctx.fillStyle="#c7a348";

        ctx.fillRect(
            x,y,w,h
        );

        return;
    }

    if(
        o.type==="wall" ||
        o.type==="crate"
    ){

        ctx.fillStyle=
            o.type==="wall"
            ? "#625e58"
            : "#875b31";

        ctx.fillRect(
            x,y,w,h
        );

        ctx.strokeStyle="#d29a54";
        ctx.strokeRect(
            x+3,y+3,w-6,h-6
        );

        return;
    }

    if(o.type==="barrier"){

        ctx.fillStyle="#edb52e";

        ctx.fillRect(
            x,y+12,w,10
        );

        ctx.fillRect(
            x,y+30,w,10
        );

        ctx.fillStyle="#555";

        ctx.fillRect(
            x+5,y+5,7,h
        );

        ctx.fillRect(
            x+w-12,y+5,7,h
        );

        return;
    }

    if(o.type==="lamp"){

        ctx.fillStyle="#30343a";

        ctx.fillRect(
            x+w/2-4,
            y+15,
            8,
            h
        );

        ctx.fillStyle="#f4df74";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+10,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;
    }

    if(o.type==="barrel"){

        ctx.fillStyle="#74452b";

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,0,Math.PI*2
        );

        ctx.fill();

        return;
    }

    if(o.type==="shell"){

        ctx.fillStyle="#e5a06d";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h,
            w/2,
            Math.PI,
            0
        );

        ctx.fill();

        return;
    }

    ctx.fillStyle="#666";

    ctx.fillRect(
        x,y,w,h
    );

}


/* =====================================================
   POOP
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#75431f";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y+8,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        10,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-8,
        7,
        Math.PI,
        0
    );

    ctx.fill();

}


/* =====================================================
   COMPLETAR MAPA
===================================================== */

function completeMap(){

    if(level>=30){

        running=false;

        alert(
            "🏆 PARABÉNS "+
            (currentUser || "JOGADOR")+
            "!\n\nVOCÊ TERMINOU OS 30 MAPAS!"
        );

        backToMenu();

        return;

    }

    level++;

    poop=0;

    obstacles=[];
    poops=[];

    if(level>unlockedMap)
        unlockedMap=level;

    unlockedCharacters=
        Math.max(
            unlockedCharacters,
            level
        );

    selectedMap=level;

    saveProgress();

    document.getElementById("level")
        .textContent=level;

    document.getElementById("poopCount")
        .textContent="0";

    obstacleTimer=120;
    poopTimer=75;

    buildMaps();
    buildCharacters();

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;

    document.getElementById("finalLevel")
        .textContent=level;

    document.getElementById("finalPoop")
        .textContent=poop;

    document.getElementById("gameOver")
        .style.display="flex";

    updateWolf();

    setTimeout(
        startSadMusic,
        100
    );

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;

    const delta=
        Math.min(
            time-lastTime,
            32
        );

    lastTime=time;

    const dt=
        delta/16.6667;

    if(
        document.getElementById("game")
        .style.display==="block"
    ){

        drawBackground();

        if(started && running){

            player.vy+=.58*dt;

            player.y+=
                player.vy*dt;

            if(player.y>=H-130){

                player.y=H-130;

                player.vy=0;

                player.grounded=true;

            }

            updateWolf();

            /* OBSTÁCULOS */

            obstacleTimer-=dt;

            if(obstacleTimer<=0){

                spawnObstacle();

                obstacleTimer=
                    115+
                    Math.random()*65;

            }

            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=
                    obstacles[i];

                o.x-=
                    GAME_SPEED*dt;

                drawObstacle(o);

                if(collision(player,o))
                    hitObstacle();

            }

            obstacles=
                obstacles.filter(
                    o=>o.x>-180
                );


            /* POOP */

            poopTimer-=dt;

            if(poopTimer<=0){

                spawnPoop();

                poopTimer=
                    85+
                    Math.random()*55;

            }

            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=
                    poops[i];

                p.x-=
                    GAME_SPEED*dt;

                drawPoop(p);

                const box={

                    x:p.x-14,
                    y:p.y-14,
                    width:28,
                    height:28

                };

                if(collision(player,box)){

                    poops.splice(i,1);

                    poop++;

                    document.getElementById(
                        "poopCount"
                    ).textContent=poop;

                    if(poop>=10){

                        completeMap();

                        break;

                    }

                }

            }

            poops=
                poops.filter(
                    p=>p.x>-60
                );

        }

    }

    requestAnimationFrame(loop);

}


/* =====================================================
   BOTÃO JOGAR — CORRIGIDO
===================================================== */

document.getElementById("play")
.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        stopSadMusic();

        document.getElementById("menu")
            .style.display="none";

        document.getElementById("game")
            .style.display="block";

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tap")
            .style.display="block";

        updateWolf();

    }
);


/* =====================================================
   TOQUE PARA JOGAR / PULAR
===================================================== */

document.getElementById("game")
.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest("button")
        )
            return;

        if(!started){

            started=true;
            running=true;

            document.getElementById("tap")
                .style.display="none";

            updateWolf();

            return;

        }

        jump();

    }
);


/* =====================================================
   REINICIAR
===================================================== */

document.getElementById("restart")
.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        stopSadMusic();

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tap")
            .style.display="block";

        updateWolf();

    }
);


/* =====================================================
   VOLTAR MENU
===================================================== */

function backToMenu(){

    stopSadMusic();

    running=false;
    started=false;

    document.getElementById("game")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="none";

    document.getElementById("menu")
        .style.display="block";

    buildMaps();
    buildCharacters();

}

document.getElementById("home")
.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        backToMenu();

    }
);

document.getElementById("back")
.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        backToMenu();

    }
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();

            if(
                document.getElementById("game")
                .style.display==="block"
            ){

                if(!started){

                    started=true;
                    running=true;

                    document.getElementById("tap")
                        .style.display="none";

                }else{

                    jump();

                }

            }

        }

    }
);


/* =====================================================
   INICIAR LOOP
===================================================== */

requestAnimationFrame(loop);

</script>
