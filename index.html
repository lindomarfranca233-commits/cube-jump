<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,sans-serif;
}

button{
    touch-action:manipulation;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#3d454d,#050608 75%);
    color:white;
}

.loadingTitle{
    font-size:38px;
    font-weight:900;
    text-align:center;
    text-shadow:0 0 15px red,0 0 30px #700;
}

.loadingWolf{
    font-size:90px;
    margin:20px;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadingBar{
    width:280px;
    height:12px;
    border-radius:20px;
    overflow:hidden;
    background:#222;
}

#barFill{
    width:0%;
    height:100%;
    background:#e00000;
    box-shadow:0 0 15px red;
}

/* ================= MENU ================= */

#menu{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    overflow:auto;
    flex-direction:column;
    align-items:center;
    color:white;
    padding:18px;
    background:
    radial-gradient(circle at center,#353c44,#080a0e 70%);
}

.menuTitle{
    font-size:38px;
    font-weight:900;
    text-shadow:0 0 15px red;
}

.subtitle{
    color:#aaa;
    text-align:center;
    margin-top:4px;
}

.creator{
    color:#ff3333;
    font-weight:bold;
    margin:8px;
}

.section{
    width:100%;
    max-width:600px;
    font-weight:bold;
    margin-top:10px;
}

.maps{
    width:100%;
    max-width:600px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:10px 0 20px;
}

.map{
    min-height:78px;
    border:2px solid #3e4348;
    border-radius:12px;
    background:linear-gradient(145deg,#272c31,#0e1013);
    color:white;
    position:relative;
    font-weight:bold;
}

.map.unlocked{
    border-color:#777;
}

.map.selected{
    border-color:#ff2020;
    box-shadow:0 0 12px rgba(255,0,0,.45);
}

.map.locked{
    opacity:.35;
}

.mapEmoji{
    display:block;
    font-size:27px;
}

.mapLock{
    position:absolute;
    right:6px;
    top:4px;
}

#play{
    width:280px;
    padding:16px;
    border:2px solid #ff3030;
    border-radius:12px;
    background:#760000;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= LOBO ================= */

#wolf{
    position:absolute;
    width:68px;
    height:78px;
    z-index:20;
    pointer-events:none;
    transform-origin:center bottom;
}

.wBody{
    position:absolute;
    left:4px;
    top:31px;
    width:48px;
    height:29px;
    border-radius:50%;
    background:linear-gradient(145deg,#858b8f,#33383d);
}

.wHead{
    position:absolute;
    left:33px;
    top:8px;
    width:35px;
    height:39px;
    border-radius:50%;
    background:linear-gradient(145deg,#91979a,#41474c);
}

.wEar{
    position:absolute;
    width:17px;
    height:27px;
    background:#292e32;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.wEar.a{
    left:33px;
    top:0;
}

.wEar.b{
    left:51px;
    top:1px;
}

.wEye{
    position:absolute;
    top:20px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ff1010;
    box-shadow:0 0 8px red;
}

.wEye.a{
    left:42px;
}

.wEye.b{
    left:56px;
}

.wMuzzle{
    position:absolute;
    left:53px;
    top:29px;
    width:19px;
    height:12px;
    border-radius:50%;
    background:#555b5f;
}

.wNose{
    position:absolute;
    left:67px;
    top:32px;
    width:6px;
    height:5px;
    border-radius:50%;
    background:#000;
}

.wTail{
    position:absolute;
    left:0;
    top:25px;
    width:25px;
    height:15px;
    border-top:7px solid #252a2e;
    border-radius:50%;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:53px;
    width:7px;
    height:22px;
    border-radius:8px;
    background:#171a1d;
}

.l1{left:9px}
.l2{left:21px}
.l3{left:37px}
.l4{left:49px}

#wolf.running .l1,
#wolf.running .l3{
    animation:leg1 .18s infinite alternate;
}

#wolf.running .l2,
#wolf.running .l4{
    animation:leg2 .18s infinite alternate;
}

@keyframes leg1{
    from{transform:rotate(20deg)}
    to{transform:rotate(-20deg)}
}

@keyframes leg2{
    from{transform:rotate(-20deg)}
    to{transform:rotate(20deg)}
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    z-index:40;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#poop{
    color:#d29a65;
}

#home{
    position:absolute;
    z-index:45;
    right:10px;
    top:45px;
    padding:8px 10px;
    border:1px solid white;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    color:white;
}

#tapStart{
    position:absolute;
    z-index:50;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-align:center;
    text-shadow:2px 2px 8px black;
    pointer-events:none;
}

#tapStart small{
    display:block;
    font-size:14px;
    margin-top:8px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.88);
    color:white;
    text-align:center;
}

#gameOver h2{
    color:red;
    font-size:45px;
}

.overButton{
    margin-top:15px;
    padding:14px 25px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#760000;
}

.menuButton{
    background:#333;
}
</style>
</head>

<body>

<!-- ================= LOADING ================= -->

<div id="loading">

    <div class="loadingTitle">
        LILO O CAGÃO
    </div>

    <div class="loadingWolf">🐺</div>

    <div class="loadingText">
        CARREGANDO
    </div>

    <div id="percent">0%</div>

    <div class="loadingBar">
        <div id="barFill"></div>
    </div>

</div>


<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menuTitle">
        LILO O CAGÃO
    </div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="section">
        🗺️ ESCOLHA O MAPA
    </div>

    <div class="maps" id="maps"></div>

    <button id="play">
        ▶ TOCAR PARA JOGAR
    </button>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="wolf">

        <div class="wTail"></div>
        <div class="wBody"></div>
        <div class="wHead"></div>

        <div class="wEar a"></div>
        <div class="wEar b"></div>

        <div class="wEye a"></div>
        <div class="wEye b"></div>

        <div class="wMuzzle"></div>
        <div class="wNose"></div>

        <div class="leg l1"></div>
        <div class="leg l2"></div>
        <div class="leg l3"></div>
        <div class="leg l4"></div>

    </div>

    <div id="hud">

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            💩 <span id="poop">0</span>/10
        </div>

        <div>
            MAPA <span id="level">1</span>
        </div>

    </div>

    <button id="home">
        🏠 INÍCIO
    </button>

    <div id="tapStart">

        TOQUE PARA COMEÇAR

        <small>
            Toque novamente para pular
        </small>

    </div>


    <div id="gameOver">

        <h2>GAME OVER</h2>

        <div>
            MAPA <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:8px">
            💩 <span id="finalPoop">0</span>/10
        </div>

        <button class="overButton restart" id="restart">
            🔄 JOGAR NOVAMENTE
        </button>

        <button class="overButton menuButton" id="backMenu">
            🏠 VOLTAR AO INÍCIO
        </button>

    </div>

</div>


<script>

/* =====================================================
   LOADING
===================================================== */

let loadingPercent=0;

function loading(){

    loadingPercent++;

    document.getElementById("percent")
        .textContent=loadingPercent+"%";

    document.getElementById("barFill")
        .style.width=loadingPercent+"%";

    if(loadingPercent<100){

        setTimeout(loading,22);

    }else{

        setTimeout(()=>{

            document.getElementById("loading")
                .style.display="none";

            document.getElementById("menu")
                .style.display="flex";

            createMaps();

        },300);

    }
}

loading();


/* =====================================================
   MAPAS
===================================================== */

let unlockedMap=
    Number(localStorage.getItem("liloUnlockedMap")||1);

if(unlockedMap<1)
    unlockedMap=1;

if(unlockedMap>30)
    unlockedMap=30;

let selectedMap=unlockedMap>0 ? 1 : 1;

const mapNames=[
    "CIDADE",
    "DESERTO",
    "FLORESTA",
    "MONTANHA",
    "PRAIA",
    "NEVE",
    "VULCÃO",
    "PÂNTANO",
    "CAVERNA",
    "NOITE",
    "FAZENDA",
    "PONTE",
    "RUÍNAS",
    "FLORESTA ESCURA",
    "CIDADE 2",
    "DESERTO 2",
    "GELO",
    "ILHA",
    "TEMPESTADE",
    "MONTANHA 2",
    "CIDADE NOTURNA",
    "VULCÃO 2",
    "CAVERNA 2",
    "FLORESTA 2",
    "DESERTO 3",
    "PRAIA 2",
    "NEVE 2",
    "RUÍNAS 2",
    "TORRES",
    "FINAL"
];

const mapEmoji=[
    "🏙️","🏜️","🌲","⛰️","🏖️",
    "❄️","🌋","🐊","🪨","🌙",
    "🌾","🌉","🏚️","🌲","🏙️",
    "🏜️","🧊","🏝️","⛈️","⛰️",
    "🌃","🌋","🕳️","🌲","🏜️",
    "🏖️","❄️","🏚️","🏢","👑"
];


function createMaps(){

    const container=
        document.getElementById("maps");

    container.innerHTML="";


    for(let i=1;i<=30;i++){

        const button=
            document.createElement("button");

        button.className="map";

        if(i<=unlockedMap)
            button.classList.add("unlocked");
        else
            button.classList.add("locked");

        if(i===selectedMap)
            button.classList.add("selected");


        button.dataset.map=i;


        let lock=
            i>unlockedMap
            ? '<span class="mapLock">🔒</span>'
            : "";


        button.innerHTML=
            lock+
            `<span class="mapEmoji">${mapEmoji[i-1]}</span>`+
            `MAPA ${i}<br>${mapNames[i-1]}`;


        button.addEventListener(
            "click",
            ()=>{

                if(i>unlockedMap)
                    return;

                selectedMap=i;

                document
                    .querySelectorAll(".map")
                    .forEach(m=>
                        m.classList.remove("selected")
                    );

                button.classList.add("selected");

            }
        );


        container.appendChild(button);

    }

}


/* =====================================================
   CANVAS
===================================================== */

const canvas=
    document.getElementById("canvas");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=
        canvas.width=
        window.innerWidth;

    H=
        canvas.height=
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let player;

let obstacles=[];
let poops=[];

let started=false;
let running=false;

let lives=3;
let poopCount=0;
let level=1;


/*
   VELOCIDADE FIXA POR MAPA.
   PERDER VIDA NÃO ALTERA.
*/

let speed=4.3;

let obstacleTimer=0;
let poopTimer=0;

let hitCooldown=false;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    level=selectedMap;

    lives=3;
    poopCount=0;

    /*
       Velocidade moderada.
       Nunca é multiplicada ao perder vida.
    */

    if(level<=10)
        speed=4.3;
    else if(level<=20)
        speed=4.7;
    else
        speed=5;


    player={

        x:45,

        y:H-125,

        width:58,

        height:60,

        velocityY:0,

        grounded:true

    };


    obstacles=[];
    poops=[];

    obstacleTimer=75;
    poopTimer=70;

    hitCooldown=false;


    updateLives();

    document.getElementById("poop")
        .textContent="0";

    document.getElementById("level")
        .textContent=level;

    updateWolfPosition();

}


/* =====================================================
   LOBO ACOMPANHA O PLAYER
===================================================== */

function updateWolfPosition(){

    const wolf=
        document.getElementById("wolf");


    /*
       ESSA ERA A PARTE QUE ESTAVA
       CAUSANDO O BUG DO LOBO NÃO PULAR.

       Agora o CSS usa exatamente
       player.x e player.y.
    */

    wolf.style.left=
        player.x+"px";

    wolf.style.top=
        player.y+"px";


    if(started && running)
        wolf.classList.add("running");
    else
        wolf.classList.remove("running");

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives(){

    let text="";

    for(let i=0;i<3;i++){

        text+=
            i<lives
            ? "❤️"
            : "🖤";

    }

    document.getElementById("lives")
        .textContent=text;

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)
        return;

    if(!player.grounded)
        return;


    /*
       PULO ALTO.

       -17 deixa o lobo subir
       bastante para alcançar
       as bostinhas.
    */

    player.velocityY=-17;

    player.grounded=false;

    bark();

}


/* =====================================================
   LATIDO
===================================================== */

let audioContext=null;

function bark(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state==="suspended"
        ){

            audioContext.resume();

        }


        const now=
            audioContext.currentTime;

        const osc=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();


        osc.type="square";

        osc.frequency.setValueAtTime(
            350,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            120,
            now+.14
        );


        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .2,
            now+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+.17
        );


        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );


        osc.start(now);

        osc.stop(now+.18);

    }catch(e){}

}


/* =====================================================
   TOQUE
===================================================== */

function gameTouch(e){

    if(
        e.target.closest &&
        e.target.closest("button")
    )
        return;


    if(!started){

        started=true;
        running=true;

        document.getElementById("tapStart")
            .style.display="none";

        updateWolfPosition();

        return;

    }


    jump();

}


/* =====================================================
   TIPOS DE OBSTÁCULO
===================================================== */

function getObstacleTypes(){

    if(level===1){

        /*
           MAPA 1:
           CIDADE.
           Obstáculos entre prédios.
        */

        return[
            "buildingGap",
            "airConditioner",
            "barrier",
            "buildingGap",
            "spike"
        ];

    }


    if(level===2){

        return[
            "cactus",
            "rock",
            "cactus",
            "spike"
        ];

    }


    if(level===3){

        return[
            "spike",
            "rock",
            "doubleSpike"
        ];

    }


    if(level===4){

        return[
            "rock",
            "spike",
            "doubleSpike"
        ];

    }


    if(level===5){

        return[
            "barrier",
            "rock",
            "spike"
        ];

    }


    if(level===6){

        return[
            "ice",
            "spike",
            "rock"
        ];

    }


    if(level===7){

        return[
            "lava",
            "spike",
            "rock"
        ];

    }


    return[
        "spike",
        "rock",
        "doubleSpike",
        "barrier"
    ];

}


/* =====================================================
   CRIAR OBSTÁCULO
===================================================== */

function spawnObstacle(){

    const types=
        getObstacleTypes();

    const type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];


    let width=48;
    let height=48;


    if(type==="doubleSpike")
        width=90;


    if(type==="cactus"){

        width=42;
        height=62;

    }


    if(type==="buildingGap"){

        width=65;
        height=50;

    }


    if(type==="airConditioner"){

        width=45;
        height=35;

    }


    obstacles.push({

        x:W+60,

        y:H-65-height,

        width,

        height,

        type

    });

}


/* =====================================================
   CRIAR BOSTINHA
===================================================== */

function spawnPoop(){

    /*
       Primeiro escolhemos a altura.

       Depois verificamos se existe
       obstáculo naquela região.

       Assim a bostinha NÃO nasce
       dentro do obstáculo.
    */

    let attempts=0;

    let poopY=0;


    while(attempts<20){

        attempts++;


        poopY=
            H-
            (
                100+
                Math.random()*190
            );


        let poopX=
            W+80;


        let bad=false;


        for(const o of obstacles){

            if(
                Math.abs(
                    o.x-poopX
                )<100
            ){

                /*
                   Se a altura da bostinha
                   ficar próxima do obstáculo,
                   tentamos outra posição.
                */

                if(
                    Math.abs(
                        poopY-o.y
                    )<80
                ){

                    bad=true;
                    break;

                }

            }

        }


        if(!bad)
            break;

    }


    poops.push({

        x:W+80,

        y:poopY,

        size:15

    });

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    return(

        a.x+8 <
        b.x+b.width &&

        a.x+a.width-8 >
        b.x &&

        a.y+8 <
        b.y+b.height &&

        a.y+a.height-5 >
        b.y

    );

}


/* =====================================================
   BATEU
===================================================== */

function hitObstacle(){

    if(hitCooldown)
        return;


    hitCooldown=true;

    lives--;

    updateLives();


    /*
       NÃO altera speed.
    */

    player.velocityY=-6;


    if(lives<=0){

        gameOver();

        return;

    }


    /*
       O obstáculo NÃO é removido.
       Só existe proteção temporária.
    */

    setTimeout(()=>{

        hitCooldown=false;

    },850);

}


/* =====================================================
   FUNDO
===================================================== */

function drawBackground(){

    let g=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    /* ================= CIDADE ================= */

    if(level===1){

        g.addColorStop(
            0,
            "#4e8fc5"
        );

        g.addColorStop(
            1,
            "#d7ecf7"
        );


        ctx.fillStyle=g;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        /* prédios */

        for(let i=0;i<12;i++){

            let x=
                i*95-
                (
                    performance.now()
                    *speed/70
                )%95;


            let height=
                100+
                (i%4)*45;


            ctx.fillStyle=
                i%2
                ? "#4c5964"
                : "#343e47";


            ctx.fillRect(
                x,
                H-65-height,
                75,
                height
            );


            /* janelas */

            ctx.fillStyle="#f6d879";


            for(
                let yy=H-50-height;
                yy<H-80;
                yy+=25
            ){

                ctx.fillRect(
                    x+12,
                    yy,
                    8,
                    10
                );

                ctx.fillRect(
                    x+32,
                    yy,
                    8,
                    10
                );

                ctx.fillRect(
                    x+52,
                    yy,
                    8,
                    10
                );

            }

        }

    }


    /* ================= DESERTO ================= */

    else if(level===2){

        g.addColorStop(
            0,
            "#e79a4e"
        );

        g.addColorStop(
            1,
            "#ffe3a6"
        );


        ctx.fillStyle=g;

        ctx.fillRect(
            0,0,W,H
        );


        ctx.fillStyle="#e8b76b";

        for(let i=0;i<7;i++){

            let x=
                i*180-
                (
                    performance.now()
                    *speed/60
                )%180;


            ctx.beginPath();

            ctx.arc(
                x,
                H-90,
                70,
                Math.PI,
                0
            );

            ctx.fill();

        }

    }


    /* ================= FLORESTA ================= */

    else if(level===3){

        g.addColorStop(
            0,
            "#4b9ed0"
        );

        g.addColorStop(
            1,
            "#d6f0d0"
        );


        ctx.fillStyle=g;

        ctx.fillRect(
            0,0,W,H
        );


        for(let i=0;i<9;i++){

            let x=
                i*150-
                (
                    performance.now()
                    *speed/55
                )%150;


            ctx.fillStyle="#315a31";

            ctx.fillRect(
                x,
                H-150,
                12,
                90
            );


            ctx.beginPath();

            ctx.arc(
                x+6,
                H-160,
                45,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* ================= OUTROS MAPAS ================= */

    else{

        g.addColorStop(
            0,
            level%2
            ? "#536b88"
            : "#263847"
        );

        g.addColorStop(
            1,
            level%2
            ? "#b9d0db"
            : "#111820"
        );


        ctx.fillStyle=g;

        ctx.fillRect(
            0,0,W,H
        );

    }


    /* chão */

    ctx.fillStyle=
        level===2
        ? "#c3954e"
        : level===7
        ? "#32201e"
        : "#3e4937";


    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );


    ctx.fillStyle=
        level===7
        ? "#ff4c28"
        : level===2
        ? "#e0ad61"
        : "#293729";


    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   DESENHAR OBSTÁCULO
===================================================== */

function drawObstacle(o){

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        let amount=
            o.type==="doubleSpike"
            ? 2
            : 1;


        for(let i=0;i<amount;i++){

            let x=
                o.x+i*45;


            ctx.fillStyle="#15171a";

            ctx.beginPath();

            ctx.moveTo(
                x,
                o.y+o.height
            );

            ctx.lineTo(
                x+22,
                o.y
            );

            ctx.lineTo(
                x+44,
                o.y+o.height
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    else if(o.type==="cactus"){

        ctx.fillStyle="#347c3b";

        ctx.fillRect(
            o.x+12,
            o.y,
            17,
            o.height
        );

        ctx.fillRect(
            o.x,
            o.y+22,
            15,
            8
        );

        ctx.fillRect(
            o.x,
            o.y+10,
            8,
            20
        );

        ctx.fillRect(
            o.x+28,
            o.y+35,
            14,
            8
        );

        ctx.fillRect(
            o.x+34,
            o.y+23,
            8,
            20
        );

    }


    else if(o.type==="rock"){

        ctx.fillStyle="#62686c";

        ctx.beginPath();

        ctx.arc(
            o.x+24,
            o.y+25,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    else if(o.type==="barrier"){

        ctx.fillStyle="#d65a28";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            o.x+5,
            o.y+12,
            o.width-10,
            8
        );

    }


    else if(o.type==="airConditioner"){

        ctx.fillStyle="#d8dde0";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        ctx.fillStyle="#555";

        for(let i=0;i<4;i++){

            ctx.fillRect(
                o.x+8+i*8,
                o.y+8,
                4,
                20
            );

        }

    }


    else if(o.type==="buildingGap"){

        ctx.fillStyle="#252b31";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );


        ctx.fillStyle="#ffcf48";

        ctx.fillRect(
            o.x+10,
            o.y+12,
            10,
            12
        );

        ctx.fillRect(
            o.x+35,
            o.y+12,
            10,
            12
        );

    }


    else if(o.type==="lava"){

        ctx.fillStyle="#ff3c20";

        ctx.beginPath();

        ctx.ellipse(
            o.x+29,
            o.y+25,
            29,
            23,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    else if(o.type==="ice"){

        ctx.fillStyle="#bceeff";

        ctx.beginPath();

        ctx.moveTo(
            o.x,
            o.y+o.height
        );

        ctx.lineTo(
            o.x+25,
            o.y
        );

        ctx.lineTo(
            o.x+50,
            o.y+o.height
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* =====================================================
   DESENHAR BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#74401e";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y+7,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-2,
        10,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-10,
        7,
        Math.PI,
        0
    );

    ctx.fill();

}


/* =====================================================
   PASSAR MAPA
===================================================== */

function checkLevel(){

    if(poopCount<10)
        return;


    if(level<30){

        level++;

        poopCount=0;

        obstacles=[];
        poops=[];


        /*
           Desbloqueia somente o
           próximo mapa.
        */

        if(level>unlockedMap){

            unlockedMap=level;

            localStorage.setItem(
                "liloUnlockedMap",
                unlockedMap
            );

        }


        /*
           A velocidade só muda
           porque entrou em um novo mapa.
           Perder vida nunca altera.
        */

        if(level<=10)
            speed=4.3;
        else if(level<=20)
            speed=4.7;
        else
            speed=5;


        document.getElementById("level")
            .textContent=level;

        document.getElementById("poop")
            .textContent="0";


        createMaps();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    started=false;

    document.getElementById("wolf")
        .classList.remove("running");

    document.getElementById("finalLevel")
        .textContent=level;

    document.getElementById("finalPoop")
        .textContent=poopCount;

    document.getElementById("gameOver")
        .style.display="flex";

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;


    let delta=
        Math.min(
            time-lastTime,
            32
        );


    lastTime=time;


    let dt=
        delta/16.6667;


    if(
        document.getElementById("game")
        .style.display==="block"
    ){

        drawBackground();


        if(started && running){

            /* =================
               FÍSICA DO PULO
            ================= */

            /*
               Pulo forte e suave.
               Agora o lobo acompanha
               player.y diretamente.
            */

            player.velocityY +=
                .55*dt;

            player.y +=
                player.velocityY*dt;


            if(
                player.y>=H-125
            ){

                player.y=H-125;

                player.velocityY=0;

                player.grounded=true;

            }


            updateWolfPosition();


            /* =================
               OBSTÁCULOS
            ================= */

            obstacleTimer-=dt;


            if(
                obstacleTimer<=0
            ){

                spawnObstacle();

                obstacleTimer=
                    90+
                    Math.random()*45;

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                let o=
                    obstacles[i];


                /*
                   VELOCIDADE CONSTANTE.
                */

                o.x-=
                    speed*dt;


                drawObstacle(o);


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    hitObstacle();

                }

            }


            obstacles=
                obstacles.filter(
                    o=>o.x>-150
                );


            /* =================
               BOSTINHAS
            ================= */

            poopTimer-=dt;


            if(
                poopTimer<=0
            ){

                spawnPoop();

                poopTimer=
                    80+
                    Math.random()*55;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                let p=
                    poops[i];


                p.x-=
                    speed*dt;


                drawPoop(p);


                let box={

                    x:p.x-15,

                    y:p.y-15,

                    width:30,

                    height:30

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );


                    poopCount++;


                    document.getElementById("poop")
                        .textContent=poopCount;


                    checkLevel();

                }

            }


            poops=
                poops.filter(
                    p=>p.x>-50
                );

        }

    }


    requestAnimationFrame(loop);

}


/* =====================================================
   JOGAR
===================================================== */

document.getElementById("play")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("menu")
            .style.display="none";

        document.getElementById("game")
            .style.display="block";

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tapStart")
            .style.display="block";

        updateWolfPosition();

    }
);


/* =====================================================
   TOQUE
===================================================== */

document.getElementById("game")
.addEventListener(
    "pointerdown",
    gameTouch
);


/* =====================================================
   REINICIAR
===================================================== */

document.getElementById("restart")
.addEventListener(
    "click",
    ()=>{

        document.getElementById("gameOver")
            .style.display="none";

        resetGame();

        started=false;
        running=false;

        document.getElementById("tapStart")
            .style.display="block";

        updateWolfPosition();

    }
);


/* =====================================================
   VOLTAR AO MENU
===================================================== */

function goMenu(){

    running=false;
    started=false;

    document.getElementById("game")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="none";

    document.getElementById("menu")
        .style.display="flex";

    createMaps();

}


document.getElementById("home")
.addEventListener(
    "click",
    goMenu
);

document.getElementById("backMenu")
.addEventListener(
    "click",
    goMenu
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();

            if(
                document.getElementById("game")
                .style.display==="block"
            ){

                if(!started){

                    started=true;
                    running=true;

                    document.getElementById("tapStart")
                        .style.display="none";

                    updateWolfPosition();

                }else{

                    jump();

                }

            }

        }

    }
);


/* =====================================================
   LOOP INICIAL
===================================================== */

requestAnimationFrame(loop);

</script>
