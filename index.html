<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>LILO O CAGÃO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    font-family:Arial,sans-serif;
}

button{
    -webkit-tap-highlight-color:transparent;
    cursor:pointer;
}

/* ================= LOADING ================= */

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(
        circle at center,
        #343a42 0%,
        #101319 48%,
        #020304 100%
    );

    color:white;
}

.logo{
    font-size:43px;
    font-weight:1000;
    letter-spacing:3px;
    text-align:center;

    text-shadow:
    0 0 12px red,
    0 0 35px #900;
}

.loadingWolf{
    font-size:90px;
    margin:15px 0;
}

.loadingText{
    color:#aaa;
    letter-spacing:4px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.bar{
    width:280px;
    height:12px;
    border-radius:20px;
    background:#222;
    overflow:hidden;
}

#barFill{
    width:0%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        #720000,
        #ff2929
    );

    box-shadow:0 0 15px red;
}

/* ================= MENU ================= */

#menu{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    overflow-y:auto;

    flex-direction:column;
    align-items:center;

    padding:20px 15px 30px;

    background:
    radial-gradient(
        circle at 50% 15%,
        #343b43,
        #0b0e13 60%,
        #020304
    );

    color:white;
}

.menuTitle{
    font-size:43px;
    font-weight:1000;
    letter-spacing:3px;

    text-shadow:
    0 0 15px red,
    0 0 35px #700;

    text-align:center;
}

.subtitle{
    color:#aaa;
    margin:4px 0 12px;
    text-align:center;
    font-size:13px;
}

.creator{
    color:#ff5252;
    font-size:16px;
    font-weight:bold;

    margin-bottom:15px;

    text-shadow:
    0 0 8px #700;
}

.sectionTitle{
    width:100%;
    max-width:520px;

    font-weight:bold;
    margin:7px 0;
}

.characterList,
.mapList{
    width:100%;
    max-width:520px;

    display:flex;
    gap:10px;

    overflow-x:auto;

    padding:4px 2px 10px;
}

.card{
    min-width:130px;
    height:115px;

    border:2px solid #454b52;
    border-radius:16px;

    background:
    linear-gradient(
        145deg,
        #252a30,
        #0e1115
    );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;

    position:relative;
}

.card.selected{
    border-color:#ff3030;

    box-shadow:
    0 0 18px #8d0000;
}

.card.locked{
    opacity:.4;
    filter:grayscale(1);
}

.cardEmoji{
    font-size:43px;
}

.cardName{
    font-size:12px;
    font-weight:bold;
    margin-top:5px;
    text-align:center;
}

.lock{
    position:absolute;
    top:6px;
    right:7px;
}

.mapCard{
    min-width:145px;
    height:90px;
}

.mapIcon{
    font-size:29px;
}

.playButton{
    width:270px;
    padding:16px;

    margin-top:8px;

    border:2px solid #ff3636;
    border-radius:13px;

    background:
    linear-gradient(
        180deg,
        #a60000,
        #420000
    );

    color:white;

    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
}

/* ================= GAME ================= */

#game{
    display:none;

    position:fixed;
    inset:0;
}

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

#hud{
    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;

    font-size:18px;
    font-weight:bold;

    text-shadow:
    2px 2px 5px #000;

    z-index:10;
}

#poop{
    color:#dca56d;
}

#homeButton{
    position:absolute;

    top:52px;
    right:12px;

    z-index:15;

    border:1px solid #aaa;
    border-radius:9px;

    background:rgba(0,0,0,.55);

    color:white;

    padding:9px 12px;

    font-weight:bold;
}

#tapStart{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:22px;
    font-weight:bold;

    text-align:center;

    text-shadow:
    0 0 10px #000,
    2px 2px 5px #000;

    z-index:20;

    pointer-events:none;
}

#tapStart small{
    display:block;

    margin-top:9px;

    font-size:14px;
    color:#ddd;
}

#gameOver{
    display:none;

    position:absolute;
    inset:0;

    z-index:40;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.84);

    color:white;

    text-align:center;
}

#gameOver h2{
    color:#ff2525;

    font-size:43px;

    margin-bottom:15px;
}

.restart,
.menuButton{
    margin-top:15px;

    padding:13px 30px;

    border:0;
    border-radius:10px;

    color:white;

    font-size:17px;
    font-weight:bold;
}

.restart{
    background:#780000;
}

.menuButton{
    background:#30363c;
}

</style>
</head>

<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    <div class="logo">
        LILO O CAGÃO
    </div>

    <div class="loadingWolf">
        🐺
    </div>

    <div class="loadingText">
        CARREGANDO
    </div>

    <div id="percent">
        0%
    </div>

    <div class="bar">
        <div id="barFill"></div>
    </div>

</div>


<!-- =====================================================
     MENU
===================================================== -->

<div id="menu">

    <div class="menuTitle">
        LILO O CAGÃO
    </div>

    <div class="subtitle">
        CORRA • PULE • PEGUE AS BOSTINHAS 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>


    <div class="sectionTitle">
        🐺 PERSONAGEM
    </div>

    <div class="characterList">

        <button
            class="card selected"
            data-character="wolf">

            <div class="cardEmoji">
                🐺
            </div>

            <div class="cardName">
                LOBO
            </div>

        </button>


        <button
            class="card locked"
            data-character="dog">

            <span class="lock">
                🔒
            </span>

            <div class="cardEmoji">
                🐕
            </div>

            <div class="cardName">
                CACHORRO
            </div>

        </button>


        <button
            class="card locked"
            data-character="fox">

            <span class="lock">
                🔒
            </span>

            <div class="cardEmoji">
                🦊
            </div>

            <div class="cardName">
                RAPOSA
            </div>

        </button>

    </div>


    <div class="sectionTitle">
        🗺️ MAPAS
    </div>

    <div class="mapList">

        <button
            class="card mapCard selected"
            data-map="1">

            <div class="mapIcon">
                🌲
            </div>

            <div class="cardName">
                MAPA 1<br>
                FLORESTA
            </div>

        </button>


        <button
            class="card mapCard locked"
            data-map="2">

            <span class="lock">
                🔒
            </span>

            <div class="mapIcon">
                🏜️
            </div>

            <div class="cardName">
                MAPA 2<br>
                DESERTO
            </div>

        </button>


        <button
            class="card mapCard locked"
            data-map="3">

            <span class="lock">
                🔒
            </span>

            <div class="mapIcon">
                🌋
            </div>

            <div class="cardName">
                MAPA 3<br>
                VULCÃO
            </div>

        </button>

    </div>


    <button
        class="playButton"
        id="startButton">

        ▶ TOCAR PARA JOGAR

    </button>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game">

    <canvas id="canvas"></canvas>


    <div id="hud">

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            💩
            <span id="poop">0</span>/10
        </div>

        <div>
            MAPA
            <span id="level">1</span>
        </div>

    </div>


    <button id="homeButton">
        🏠 INÍCIO
    </button>


    <div id="tapStart">

        TOQUE NA TELA PARA COMEÇAR

        <small>
            Toque para pular 🐺🔊
        </small>

    </div>


    <div id="gameOver">

        <h2>
            GAME OVER
        </h2>

        <div>
            Você chegou ao mapa
            <span id="finalLevel">1</span>
        </div>

        <div style="margin-top:8px">

            Bostinhas:
            <span id="finalPoop">0</span>/10

        </div>


        <button
            class="restart"
            id="restart">

            🔄 JOGAR NOVAMENTE

        </button>


        <button
            class="menuButton"
            id="overMenu">

            🏠 VOLTAR AO INÍCIO

        </button>

    </div>

</div>


<script>

/* =====================================================
   PROGRESSO
===================================================== */

let unlockedMap =
Number(
    localStorage.getItem(
        "liliUnlockedMap"
    ) || 1
);

let unlockedCharacters =
Number(
    localStorage.getItem(
        "liliUnlockedCharacters"
    ) || 1
);

let selectedMap=1;

let selectedCharacter="wolf";


/* =====================================================
   LOADING
===================================================== */

let load=0;

function loading(){

    load++;

    document.getElementById(
        "percent"
    ).textContent=load+"%";

    document.getElementById(
        "barFill"
    ).style.width=load+"%";


    if(load<100){

        setTimeout(
            loading,
            25
        );

    }else{

        setTimeout(()=>{

            document.getElementById(
                "loading"
            ).style.display="none";

            document.getElementById(
                "menu"
            ).style.display="flex";

            updateMenu();

        },400);

    }

}

loading();


/* =====================================================
   MENU
===================================================== */

function updateMenu(){

    document.querySelectorAll(
        "[data-map]"
    ).forEach(card=>{

        const map=
        Number(card.dataset.map);

        if(map<=unlockedMap){

            card.classList.remove(
                "locked"
            );

            const lock=
            card.querySelector(".lock");

            if(lock)
                lock.remove();

        }

    });


    document.querySelectorAll(
        "[data-character]"
    ).forEach(card=>{

        const c=
        card.dataset.character;

        const available=
            c==="wolf" ||
            (
                c==="dog" &&
                unlockedCharacters>=2
            ) ||
            (
                c==="fox" &&
                unlockedCharacters>=3
            );


        if(available){

            card.classList.remove(
                "locked"
            );

            const lock=
            card.querySelector(".lock");

            if(lock)
                lock.remove();

        }

    });

}


/* MAPAS */

document.querySelectorAll(
    "[data-map]"
).forEach(card=>{

    card.addEventListener(
        "click",
        ()=>{

            const map=
            Number(card.dataset.map);

            if(map>unlockedMap)
                return;

            selectedMap=map;

            document.querySelectorAll(
                "[data-map]"
            ).forEach(c=>
                c.classList.remove(
                    "selected"
                )
            );

            card.classList.add(
                "selected"
            );

        }
    );

});


/* PERSONAGENS */

document.querySelectorAll(
    "[data-character]"
).forEach(card=>{

    card.addEventListener(
        "click",
        ()=>{

            if(
                card.classList.contains(
                    "locked"
                )
            )
                return;

            selectedCharacter=
            card.dataset.character;

            document.querySelectorAll(
                "[data-character]"
            ).forEach(c=>
                c.classList.remove(
                    "selected"
                )
            );

            card.classList.add(
                "selected"
            );

        }
    );

});


/* =====================================================
   CANVAS
===================================================== */

const canvas=
document.getElementById(
    "canvas"
);

const ctx=
canvas.getContext("2d");

let W,H;


function resize(){

    W=
    canvas.width=
    window.innerWidth;

    H=
    canvas.height=
    window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext=null;


function initAudio(){

    if(!audioContext){

        const AudioCtx=
        window.AudioContext ||
        window.webkitAudioContext;

        if(AudioCtx){

            audioContext=
            new AudioCtx();

        }

    }


    if(
        audioContext &&
        audioContext.state==="suspended"
    ){

        audioContext.resume();

    }

}


/*
   Latido feito pelo próprio navegador.
   Funciona sem precisar carregar arquivo externo.
*/

function bark(){

    initAudio();

    if(!audioContext)
        return;


    const now=
    audioContext.currentTime;


    /* primeiro som */

    const osc1=
    audioContext.createOscillator();

    const gain1=
    audioContext.createGain();

    osc1.type="sawtooth";

    osc1.frequency.setValueAtTime(
        210,
        now
    );

    osc1.frequency.exponentialRampToValueAtTime(
        90,
        now+0.13
    );


    gain1.gain.setValueAtTime(
        0.0001,
        now
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.25,
        now+0.015
    );

    gain1.gain.exponentialRampToValueAtTime(
        0.0001,
        now+0.14
    );


    osc1.connect(gain1);
    gain1.connect(
        audioContext.destination
    );

    osc1.start(now);
    osc1.stop(now+0.15);


    /* segundo som */

    const osc2=
    audioContext.createOscillator();

    const gain2=
    audioContext.createGain();

    osc2.type="square";

    osc2.frequency.setValueAtTime(
        145,
        now+0.11
    );

    osc2.frequency.exponentialRampToValueAtTime(
        65,
        now+0.23
    );


    gain2.gain.setValueAtTime(
        0.0001,
        now+0.11
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.20,
        now+0.125
    );

    gain2.gain.exponentialRampToValueAtTime(
        0.0001,
        now+0.24
    );


    osc2.connect(gain2);
    gain2.connect(
        audioContext.destination
    );

    osc2.start(now+0.11);
    osc2.stop(now+0.25);

}


/* =====================================================
   VARIÁVEIS
===================================================== */

let player;

let obstacles=[];
let poops=[];

let running=false;
let started=false;

let poopCount=0;
let level=1;
let lives=3;


/*
   IMPORTANTE:

   speed NÃO é alterado quando perde vida.

   Existe apenas UM requestAnimationFrame
   no jogo inteiro.
*/

let speed=5;

let obstacleTimer=0;
let poopTimer=0;

let legAnimation=0;

let hitCooldown=false;


/* =====================================================
   RESET
===================================================== */

function reset(){

    player={

        x:65,

        y:H-130,

        w:58,

        h:58,

        vy:0,

        grounded:true

    };


    obstacles=[];
    poops=[];

    poopCount=0;

    lives=3;

    level=selectedMap;


    /*
       Velocidade definida UMA VEZ.
    */

    speed=
        level===1
        ? 5
        : level===2
        ? 5.5
        : 6;


    obstacleTimer=90;

    poopTimer=40;

    hitCooldown=false;


    document.getElementById(
        "poop"
    ).textContent=0;

    document.getElementById(
        "level"
    ).textContent=level;

    updateLives();

}


/* =====================================================
   REINÍCIO APÓS BATER
===================================================== */

function restartAfterHit(){

    /*
       NÃO altera speed.
    */

    player.x=65;

    player.y=H-130;

    player.vy=0;

    player.grounded=true;


    /*
       Coloca o obstáculo que causou
       a colisão longe do jogador.

       Ele NÃO é apagado.
    */

    if(
        obstacles.length
    ){

        obstacles.forEach(o=>{

            if(
                o.x <
                player.x+
                player.w+
                100
            ){

                o.x=
                player.x+
                player.w+
                180;

            }

        });

    }


    obstacleTimer=70;

    running=false;


    setTimeout(()=>{

        if(
            lives>0 &&
            document.getElementById(
                "game"
            ).style.display!=="none"
        ){

            running=true;

        }

    },350);

}


/* =====================================================
   INICIAR
===================================================== */

function startGame(){

    initAudio();

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "game"
    ).style.display="block";

    document.getElementById(
        "gameOver"
    ).style.display="none";


    reset();

    running=false;

    started=false;


    document.getElementById(
        "tapStart"
    ).style.display="block";

}


/* =====================================================
   VOLTAR AO MENU
===================================================== */

function backToMenu(){

    running=false;

    started=false;

    document.getElementById(
        "game"
    ).style.display="none";

    document.getElementById(
        "gameOver"
    ).style.display="none";


    updateMenu();


    document.getElementById(
        "menu"
    ).style.display="flex";

}


/* =====================================================
   TOQUE
===================================================== */

function touchGame(e){

    if(
        e.target &&
        e.target.closest &&
        e.target.closest("button")
    )
        return;


    initAudio();


    if(!started){

        started=true;

        running=true;


        document.getElementById(
            "tapStart"
        ).style.display="none";


        jump();

        return;

    }


    jump();

}


/* =====================================================
   PULO + LATIDO
===================================================== */

function jump(){

    if(!running)
        return;


    if(player.grounded){

        player.vy=-13;

        player.grounded=false;


        /*
           🐺 LATIDO!
        */

        bark();

    }

}


/* =====================================================
   VIDAS
===================================================== */

function updateLives(){

    let hearts="";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts+=
        i<lives
        ? "❤️"
        : "🖤";

    }


    document.getElementById(
        "lives"
    ).textContent=hearts;

}


/* =====================================================
   COLISÃO
===================================================== */

function hitObstacle(index){

    if(hitCooldown)
        return;


    hitCooldown=true;


    /*
       O obstáculo NÃO desaparece.
    */


    lives--;

    updateLives();


    player.vy=-7;


    if(lives<=0){

        gameOver();

        return;

    }


    /*
       3 → 2 → 1

       A velocidade permanece igual.
    */

    restartAfterHit();


    setTimeout(()=>{

        hitCooldown=false;

    },550);

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function spawnObstacle(){

    let types;


    if(level===1){

        types=[
            "spike",
            "spike",
            "rock",
            "box",
            "doubleSpike"
        ];

    }else if(level===2){

        types=[
            "cactus",
            "cactus",
            "rock",
            "doubleCactus",
            "box"
        ];

    }else{

        types=[
            "lavaRock",
            "spike",
            "rock",
            "doubleSpike"
        ];

    }


    const type=
    types[
        Math.floor(
            Math.random()*
            types.length
        )
    ];


    let w=50;
    let h=50;


    if(type==="doubleSpike")
        w=90;


    if(type==="cactus"){

        w=42;
        h=65;

    }


    if(type==="doubleCactus"){

        w=85;
        h=65;

    }


    if(type==="lavaRock"){

        w=60;
        h=55;

    }


    obstacles.push({

        x:W+70,

        y:H-65-h,

        w:w,

        h:h,

        type:type

    });

}


/* =====================================================
   BOSTINHA
===================================================== */

function spawnPoop(){

    poops.push({

        x:W+50,

        y:
        H-155-
        Math.random()*120,

        r:16

    });

}


/* =====================================================
   FUNDO
===================================================== */

function background(){

    let sky=
    ctx.createLinearGradient(
        0,0,0,H
    );


    if(level===1){

        sky.addColorStop(
            0,
            "#4eacd4"
        );

        sky.addColorStop(
            1,
            "#d7f2ff"
        );

    }


    if(level===2){

        sky.addColorStop(
            0,
            "#e8914e"
        );

        sky.addColorStop(
            1,
            "#ffe0a1"
        );

    }


    if(level===3){

        sky.addColorStop(
            0,
            "#251015"
        );

        sky.addColorStop(
            1,
            "#d34b32"
        );

    }


    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle=
        level===3
        ? "#ff5938"
        : level===2
        ? "#ffd36b"
        : "#fff0a0";


    ctx.beginPath();

    ctx.arc(
        W-85,
        82,
        43,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* FLORESTA */

    if(level===1){

        for(
            let i=0;
            i<9;
            i++
        ){

            const x=
            i*160-
            (
                (
                    performance.now()
                    /35
                    *speed
                )%160
            );


            ctx.fillStyle="#345531";

            ctx.fillRect(
                x-6,
                H-135,
                12,
                70
            );


            ctx.beginPath();

            ctx.arc(
                x,
                H-145,
                40,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* DESERTO */

    if(level===2){

        for(
            let i=0;
            i<7;
            i++
        ){

            const x=
            i*210-
            (
                (
                    performance.now()
                    /45
                    *speed
                )%210
            );


            ctx.fillStyle="#a66a38";

            ctx.fillRect(
                x-5,
                H-135,
                10,
                70
            );


            ctx.fillStyle="#50743b";

            ctx.beginPath();

            ctx.arc(
                x,
                H-140,
                25,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* VULCÃO */

    if(level===3){

        for(
            let i=0;
            i<5;
            i++
        ){

            let x=i*270;

            ctx.fillStyle="#431c20";

            ctx.beginPath();

            ctx.moveTo(
                x,
                H-65
            );

            ctx.lineTo(
                x+100,
                H-220
            );

            ctx.lineTo(
                x+200,
                H-65
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* CHÃO */

    ctx.fillStyle=
        level===1
        ? "#456d37"
        : level===2
        ? "#c99751"
        : "#352426";


    ctx.fillRect(
        0,
        H-65,
        W,
        65
    );


    ctx.fillStyle=
        level===3
        ? "#ff5b32"
        : level===2
        ? "#e0ac62"
        : "#2e4b28";


    ctx.fillRect(
        0,
        H-65,
        W,
        7
    );

}


/* =====================================================
   LOBO
===================================================== */

function drawPlayer(){

    const x=player.x;
    const y=player.y;


    legAnimation+=0.23;


    const leg1=
    Math.sin(
        legAnimation
    )*6;


    const leg2=
    Math.sin(
        legAnimation+
        Math.PI
    )*6;


    /* CAUDA */

    ctx.strokeStyle="#20252a";

    ctx.lineWidth=10;

    ctx.lineCap="round";


    ctx.beginPath();

    ctx.moveTo(
        x+9,
        y+36
    );

    ctx.quadraticCurveTo(
        x-13,
        y+20,
        x-5,
        y+2
    );

    ctx.stroke();


    /* PERNA 1 */

    ctx.strokeStyle="#15191d";

    ctx.lineWidth=9;


    ctx.beginPath();

    ctx.moveTo(
        x+17,
        y+48
    );

    ctx.lineTo(
        x+14+leg1,
        y+65
    );

    ctx.stroke();


    /* PERNA 2 */

    ctx.beginPath();

    ctx.moveTo(
        x+43,
        y+48
    );

    ctx.lineTo(
        x+43+leg2,
        y+65
    );

    ctx.stroke();


    /* CORPO */

    let body=
    ctx.createLinearGradient(
        x,
        y,
        x+60,
        y+55
    );


    body.addColorStop(
        0,
        "#737b81"
    );

    body.addColorStop(
        .5,
        "#3d444a"
    );

    body.addColorStop(
        1,
        "#15191d"
    );


    ctx.fillStyle=body;


    ctx.beginPath();

    ctx.ellipse(
        x+31,
        y+37,
        32,
        21,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CABEÇA */

    ctx.fillStyle="#555d63";


    ctx.beginPath();

    ctx.ellipse(
        x+46,
        y+18,
        25,
        26,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ORELHA ESQUERDA */

    ctx.fillStyle="#252b30";


    ctx.beginPath();

    ctx.moveTo(
        x+27,
        y+5
    );

    ctx.lineTo(
        x+29,
        y-18
    );

    ctx.lineTo(
        x+42,
        y+5
    );

    ctx.closePath();

    ctx.fill();


    /* ORELHA DIREITA */

    ctx.beginPath();

    ctx.moveTo(
        x+49,
        y+4
    );

    ctx.lineTo(
        x+64,
        y-18
    );

    ctx.lineTo(
        x+67,
        y+11
    );

    ctx.closePath();

    ctx.fill();


    /* FOCINHO */

    ctx.fillStyle="#777d81";


    ctx.beginPath();

    ctx.ellipse(
        x+53,
        y+29,
        17,
        11,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* NARIZ */

    ctx.fillStyle="#050505";


    ctx.beginPath();

    ctx.ellipse(
        x+61,
        y+27,
        7,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* OLHOS */

    ctx.fillStyle="#ff1111";

    ctx.shadowColor="red";

    ctx.shadowBlur=8;


    ctx.beginPath();

    ctx.arc(
        x+38,
        y+16,
        3.8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+54,
        y+16,
        3.8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;

}


/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacle(o){

    /* ESPINHOS */

    if(
        o.type==="spike" ||
        o.type==="doubleSpike"
    ){

        const count=
        o.type==="doubleSpike"
        ? 2
        : 1;


        for(
            let i=0;
            i<count;
            i++
        ){

            const sx=
            o.x+i*44;


            ctx.fillStyle="#191d20";


            ctx.beginPath();

            ctx.moveTo(
                sx,
                o.y+o.h
            );

            ctx.lineTo(
                sx+22,
                o.y
            );

            ctx.lineTo(
                sx+44,
                o.y+o.h
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* CACTOS */

    else if(
        o.type==="cactus" ||
        o.type==="doubleCactus"
    ){

        const count=
        o.type==="doubleCactus"
        ? 2
        : 1;


        for(
            let i=0;
            i<count;
            i++
        ){

            const cx=
            o.x+i*43;


            ctx.fillStyle="#3f783c";


            ctx.beginPath();

            ctx.roundRect(
                cx+13,
                o.y,
                16,
                o.h,
                8
            );

            ctx.fill();


            ctx.fillRect(
                cx+3,
                o.y+22,
                13,
                9
            );

            ctx.fillRect(
                cx+3,
                o.y+13,
                8,
                18
            );


            ctx.fillRect(
                cx+26,
                o.y+32,
                13,
                9
            );

            ctx.fillRect(
                cx+31,
                o.y+20,
                8,
                20
            );

        }

    }


    /* PEDRA */

    else if(o.type==="rock"){

        const grad=
        ctx.createRadialGradient(
            o.x+17,
            o.y+13,
            2,
            o.x+25,
            o.y+28,
            30
        );


        grad.addColorStop(
            0,
            "#858b8e"
        );

        grad.addColorStop(
            1,
            "#30353a"
        );


        ctx.fillStyle=grad;


        ctx.beginPath();

        ctx.arc(
            o.x+25,
            o.y+28,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* LAVA */

    else if(o.type==="lavaRock"){

        ctx.fillStyle="#461d1d";


        ctx.beginPath();

        ctx.arc(
            o.x+30,
            o.y+28,
            29,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#ff552f";

        ctx.lineWidth=4;

        ctx.stroke();

    }


    /* CAIXA */

    else{

        ctx.fillStyle="#67422c";

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );


        ctx.strokeStyle="#29170e";

        ctx.lineWidth=3;

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

    }

}


/* =====================================================
   BOSTINHA
===================================================== */

function drawPoop(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    ctx.fillStyle="#75431f";


    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        17,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        13,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        -5,
        -7,
        9,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        5,
        -14,
        7,
        Math.PI,
        0
    );

    ctx.fill();


    ctx.fillStyle="#b97943";


    ctx.beginPath();

    ctx.arc(
        -5,
        -7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    const marginX=8;
    const marginY=6;


    return(
        a.x+marginX <
        b.x+b.w &&

        a.x+a.w-marginX >
        b.x &&

        a.y+marginY <
        b.y+b.h &&

        a.y+a.h-marginY >
        b.y
    );

}


/* =====================================================
   PASSAR DE MAPA
===================================================== */

function checkLevel(){

    if(poopCount<10)
        return;


    if(level<3){

        const next=
        level+1;


        if(next>unlockedMap){

            unlockedMap=next;

            localStorage.setItem(
                "liliUnlockedMap",
                unlockedMap
            );

        }


        if(
            level===1 &&
            unlockedCharacters<2
        ){

            unlockedCharacters=2;

            localStorage.setItem(
                "liliUnlockedCharacters",
                unlockedCharacters
            );

        }


        if(
            level===2 &&
            unlockedCharacters<3
        ){

            unlockedCharacters=3;

            localStorage.setItem(
                "liliUnlockedCharacters",
                unlockedCharacters
            );

        }


        poopCount=0;

        level++;


        /*
           Só aqui a velocidade muda.
        */

        speed=
            level===2
            ? 5.5
            : 6;


        document.getElementById(
            "poop"
        ).textContent=0;


        document.getElementById(
            "level"
        ).textContent=level;


        obstacles=[];
        poops=[];


        obstacleTimer=100;
        poopTimer=50;


    }else{

        alert(
            "🏆 PARABÉNS!\n\n"+
            "VOCÊ ZEROU O LILO O CAGÃO!"
        );


        backToMenu();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;

    document.getElementById(
        "finalLevel"
    ).textContent=level;

    document.getElementById(
        "finalPoop"
    ).textContent=poopCount;

    document.getElementById(
        "gameOver"
    ).style.display="flex";

}


/* =====================================================
   LOOP ÚNICO
===================================================== */

function loop(){

    if(
        document.getElementById(
            "game"
        ).style.display!=="none"
    ){

        ctx.clearRect(
            0,
            0,
            W,
            H
        );


        background();


        if(
            started &&
            running
        ){

            /* ================= FÍSICA ================= */

            player.vy+=0.65;

            player.y+=player.vy;


            if(
                player.y>=H-130
            ){

                player.y=H-130;

                player.vy=0;

                player.grounded=true;

            }


            /* ================= OBSTÁCULOS ================= */

            obstacleTimer--;


            if(
                obstacleTimer<=0
            ){

                spawnObstacle();


                obstacleTimer=
                Math.max(
                    58,
                    110-level*4
                );

            }


            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=
                obstacles[i];


                /*
                   UMA ÚNICA VELOCIDADE.
                */

                o.x-=speed;


                drawObstacle(o);


                if(
                    collision(
                        player,
                        o
                    )
                ){

                    hitObstacle(i);

                    break;

                }

            }


            /*
               Obstáculo só desaparece
               quando realmente sai da tela.
            */

            obstacles=
            obstacles.filter(
                o=>o.x>-150
            );


            /* ================= BOSTINHAS ================= */

            poopTimer--;


            if(
                poopTimer<=0
            ){

                spawnPoop();


                poopTimer=
                70+
                Math.random()*60;

            }


            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=
                poops[i];


                p.x-=speed;


                drawPoop(p);


                const box={

                    x:p.x-p.r,

                    y:p.y-p.r,

                    w:p.r*2,

                    h:p.r*2

                };


                if(
                    collision(
                        player,
                        box
                    )
                ){

                    poops.splice(
                        i,
                        1
                    );


                    poopCount++;


                    document.getElementById(
                        "poop"
                    ).textContent=
                    poopCount;


                    checkLevel();

                }

            }


            poops=
            poops.filter(
                p=>p.x>-60
            );

        }


        drawPlayer();

    }


    /*
       ESTE É O ÚNICO LOOP.
       Ele nunca é chamado novamente
       por reset ou perda de vida.
    */

    requestAnimationFrame(loop);

}


/* =====================================================
   BOTÕES
===================================================== */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "game"
).addEventListener(
    "pointerdown",
    touchGame
);


document.getElementById(
    "homeButton"
).addEventListener(
    "click",
    backToMenu
);


document.getElementById(
    "restart"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "gameOver"
        ).style.display="none";


        reset();


        started=false;

        running=false;


        document.getElementById(
            "tapStart"
        ).style.display="block";

    }
);


document.getElementById(
    "overMenu"
).addEventListener(
    "click",
    backToMenu
);


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp"
        ){

            e.preventDefault();


            if(
                document.getElementById(
                    "game"
                ).style.display!=="none"
            ){

                touchGame(e);

            }

        }

    }
);


/* =====================================================
   INICIA O ÚNICO LOOP DO JOGO
===================================================== */

requestAnimationFrame(loop);

</script>
