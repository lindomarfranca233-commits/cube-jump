<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NEW DARK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050509;
  font-family:Arial,sans-serif;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  background:linear-gradient(145deg,#05050d,#17172d);
}

.screen h1{
  font-size:52px;
  letter-spacing:8px;
  margin-bottom:8px;
  text-shadow:0 0 25px #8aa;
}

.screen p{
  opacity:.75;
  margin-bottom:25px;
}

button{
  border:0;
  padding:14px 30px;
  margin:6px;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  background:#fff;
  color:#111;
}

button:active{
  transform:scale(.94);
}

#menu,
#characters,
#gameOver,
#phaseMessage{
  display:none;
}

#menu{
  display:flex;
}

#hud{
  display:none;
  position:fixed;
  z-index:10;
  top:12px;
  left:12px;
  right:12px;
  justify-content:space-between;
  color:white;
  font-weight:bold;
  font-size:18px;
  text-shadow:0 2px 5px #000;
}

#settingsBtn{
  position:fixed;
  right:12px;
  top:48px;
  z-index:11;
  display:none;
  padding:8px 12px;
  font-size:15px;
}

.characterGrid{
  display:flex;
  gap:10px;
  margin:15px;
  flex-wrap:wrap;
  justify-content:center;
}

.character{
  width:105px;
  height:135px;
  border-radius:16px;
  background:#202038;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border:2px solid transparent;
}

.character.selected{
  border-color:white;
}

.character.locked{
  opacity:.35;
}

.character .emoji{
  font-size:55px;
  margin-bottom:7px;
}

.small{
  font-size:13px;
  opacity:.7;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <span id="phaseText">FASE 1</span>
  <span id="starText">⭐ 0/10</span>
</div>

<button id="settingsBtn" onclick="openSettings()">⚙️</button>

<div id="menu" class="screen">
  <h1>NEW DARK</h1>
  <p>Corra • Pule • Sobreviva</p>
  <button onclick="startGame()">▶ JOGAR</button>
  <button onclick="showCharacters()">🐶 PERSONAGENS</button>
  <button onclick="openSettings()">⚙️ CONFIGURAÇÕES</button>
</div>

<div id="characters" class="screen">
  <h2>PERSONAGENS</h2>
  <p>Desbloqueie novos personagens passando as fases.</p>

  <div class="characterGrid" id="characterGrid"></div>

  <button onclick="hideCharacters()">VOLTAR</button>
</div>

<div id="gameOver" class="screen">
  <h1>💥 FIM DE JOGO</h1>
  <p>Você bateu em um obstáculo.</p>
  <button onclick="restartGame()">🔄 REINICIAR</button>
  <button onclick="backToMenu()">🏠 MENU</button>
</div>

<div id="phaseMessage" class="screen">
  <h1 id="phaseTitle"></h1>
  <p id="phaseDescription"></p>
  <button id="phaseButton" onclick="continueGame()">CONTINUAR</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
}

addEventListener("resize",resize);
resize();

let gameRunning=false;
let phase=1;
let stars=0;
let frame=0;
let speed=5;
let selectedCharacter=0;
let unlocked=1;

let obstacles=[];
let starsList=[];
let clouds=[];
let spaceStars=[];

const characters=[
  {name:"Cachorro",emoji:"🐶",color:"#9b7654"},
  {name:"Gato",emoji:"🐱",color:"#777"},
  {name:"Lobo",emoji:"🐺",color:"#777f8d"}
];

const player={
  x:80,
  y:0,
  w:64,
  h:55,
  vy:0,
  grounded:false,
  animation:0
};

function ground(){
  return H-90;
}

function resetPlayer(){
  player.y=ground()-player.h;
  player.vy=0;
  player.grounded=true;
}

function startGame(){

  hideAllScreens();

  document.getElementById("hud").style.display="flex";
  document.getElementById("settingsBtn").style.display="block";

  phase=1;
  stars=0;
  frame=0;
  speed=5;

  obstacles=[];
  starsList=[];
  clouds=[];
  spaceStars=[];

  resetPlayer();

  gameRunning=true;

  updateHUD();
}

function restartGame(){

  hideAllScreens();

  stars=0;
  frame=0;

  obstacles=[];
  starsList=[];

  resetPlayer();

  gameRunning=true;

  document.getElementById("hud").style.display="flex";
  document.getElementById("settingsBtn").style.display="block";

  updateHUD();
}

function hideAllScreens(){

  document.querySelectorAll(".screen").forEach(e=>{
    e.style.display="none";
  });
}

function backToMenu(){

  gameRunning=false;

  hideAllScreens();

  document.getElementById("hud").style.display="none";
  document.getElementById("settingsBtn").style.display="none";

  document.getElementById("menu").style.display="flex";
}

function showCharacters(){

  hideAllScreens();

  const grid=document.getElementById("characterGrid");
  grid.innerHTML="";

  characters.forEach((c,i)=>{

    const div=document.createElement("div");

    div.className="character "+
      (i>=unlocked?"locked ":"")+
      (i===selectedCharacter?"selected":"");

    div.innerHTML=`
      <div class="emoji">${i<unlocked?c.emoji:"🔒"}</div>
      <b>${i<unlocked?c.name:"Bloqueado"}</b>
      <span class="small">
      ${i<unlocked?"TOCAR PARA USAR":"Complete uma fase"}
      </span>
    `;

    if(i<unlocked){
      div.onclick=()=>{
        selectedCharacter=i;
        showCharacters();
      };
    }

    grid.appendChild(div);
  });

  document.getElementById("characters").style.display="flex";
}

function hideCharacters(){
  hideAllScreens();
  document.getElementById("menu").style.display="flex";
}

function openSettings(){

  gameRunning=false;

  document.getElementById("phaseTitle").textContent="⚙️ CONFIGURAÇÕES";

  document.getElementById("phaseDescription").textContent=
    "O que você deseja fazer?";

  const btn=document.getElementById("phaseButton");

  btn.textContent="🔄 REINICIAR JOGO";
  btn.onclick=restartGame;

  document.getElementById("phaseMessage").style.display="flex";

  const old=document.getElementById("settingsExtra");

  if(old)old.remove();

  const menuBtn=document.createElement("button");

  menuBtn.id="settingsExtra";
  menuBtn.textContent="🏠 VOLTAR AO MENU";
  menuBtn.onclick=backToMenu;

  document.getElementById("phaseMessage").appendChild(menuBtn);
}

function updateHUD(){

  document.getElementById("phaseText").textContent=
    "FASE "+phase;

  document.getElementById("starText").textContent=
    "⭐ "+stars+"/10";
}

function jump(){

  if(gameRunning && player.grounded){

    player.vy=-12;
    player.grounded=false;
  }
}

addEventListener("pointerdown",e=>{
  if(
    e.target.tagName!=="BUTTON" &&
    e.target.closest(".character")===null
  ){
    jump();
  }
});

addEventListener("keydown",e=>{
  if(e.code==="Space" || e.code==="ArrowUp"){
    jump();
  }
});

function spawnObstacle(){

  let type;

  if(phase===1){
    type="spike";
  }

  if(phase===2){
    type=Math.random()<.5?"hole":"block";
  }

  if(phase===3){
    const r=Math.random();

    if(r<.33)type="rock";
    else if(r<.66)type="laser";
    else type="double";
  }

  obstacles.push({
    x:W+60,
    type:type,
    w:type==="laser"?25:55,
    h:type==="laser"?120:50
  });
}

function spawnStar(){

  starsList.push({
    x:W+30,
    y:ground()-80-Math.random()*120,
    r:9,
    rotation:0,
    collected:false
  });
}

function update(){

  if(!gameRunning)return;

  frame++;

  player.animation+=.22;

  // física do personagem
  player.vy+=.55;
  player.y+=player.vy;

  if(player.y+player.h>=ground()){

    player.y=ground()-player.h;
    player.vy=0;
    player.grounded=true;
  }

  // velocidade
  speed=
    phase===1?5:
    phase===2?6:
    7.2;

  let rate=
    phase===1?105:
    phase===2?90:
    68;

  if(frame%rate===0){
    spawnObstacle();
  }

  if(frame%82===0){
    spawnStar();
  }

  obstacles.forEach(o=>{
    o.x-=speed;
  });

  starsList.forEach(s=>{
    s.x-=speed;
    s.rotation+=.08;
  });

  // colisões
  for(const o of obstacles){

    let rect;

    if(o.type==="spike"){
      rect={
        x:o.x+8,
        y:ground()-o.h+8,
        w:o.w-16,
        h:o.h-8
      };
    }

    else if(o.type==="hole"){
      rect={
        x:o.x+5,
        y:ground()-12,
        w:o.w-10,
        h:20
      };
    }

    else if(o.type==="double"){
      rect={
        x:o.x,
        y:ground()-o.h,
        w:o.w,
        h:o.h
      };
    }

    else{
      rect={
        x:o.x,
        y:ground()-o.h,
        w:o.w,
        h:o.h
      };
    }

    if(
      player.x<rect.x+rect.w &&
      player.x+player.w>rect.x &&
      player.y<rect.y+rect.h &&
      player.y+player.h>rect.y
    ){
      loseGame();
      return;
    }
  }

  // estrelas
  for(const s of starsList){

    if(s.collected)continue;

    const dx=
      s.x-(player.x+player.w/2);

    const dy=
      s.y-(player.y+player.h/2);

    if(Math.sqrt(dx*dx+dy*dy)<35){

      s.collected=true;
      stars++;

      updateHUD();

      if(stars>=10){

        completePhase();
        return;
      }
    }
  }

  obstacles=
    obstacles.filter(o=>o.x>-120);

  starsList=
    starsList.filter(s=>s.x>-50&&!s.collected);
}

function loseGame(){

  gameRunning=false;

  document.getElementById("hud").style.display="none";
  document.getElementById("settingsBtn").style.display="none";

  document.getElementById("gameOver").style.display="flex";
}

function completePhase(){

  gameRunning=false;

  if(phase<3){

    unlocked=Math.max(unlocked,phase+1);

    document.getElementById("phaseTitle").textContent=
      "⭐ FASE "+phase+" COMPLETA!";

    document.getElementById("phaseDescription").textContent=
      "Você desbloqueou um novo personagem!";

    document.getElementById("phaseButton").textContent=
      "🚀 PRÓXIMA FASE";

    document.getElementById("phaseButton").onclick=continueGame;

  }else{

    unlocked=3;

    document.getElementById("phaseTitle").textContent=
      "🏆 NEW DARK COMPLETO!";

    document.getElementById("phaseDescription").textContent=
      "Você venceu todas as 3 fases!";

    document.getElementById("phaseButton").textContent=
      "🔄 JOGAR NOVAMENTE";

    document.getElementById("phaseButton").onclick=restartGame;
  }

  document.getElementById("phaseMessage").style.display="flex";
}

function continueGame(){

  document.getElementById("phaseMessage").style.display="none";

  phase++;
  stars=0;
  frame=0;

  obstacles=[];
  starsList=[];

  resetPlayer();

  document.getElementById("hud").style.display="flex";
  document.getElementById("settingsBtn").style.display="block";

  updateHUD();

  gameRunning=true;
}

function drawBackground(){

  if(phase===1){

    const gradient=ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#02030d");
    gradient.addColorStop(1,"#191b3a");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // lua
    ctx.fillStyle="#eee";
    ctx.beginPath();
    ctx.arc(W-90,80,35,0,Math.PI*2);
    ctx.fill();

    // estrelas do céu
    for(let i=0;i<45;i++){

      const x=(i*113)%W;
      const y=(i*47)%250;

      ctx.fillStyle="#ffffff";
      ctx.globalAlpha=.35+(i%3)/4;

      ctx.beginPath();
      ctx.arc(x,y,1.5,0,Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha=1;
  }

  if(phase===2){

    const gradient=ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#55bdf5");
    gradient.addColorStop(1,"#e8faff");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // sol
    ctx.fillStyle="#ffe27a";
    ctx.beginPath();
    ctx.arc(W-85,80,42,0,Math.PI*2);
    ctx.fill();

    // montanhas
    ctx.fillStyle="#75a878";

    ctx.beginPath();
    ctx.moveTo(0,ground());
    ctx.lineTo(130,260);
    ctx.lineTo(260,ground());
    ctx.lineTo(400,230);
    ctx.lineTo(570,ground());
    ctx.lineTo(W,220);
    ctx.lineTo(W,ground());
    ctx.fill();

    // nuvens em movimento
    for(let i=0;i<5;i++){

      let x=(i*230-(frame*.35))%W;

      if(x<0)x+=W;

      let y=80+(i%3)*65;

      ctx.fillStyle="#ffffffaa";

      ctx.beginPath();
      ctx.arc(x,y,22,0,Math.PI*2);
      ctx.arc(x+28,y-7,28,0,Math.PI*2);
      ctx.arc(x+58,y,20,0,Math.PI*2);
      ctx.fill();
    }
  }

  if(phase===3){

    ctx.fillStyle="#010108";
    ctx.fillRect(0,0,W,H);

    // estrelas do espaço em movimento
    for(let i=0;i<100;i++){

      let x=(i*97-frame*(.3+(i%4)*.15))%W;

      if(x<0)x+=W;

      let y=(i*53)%H;

      ctx.fillStyle="#fff";

      ctx.beginPath();
      ctx.arc(x,y,(i%3)+1,0,Math.PI*2);
      ctx.fill();
    }

    // planeta
    ctx.fillStyle="#394dff";
    ctx.beginPath();
    ctx.arc(W-100,120,58,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#aaaaff";
    ctx.lineWidth=8;

    ctx.beginPath();
    ctx.ellipse(W-100,120,85,22,-.25,0,Math.PI*2);
    ctx.stroke();
  }

  // chão
  ctx.fillStyle=
    phase===3?"#141429":
    phase===2?"#42633d":
    "#24243a";

  ctx.fillRect(0,ground(),W,H-ground());

  ctx.fillStyle="#666";

  ctx.fillRect(0,ground(),W,4);
}

function drawPlayer(){

  ctx.save();

  ctx.translate(player.x,player.y);

  const bob=
    player.grounded?
    Math.sin(player.animation)*2:
    0;

  ctx.translate(0,bob);

  const c=characters[selectedCharacter];

  // corpo
  ctx.fillStyle=c.color;

  ctx.beginPath();
  ctx.ellipse(32,34,28,19,0,0,Math.PI*2);
  ctx.fill();

  // cabeça
  ctx.beginPath();
  ctx.arc(51,21,20,0,Math.PI*2);
  ctx.fill();

  // orelhas
  ctx.fillStyle=
    selectedCharacter===1?"#555":
    "#65452f";

  ctx.beginPath();
  ctx.moveTo(38,8);
  ctx.lineTo(35,-9);
  ctx.lineTo(48,3);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(58,5);
  ctx.lineTo(70,-8);
  ctx.lineTo(67,13);
  ctx.fill();

  // focinho
  ctx.fillStyle=
    selectedCharacter===1?"#999":
    "#b48767";

  ctx.beginPath();
  ctx.ellipse(63,26,12,9,0,0,Math.PI*2);
  ctx.fill();

  // nariz
  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(71,24,4,0,Math.PI*2);
  ctx.fill();

  // olho
  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(56,17,3,0,Math.PI*2);
  ctx.fill();

  // pernas animadas
  const leg=Math.sin(player.animation)*5;

  ctx.fillStyle=c.color;

  ctx.save();
  ctx.translate(16,43);
  ctx.rotate(leg*.03);
  ctx.fillRect(0,0,9,15);
  ctx.restore();

  ctx.save();
  ctx.translate(40,43);
  ctx.rotate(-leg*.03);
  ctx.fillRect(0,0,9,15);
  ctx.restore();

  // cauda animada
  ctx.strokeStyle=c.color;
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();

  const tail=
    Math.sin(player.animation)*.3;

  ctx.moveTo(9,30);
  ctx.quadraticCurveTo(
    -10,
    8+tail*20,
    5,
    2
  );

  ctx.stroke();

  ctx.restore();
}

function drawObstacles(){

  obstacles.forEach(o=>{

    const y=ground()-o.h;

    if(o.type==="spike"){

      const g=ctx.createLinearGradient(
        o.x,y,o.x,y+o.h
      );

      g.addColorStop(0,"#ffffff");
      g.addColorStop(1,"#777");

      ctx.fillStyle=g;

      ctx.beginPath();
      ctx.moveTo(o.x,y+o.h);
      ctx.lineTo(o.x+o.w/2,y);
      ctx.lineTo(o.x+o.w,y+o.h);
      ctx.closePath();
      ctx.fill();
    }

    if(o.type==="hole"){

      ctx.fillStyle="#050505";

      ctx.beginPath();
      ctx.ellipse(
        o.x+o.w/2,
        ground()+3,
        o.w/2,
        22,
        0,0,Math.PI*2
      );
      ctx.fill();
    }

    if(o.type==="block"){

      ctx.fillStyle="#714c31";

      ctx.fillRect(
        o.x,
        y+15,
        o.w,
        o.h-15
      );

      ctx.fillStyle="#9a704c";

      ctx.beginPath();
      ctx.moveTo(o.x,y+15);
      ctx.lineTo(o.x+15,y);
      ctx.lineTo(o.x+o.w,y);
      ctx.lineTo(o.x+o.w,y+15);
      ctx.fill();
    }

    if(o.type==="rock"){

      ctx.fillStyle="#707080";

      ctx.beginPath();
      ctx.moveTo(o.x,y+o.h);
      ctx.lineTo(o.x+10,y+18);
      ctx.lineTo(o.x+30,y);
      ctx.lineTo(o.x+48,y+15);
      ctx.lineTo(o.x+o.w,y+o.h);
      ctx.closePath();
      ctx.fill();
    }

    if(o.type==="laser"){

      ctx.fillStyle="#555";

      ctx.fillRect(
        o.x,
        y,
        o.w,
        o.h
      );

      ctx.fillStyle="#ff3344";

      ctx.fillRect(
        o.x+7,
        y,
        o.w-14,
        o.h
      );
    }

    if(o.type==="double"){

      ctx.fillStyle="#eee";

      ctx.beginPath();
      ctx.moveTo(o.x,y+o.h);
      ctx.lineTo(o.x+18,y);
      ctx.lineTo(o.x+35,y+o.h);
      ctx.lineTo(o.x+50,y);
      ctx.lineTo(o.x+o.w,y+o.h);
      ctx.closePath();
      ctx.fill();
    }
  });
}

function drawStars(){

  starsList.forEach(s=>{

    if(s.collected)return;

    ctx.save();

    ctx.translate(s.x,s.y);
    ctx.rotate(s.rotation);

    // estrela SEM RASTRO DE LUZ
    ctx.fillStyle="#ffd83d";

    ctx.beginPath();

    for(let i=0;i<10;i++){

      const angle=i*Math.PI/5-Math.PI/2;
      const radius=i%2===0?s.r:s.r*.42;

      const x=Math.cos(angle)*radius;
      const y=Math.sin(angle)*radius;

      if(i===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.closePath();
    ctx.fill();

    ctx.restore();
  });
}

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawStars();
  drawObstacles();
  drawPlayer();
}

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

resetPlayer();
loop();

</script>

</body>
</html>
