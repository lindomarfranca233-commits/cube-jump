<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>LILO O CAGÃO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050505;
}

button{
    border:0;
    font-family:Arial,sans-serif;
    touch-action:manipulation;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
    radial-gradient(circle,#424b54,#11151a 50%,#020304);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:0 0 10px red,0 0 30px #800000;
}

.loadWolf{
    font-size:90px;
    margin:18px 0;
}

.loadText{
    color:#aaa;
    letter-spacing:4px;
    font-size:13px;
}

#percent{
    font-size:28px;
    font-weight:bold;
    margin:12px;
}

.loadBar{
    width:280px;
    height:13px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

#fill{
    width:0%;
    height:100%;
    background:#e00000;
}

/* MENU */

#menu{
    display:none;
    position:fixed;
    inset:0;
    overflow-y:auto;
    color:white;
    text-align:center;
    padding:25px 12px 40px;
    background:
    radial-gradient(circle at 50% 18%,#59636d,#20272e 40%,#090c10 75%,#020304);
}

.title{
    font-size:45px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:0 0 8px red,0 0 22px #b00000;
}

.sub{
    color:#ccc;
    font-size:12px;
    letter-spacing:3px;
    margin-top:7px;
}

.creator{
    display:inline-block;
    margin:15px auto;
    padding:8px 18px;
    border:1px solid #d22;
    border-radius:20px;
    font-weight:900;
}

.sectionTitle{
    margin:12px 0 9px;
    font-size:17px;
    font-weight:bold;
}

#characters{
    display:flex;
    gap:10px;
    overflow-x:auto;
    max-width:700px;
    margin:auto;
    padding:4px 3px 13px;
}

.char{
    flex:0 0 105px;
    height:130px;
    border:2px solid #454c53;
    border-radius:15px;
    color:white;
    background:linear-gradient(145deg,#3b434a,#0b0e11);
}

.char.selected{
    border-color:#ff2222;
    box-shadow:0 0 12px red;
}

.char.locked{
    opacity:.35;
}

.charIcon{
    display:block;
    font-size:48px;
    margin:7px 0;
}

.charName{
    font-size:11px;
    font-weight:bold;
}

#maps{
    width:100%;
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.map{
    min-height:78px;
    border:2px solid #41474c;
    border-radius:12px;
    color:white;
    background:linear-gradient(145deg,#30373d,#090c0f);
}

.map.selected{
    border-color:#ff2222;
    box-shadow:0 0 12px red;
}

.map.locked{
    opacity:.28;
}

.mapIcon{
    display:block;
    font-size:25px;
    margin:4px;
}

.mapName{
    font-size:10px;
    font-weight:bold;
}

#play{
    margin-top:18px;
    width:285px;
    padding:16px;
    border-radius:13px;
    color:white;
    background:linear-gradient(#b40000,#650000);
    border:2px solid #ff4545;
    font-size:18px;
    font-weight:bold;
}

/* GAME */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ANIMAL */

#wolf{
    position:absolute;
    width:78px;
    height:78px;
    z-index:20;
    pointer-events:none;
}

.animalBody{
    position:absolute;
    left:5px;
    top:34px;
    width:51px;
    height:29px;
    border-radius:60%;
}

.animalHead{
    position:absolute;
    left:35px;
    top:7px;
    width:38px;
    height:40px;
    border-radius:50%;
}

.animalEar{
    position:absolute;
    width:19px;
    height:28px;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.animalEar.one{
    left:37px;
    top:1px;
}

.animalEar.two{
    left:56px;
    top:2px;
}

.animalEye{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ff1717;
    box-shadow:0 0 8px red;
}

.animalEye.one{
    left:51px;
    top:22px;
}

.animalEye.two{
    left:65px;
    top:22px;
}

.animalMuzzle{
    position:absolute;
    left:54px;
    top:30px;
    width:22px;
    height:13px;
    border-radius:50%;
}

.animalNose{
    position:absolute;
    left:70px;
    top:33px;
    width:7px;
    height:6px;
    border-radius:50%;
    background:#050505;
}

.animalTail{
    position:absolute;
    left:0;
    top:24px;
    width:29px;
    height:23px;
    border-top:8px solid;
    border-radius:50%;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    top:56px;
    width:8px;
    height:21px;
    border-radius:8px;
}

.leg1{left:8px}
.leg2{left:21px}
.leg3{left:37px}
.leg4{left:51px}

#wolf.running .leg1,
#wolf.running .leg3{
    animation:run1 .15s infinite alternate;
}

#wolf.running .leg2,
#wolf.running .leg4{
    animation:run2 .15s infinite alternate;
}

@keyframes run1{
    from{transform:rotate(22deg)}
    to{transform:rotate(-22deg)}
}

@keyframes run2{
    from{transform:rotate(-22deg)}
    to{transform:rotate(22deg)}
}

/* CORES */

#wolf.lobo .animalBody{
    background:linear-gradient(145deg,#aeb4b8,#444b50,#17191b);
}
#wolf.lobo .animalHead{
    background:linear-gradient(145deg,#b7bdc0,#50575c,#25292c);
}
#wolf.lobo .animalEar,
#wolf.lobo .animalTail{
    background:#292e32;
    border-color:#292e32;
}
#wolf.lobo .animalMuzzle{background:#777d80}
#wolf.lobo .leg{background:#181b1d}

#wolf.cachorro .animalBody{
    background:linear-gradient(145deg,#d69a59,#8a4d24,#4c2918);
}
#wolf.cachorro .animalHead{
    background:linear-gradient(145deg,#e0aa6d,#95572d,#55301c);
}
#wolf.cachorro .animalEar,
#wolf.cachorro .animalTail{
    background:#63381f;
    border-color:#63381f;
}
#wolf.cachorro .animalMuzzle{background:#b87543}
#wolf.cachorro .leg{background:#4c2918}

#wolf.gato .animalBody{
    background:linear-gradient(145deg,#eee,#9da3a8,#555a60);
}
#wolf.gato .animalHead{
    background:linear-gradient(145deg,#f2f2f2,#a9afb4,#62676c);
}
#wolf.gato .animalEar,
#wolf.gato .animalTail{
    background:#777d82;
    border-color:#777d82;
}
#wolf.gato .animalMuzzle{background:#d1d3d4}
#wolf.gato .leg{background:#5b6064}

#wolf.tigre .animalBody{
    background:linear-gradient(145deg,#f2a52b,#bd6716,#74350e);
}
#wolf.tigre .animalHead{
    background:linear-gradient(145deg,#ffb637,#c8791d,#7a3b10);
}
#wolf.tigre .animalEar,
#wolf.tigre .animalTail{
    background:#63300e;
    border-color:#79380f;
}
#wolf.tigre .animalMuzzle{background:#e5a257}
#wolf.tigre .leg{background:#69320e}

#wolf.leao .animalBody{
    background:linear-gradient(145deg,#dba34b,#a66c27,#6b4019);
}
#wolf.leao .animalHead{
    background:linear-gradient(145deg,#e5b65e,#bd7d2d,#7a4919);
}
#wolf.leao .animalEar,
#wolf.leao .animalTail{
    background:#70451c;
    border-color:#70451c;
}
#wolf.leao .animalMuzzle{background:#d9a45c}
#wolf.leao .leg{background:#70451c}

#wolf.urso .animalBody{
    background:linear-gradient(145deg,#744426,#422617,#20130d);
}
#wolf.urso .animalHead{
    background:linear-gradient(145deg,#87532e,#4b2b1a,#25150e);
}
#wolf.urso .animalEar,
#wolf.urso .animalTail{
    background:#321b10;
    border-color:#392014;
}
#wolf.urso .animalMuzzle{background:#80502d}
#wolf.urso .leg{background:#29170e}

#wolf.dragao .animalBody{
    background:linear-gradient(145deg,#49bd67,#18723a,#073b20);
}
#wolf.dragao .animalHead{
    background:linear-gradient(145deg,#5bd97a,#218649,#0b4727);
}
#wolf.dragao .animalEar,
#wolf.dragao .animalTail{
    background:#0b542d;
    border-color:#0a4c29;
}
#wolf.dragao .animalMuzzle{background:#319957}
#wolf.dragao .leg{background:#07371e}

/* HUD */

#hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:50;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
}

#poopCount{
    color:#d49a61;
}

#home{
    position:absolute;
    top:43px;
    right:10px;
    z-index:60;
    padding:8px 11px;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    color:white;
    border:1px solid white;
}

#tap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:40;
    color:white;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    text-shadow:2px 2px 7px black;
    pointer-events:none;
}

#tap small{
    display:block;
    margin-top:8px;
    font-size:14px;
}

/* GAME OVER */

#gameOver{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(0,0,0,.9);
}

#gameOver h2{
    color:#ff2222;
    font-size:45px;
    margin-bottom:10px;
}

.overBtn{
    margin-top:13px;
    padding:14px 28px;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.restart{
    background:#7c0000;
}

.back{
    background:#333;
}
</style>
</head>

<body>

<div id="loading">
    <div class="logo">LILO O CAGÃO</div>
    <div class="loadWolf">🐺</div>
    <div class="loadText">CARREGANDO</div>
    <div id="percent">0%</div>
    <div class="loadBar">
        <div id="fill"></div>
    </div>
</div>

<div id="menu">

    <div class="title">LILO O CAGÃO</div>

    <div class="sub">
        CORRA • PULE • PEGUE 💩
    </div>

    <div class="creator">
        👑 CRIADOR: LINDAO
    </div>

    <div class="sectionTitle">
        🐾 PERSONAGENS
    </div>

    <div id="characters"></div>

    <div class="sectionTitle">
        🗺️ MAPAS
    </div>

    <div id="maps"></div>

    <button id="play">
        ▶ JOGAR
    </button>

</div>

<div id="game">

<canvas id="canvas"></canvas>

<div id="wolf" class="lobo">

    <div class="animalTail"></div>
    <div class="animalBody"></div>
    <div class="animalHead"></div>

    <div class="animalEar one"></div>
    <div class="animalEar two"></div>

    <div class="animalEye one"></div>
    <div class="animalEye two"></div>

    <div class="animalMuzzle"></div>
    <div class="animalNose"></div>

    <div class="leg leg1"></div>
    <div class="leg leg2"></div>
    <div class="leg leg3"></div>
    <div class="leg leg4"></div>

</div>

<div id="hud">

    <div id="lives">❤️❤️❤️</div>

    <div>
        💩 <span id="poopCount">0</span>/10
    </div>

    <div>
        MAPA <span id="level">1</span>
    </div>

</div>

<button id="home">🏠 INÍCIO</button>

<div id="tap">
    TOQUE PARA COMEÇAR
    <small>Toque para pular</small>
</div>

<div id="gameOver">

    <h2>GAME OVER</h2>

    <div>
        MAPA:
        <span id="finalLevel">1</span>
    </div>

    <div style="margin-top:6px">
        💩:
        <span id="finalPoop">0</span>/10
    </div>

    <button class="overBtn restart" id="restart">
        🔄 JOGAR NOVAMENTE
    </button>

    <button class="overBtn back" id="back">
        🏠 VOLTAR AO INÍCIO
    </button>

</div>

</div>

<script>

/* =====================================================
   DADOS
===================================================== */

const characters=[
    {icon:"🐺",name:"LOBO",unlock:1,css:"lobo"},
    {icon:"🐕",name:"CACHORRO",unlock:5,css:"cachorro"},
    {icon:"🐱",name:"GATO",unlock:10,css:"gato"},
    {icon:"🐯",name:"TIGRE",unlock:15,css:"tigre"},
    {icon:"🦁",name:"LEÃO",unlock:20,css:"leao"},
    {icon:"🐻",name:"URSO",unlock:25,css:"urso"},
    {icon:"🐲",name:"DRAGÃO",unlock:30,css:"dragao"}
];

const mapNames=[
["🏙️","CIDADE"],
["🏜️","DESERTO"],
["🌲","FLORESTA"],
["⛰️","MONTANHA"],
["🏖️","PRAIA"],
["❄️","INVERNO"],
["🌋","VULCÃO"],
["🐊","PÂNTANO"],
["🪨","CAVERNA"],
["🌙","NOITE"],
["🌾","FAZENDA"],
["🌉","PONTE"],
["🏚️","RUÍNAS"],
["🌳","FLORESTA ESCURA"],
["🌆","CIDADE NOTURNA"],
["🏜️","DESERTO VERMELHO"],
["🧊","GELEIRA"],
["🏝️","ILHA"],
["⛈️","TEMPESTADE"],
["🏔️","MONTANHA GELADA"],
["🌃","METRÓPOLE"],
["🌋","VULCÃO ESCURO"],
["🕳️","CAVERNA DE GELO"],
["🌲","FLORESTA NEVADA"],
["🏜️","DESERTO DOURADO"],
["🏖️","PRAIA TROPICAL"],
["❄️","CIDADE CONGELADA"],
["🏚️","CASTELO EM RUÍNAS"],
["🏢","TORRES"],
["👑","MAPA FINAL"]
];

let unlockedMap=
Number(localStorage.getItem("liloUnlockedMap"))||1;

let unlockedCharacters=
Number(localStorage.getItem("liloUnlockedCharacters"))||1;

let selectedMap=1;
let selectedCharacter=0;


/* =====================================================
   LOADING
===================================================== */

let load=0;

const loadingTimer=setInterval(()=>{

    load++;

    document.getElementById("percent").textContent=load+"%";
    document.getElementById("fill").style.width=load+"%";

    if(load>=100){

        clearInterval(loadingTimer);

        setTimeout(()=>{

            document.getElementById("loading").style.display="none";
            document.getElementById("menu").style.display="block";

            buildCharacters();
            buildMaps();

        },300);

    }

},18);


/* =====================================================
   PERSONAGENS
===================================================== */

function buildCharacters(){

    const box=document.getElementById("characters");

    box.innerHTML="";

    characters.forEach((c,index)=>{

        const unlocked=
            index===0 ||
            unlockedCharacters>=c.unlock;

        const btn=document.createElement("button");

        btn.className="char";

        if(index===selectedCharacter && unlocked)
            btn.classList.add("selected");

        if(!unlocked)
            btn.classList.add("locked");

        btn.innerHTML=`
            ${!unlocked?'<span>🔒</span>':''}
            <span class="charIcon">${c.icon}</span>
            <span class="charName">${c.name}</span>
            <br>
            ${unlocked?"DESBLOQUEADO":"MAPA "+c.unlock}
        `;

        btn.addEventListener("click",()=>{

            if(!unlocked)return;

            selectedCharacter=index;

            document.querySelectorAll(".char")
            .forEach(x=>x.classList.remove("selected"));

            btn.classList.add("selected");

        });

        box.appendChild(btn);

    });

}


/* =====================================================
   MAPAS
===================================================== */

function buildMaps(){

    const box=document.getElementById("maps");

    box.innerHTML="";

    mapNames.forEach((m,index)=>{

        const number=index+1;
        const unlocked=number<=unlockedMap;

        const btn=document.createElement("button");

        btn.className="map";

        if(number===selectedMap && unlocked)
            btn.classList.add("selected");

        if(!unlocked)
            btn.classList.add("locked");

        btn.innerHTML=`
            ${!unlocked?'<span>🔒</span>':''}
            <span class="mapIcon">${m[0]}</span>
            <span class="mapName">
                MAPA ${number}<br>${m[1]}
            </span>
        `;

        btn.addEventListener("click",()=>{

            if(!unlocked)return;

            selectedMap=number;

            document.querySelectorAll(".map")
            .forEach(x=>x.classList.remove("selected"));

            btn.classList.add("selected");

        });

        box.appendChild(btn);

    });

}


/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W;
    canvas.height=H;

    if(player){

        player.y=Math.min(
            player.y,
            H-130
        );

    }

}

window.addEventListener("resize",resize);

resize();


/* =====================================================
   ESTADO
===================================================== */

let player=null;
let obstacles=[];
let poops=[];

let started=false;
let running=false;

let lives=3;
let poop=0;
let level=1;

let obstacleTimer=100;
let poopTimer=70;

let invincible=false;

const GAME_SPEED=3.6;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    lives=3;
    poop=0;

    level=selectedMap;

    obstacles=[];
    poops=[];

    obstacleTimer=100;
    poopTimer=70;

    invincible=false;

    player={
        x:35,
        y:H-130,
        width:58,
        height:62,
        vy:0,
        grounded:true
    };

    document.getElementById("level").textContent=level;
    document.getElementById("poopCount").textContent="0";

    updateLives();
    updateWolf();

}


/* =====================================================
   ANIMAL
===================================================== */

function updateAnimal(){

    const animal=document.getElementById("wolf");

    animal.className="";

    const c=characters[selectedCharacter]||characters[0];

    animal.classList.add(c.css);

    if(started && running)
        animal.classList.add("running");

}


/* =====================================================
   POSIÇÃO
===================================================== */

function updateWolf(){

    if(!player)return;

    const animal=document.getElementById("wolf");

    animal.style.left=player.x+"px";
    animal.style.top=player.y+"px";

    updateAnimal();

}


/* =====================================================
   PULO
===================================================== */

function jump(){

    if(!running)return;

    if(!player)return;

    if(!player.grounded)return;

    player.vy=-11.5;
    player.grounded=false;

}


/* =====================================================
   TIPOS DE OBSTÁCULOS
===================================================== */

function getObstacleTypes(){

    const themes={

        1:["car","cone","box"],
        2:["rock","cactus"],
        3:["log","rock","bush"],
        4:["rock","snowrock","log"],
        5:["beachrock","shell","box"],
        6:["snowman","snowrock","ice"],
        7:["lavaRock","rock","fire"],
        8:["water","log","frogrock"],
        9:["rock","crystal"],
        10:["lamp","rock","box"],
        11:["hay","fence","rock"],
        12:["barrel","bridgeRock","box"],
        13:["wall","rock","crate"],
        14:["darktree","rock","log"],
        15:["car","lamp","box"],
        16:["redrock","cactus","rock"],
        17:["ice","snowrock","crystal"],
        18:["shell","palmrock","water"],
        19:["rock","water","lightning"],
        20:["snowman","ice","snowrock"],
        21:["car","barrier","box"],
        22:["lavaRock","fire","rock"],
        23:["crystal","ice","rock"],
        24:["snowtree","snowman","ice"],
        25:["cactus","goldrock","rock"],
        26:["shell","palmrock","log"],
        27:["snowman","ice","snowrock"],
        28:["wall","crate","rock"],
        29:["barrier","box","rock"],
        30:["goldrock","crystal","rock"]

    };

    return themes[level]||["rock","box"];

}


/* =====================================================
   CRIAR OBSTÁCULO
===================================================== */

function spawnObstacle(){

    const types=getObstacleTypes();

    const type=
        types[
            Math.floor(Math.random()*types.length)
        ];

    let width=45;
    let height=40;

    if(type==="snowman"){
        width=46;
        height=55;
    }

    if(type==="cactus"){
        width=38;
        height=52;
    }

    if(type==="water"){
        width=70;
        height=28;
    }

    obstacles.push({

        x:W+70,
        y:H-65-height,
        width,
        height,
        type

    });

}


/* =====================================================
   COCÔ
===================================================== */

function spawnPoop(){

    poops.push({

        x:W+100+Math.random()*120,
        y:H-110-Math.random()*50,
        width:28,
        height:28

    });

}


/* =====================================================
   COLISÃO
===================================================== */

function collision(a,b){

    const ax=a.x+17;
    const ay=a.y+18;
    const aw=a.width-27;
    const ah=a.height-20;

    const bx=b.x+5;
    const by=b.y+5;
    const bw=Math.max(1,b.width-10);
    const bh=Math.max(1,b.height-5);

    return(
        ax<bx+bw &&
        ax+aw>bx &&
        ay<by+bh &&
        ay+ah>by
    );

}

function gradientBackground(a,b){

    const g=ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,a);
    g.addColorStop(1,b);

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

}

/* =====================================================
   OBSTÁCULOS
===================================================== */

function drawObstacle(o){

    const x=o.x;
    const y=o.y;
    const w=o.width;
    const h=o.height;

    /* CARRO */

    if(o.type==="car"){

        ctx.fillStyle="#bd2525";
        ctx.fillRect(x,y+15,w,h-15);

        ctx.fillStyle="#65a4c5";
        ctx.fillRect(x+10,y+5,w-20,18);

        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(x+10,y+h,8,0,Math.PI*2);
        ctx.arc(x+w-10,y+h,8,0,Math.PI*2);
        ctx.fill();

        return;
    }

    /* CONE */

    if(o.type==="cone"){

        ctx.fillStyle="#f07824";

        ctx.beginPath();
        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x,y+h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle="#fff";
        ctx.fillRect(x+8,y+h*.55,w-16,7);

        return;
    }

    /* PEDRAS */

    if([
        "rock","snowrock","beachrock",
        "lavaRock","redrock","goldrock",
        "bridgeRock","palmrock"
    ].includes(o.type)){

        const colors={
            rock:"#666d72",
            snowrock:"#dff6ff",
            beachrock:"#8c7965",
            lavaRock:"#592a20",
            redrock:"#873e30",
            goldrock:"#bd8b2f",
            bridgeRock:"#777",
            palmrock:"#777"
        };

        ctx.fillStyle=colors[o.type]||"#666";

        ctx.beginPath();
        ctx.moveTo(x+5,y+h);
        ctx.lineTo(x+12,y+10);
        ctx.lineTo(x+w*.55,y);
        ctx.lineTo(x+w-4,y+15);
        ctx.lineTo(x+w-8,y+h);
        ctx.closePath();
        ctx.fill();

        return;
    }

    /* CACTO */

    if(o.type==="cactus"){

        ctx.fillStyle="#348b42";

        ctx.fillRect(x+12,y,15,h);
        ctx.fillRect(x,y+18,13,10);
        ctx.fillRect(x,y+8,8,25);
        ctx.fillRect(x+27,y+30,12,10);
        ctx.fillRect(x+31,y+18,8,24);

        return;
    }

    /* TRONCO */

    if(o.type==="log"){

        ctx.fillStyle="#71452a";

        ctx.beginPath();
        ctx.ellipse(x+w/2,y+25,w/2,13,0,0,Math.PI*2);
        ctx.fill();

        return;
    }

    /* ARBUSTOS */

    if(
        o.type==="bush" ||
        o.type==="darktree" ||
        o.type==="snowtree"
    ){

        ctx.fillStyle=
            o.type==="snowtree"
            ? "#d9eef5"
            : o.type==="darktree"
            ? "#193c28"
            : "#2f6d38";

        ctx.beginPath();
        ctx.arc(x+w/2,y+25,28,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#583b23";
        ctx.fillRect(x+w/2-5,y+30,10,h-30);

        return;
    }

    /* BONECO DE NEVE */

    if(o.type==="snowman"){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(x+w/2,y+h-12,18,0,Math.PI*2);
        ctx.arc(x+w/2,y+h-34,14,0,Math.PI*2);
        ctx.arc(x+w/2,y+h-51,10,0,Math.PI*2);

        ctx.fill();

        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(x+17,y+14,2.5,0,Math.PI*2);
        ctx.arc(x+29,y+14,2.5,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#ed7529";

        ctx.beginPath();
        ctx.moveTo(x+w/2,y+20);
        ctx.lineTo(x+w/2+12,y+24);
        ctx.lineTo(x+w/2,y+27);
        ctx.fill();

        return;
    }

    /* GELO / CRISTAL */

    if(o.type==="ice" || o.type==="crystal"){

        ctx.fillStyle=
            o.type==="ice"
            ? "#9be5ff"
            : "#8bc7e8";

        ctx.beginPath();

        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x+w/2,y+h-10);
        ctx.lineTo(x,y+h);
        ctx.closePath();

        ctx.fill();

        return;
    }

    /* FOGO */

    if(o.type==="fire"){

        ctx.fillStyle="#ff641f";

        ctx.beginPath();

        ctx.moveTo(x+w/2,y);
        ctx.lineTo(x+w,y+h);
        ctx.lineTo(x+w*.55,y+h-10);
        ctx.lineTo(x+w*.35,y+h);
        ctx.closePath();

        ctx.fill();

        return;
    }

    /* ÁGUA */

    if(o.type==="water"){

        ctx.fillStyle="#2f8995";

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;
    }

    /* CERCA */

    if(o.type==="fence"){

        ctx.fillStyle="#8b633d";

        ctx.fillRect(x,y+10,w,8);
        ctx.fillRect(x,y+30,w,8);
        ctx.fillRect(x+5,y,7,h);
        ctx.fillRect(x+w-12,y,7,h);

        return;
    }

    /* FENO */

    if(o.type==="hay"){

        ctx.fillStyle="#c7a348";
        ctx.fillRect(x,y,w,h);

        return;
    }

    /* PAREDE */

    if(o.type==="wall"){

        ctx.fillStyle="#625e58";
        ctx.fillRect(x,y,w,h);

        return;
    }

    /* CAIXA */

    if(o.type==="box" || o.type==="crate"){

        ctx.fillStyle="#875b31";
        ctx.fillRect(x,y,w,h);

        ctx.strokeStyle="#d29a54";
        ctx.lineWidth=3;
        ctx.strokeRect(x+3,y+3,w-6,h-6);

        return;
    }

    /* BARREIRA */

    if(o.type==="barrier"){

        ctx.fillStyle="#edb52e";

        ctx.fillRect(x,y+12,w,10);
        ctx.fillRect(x,y+30,w,10);

        ctx.fillStyle="#555";

        ctx.fillRect(x+5,y+5,7,h);
        ctx.fillRect(x+w-12,y+5,7,h);

        return;
    }

    /* FAROL */

    if(o.type==="lamp"){

        ctx.fillStyle="#30343a";
        ctx.fillRect(x+w/2-4,y+15,8,h);

        ctx.fillStyle="#f4df74";

        ctx.beginPath();
        ctx.arc(x+w/2,y+10,12,0,Math.PI*2);
        ctx.fill();

        return;
    }

    /* BARRIL */

    if(o.type==="barrel"){

        ctx.fillStyle="#74452b";

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        return;
    }

    /* CASCA */

    if(o.type==="shell"){

        ctx.fillStyle="#e5a06d";

        ctx.beginPath();

        ctx.arc(
            x+w/2,
            y+h,
            w/2,
            Math.PI,
            0
        );

        ctx.fill();

        return;
    }

    /* PADRÃO */

    ctx.fillStyle="#666";

    ctx.beginPath();
    ctx.arc(x+w/2,y+h/2,Math.min(w,h)/2,0,Math.PI*2);
    ctx.fill();

}


/* =====================================================
   COCÔ
===================================================== */

function drawPoop(p){

    ctx.fillStyle="#75431f";

    ctx.beginPath();
    ctx.arc(p.x,p.y+8,13,0,Math.PI*2);

}

/* =====================================================
   ÁUDIO
===================================================== */

let audioContext=null;
let sadMusicTimer=null;

function getAudio(){

    if(!audioContext){

        audioContext=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state==="suspended")
        audioContext.resume();

    return audioContext;

}


function jumpSound(){

    try{

        const ac=getAudio();
        const now=ac.currentTime;

        const osc=ac.createOscillator();
        const gain=ac.createGain();

        osc.type="square";

        osc.frequency.setValueAtTime(430,now);
        osc.frequency.exponentialRampToValueAtTime(170,now+.13);

        gain.gain.setValueAtTime(.001,now);
        gain.gain.exponentialRampToValueAtTime(.07,now+.015);
        gain.gain.exponentialRampToValueAtTime(.001,now+.17);

        osc.connect(gain);
        gain.connect(ac.destination);

        osc.start(now);
        osc.stop(now+.18);

    }catch(e){}

}


function startSadMusic(){

    try{

        const ac=getAudio();

        stopSadMusic();

        const notes=[
            392,349,330,294,262,220,196
        ];

        let i=0;

        function note(){

            if(
                document.getElementById("gameOver")
                .style.display!=="flex"
            )return;

            const now=ac.currentTime;

            const osc=ac.createOscillator();
            const gain=ac.createGain();

            osc.type="sine";

            osc.frequency.value=notes[i];

            gain.gain.setValueAtTime(.001,now);
            gain.gain.linearRampToValueAtTime(.08,now+.15);
            gain.gain.linearRampToValueAtTime(.001,now+.75);

            osc.connect(gain);
            gain.connect(ac.destination);

            osc.start(now);
            osc.stop(now+.8);

            i=(i+1)%notes.length;

            sadMusicTimer=setTimeout(note,760);

        }

        note();

    }catch(e){}

}


function stopSadMusic(){

    if(sadMusicTimer){

        clearTimeout(sadMusicTimer);
        sadMusicTimer=null;

    }

}

/* =====================================================
   LOOP PRINCIPAL
===================================================== */

let lastTime=0;

function loop(time){

    if(!lastTime)
        lastTime=time;

    const delta=Math.min(time-lastTime,32);

    lastTime=time;

    const dt=delta/16.6667;

    const game=
        document.getElementById("game");

    if(game.style.display==="block"){

        drawBackground();

        if(started && running && player){

            /* FÍSICA */

            player.vy+=.58*dt;
            player.y+=player.vy*dt;

            if(player.y>=H-130){

                player.y=H-130;
                player.vy=0;
                player.grounded=true;

            }

            updateWolf();


            /* OBSTÁCULOS */

            obstacleTimer-=dt;

            if(obstacleTimer<=0){

                spawnObstacle();

                obstacleTimer=
                    120+
                    Math.random()*70;

            }

            for(
                let i=obstacles.length-1;
                i>=0;
                i--
            ){

                const o=obstacles[i];

                o.x-=GAME_SPEED*dt;

                drawObstacle(o);

                if(
                    collision(player,o)
                ){

                    hitObstacle();

                    /*
                       Remove o obstáculo depois
                       da colisão para evitar várias
                       perdas da mesma vida.
                    */

                    obstacles.splice(i,1);

                }

            }


            /* COCÔS */

            poopTimer-=dt;

            if(poopTimer<=0){

                spawnPoop();

                poopTimer=
                    90+
                    Math.random()*55;

            }

            for(
                let i=poops.length-1;
                i>=0;
                i--
            ){

                const p=poops[i];

                p.x-=GAME_SPEED*dt;

                drawPoop(p);

                const box={
                    x:p.x-14,
                    y:p.y-14,
                    width:28,
                    height:28
                };

                if(collision(player,box)){

                    poops.splice(i,1);

                    poop++;

                    document.getElementById(
                        "poopCount"
                    ).textContent=poop;

                    if(poop>=10){

                        completeMap();

                        break;

                    }

                }

            }

            obstacles=
                obstacles.filter(
                    o=>o.x>-180
                );

            poops=
                poops.filter(
                    p=>p.x>-60
                );

        }

    }

    requestAnimationFrame(loop);

}

/* =====================================================
   TECLADO
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(
        e.code!=="Space" &&
        e.code!=="ArrowUp"
    )return;

    e.preventDefault();

    if(
        document.getElementById("game")
        .style.display!=="block"
    )return;

    if(!started){

        started=true;
        running=true;

        document.getElementById("tap")
            .style.display="none";

        updateWolf();

        jumpSound();

    }else{

        jump();

        jumpSound();

    }

});


/* =====================================================
   INICIAR LOOP
===================================================== */

requestAnimationFrame(loop);

</script>

</body>
</html>
